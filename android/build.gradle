// build.gradle (nivel de proyecto)
//
// Placeholders a reemplazar: ninguno en este archivo — las credenciales
// reales viven en google-services.json (ver SETUP_SOCIAL_LOGIN.md, sección 10).

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // Requerido para que Firebase lea google-services.json en tiempo
        // de build — sin este plugin, la app compila pero Firebase Auth
        // lanza una excepción de configuración al iniciar.
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
