<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Korixa — real-world cycling routes and focused indoor training.">

  <!-- Google Sign-In (Web): el Client ID NO se declara aquí. Se pasa
       explícitamente vía `GoogleSignIn(clientId: ...)` en
       lib/core/di/injection.dart, que lo toma de
       lib/core/config/social_login_config.dart — única fuente de verdad.
       El meta tag `google-signin-client_id` se retiró a propósito: la
       librería de Google Identity Services lo auto-detecta y dispara su
       propia llamada a `initialize()` en paralelo con la del plugin,
       compitiendo por cuál "gana" según el orden de carga async
       (causaba el warning "initialize() is called multiple times" y
       enviaba, de forma no determinística, un client_id distinto al
       configurado). -->

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Korixa">

  <!-- Sin favicon/apple-touch-icon/manifest.json: no existe todavía un
       ícono/PWA manifest oficial de Korixa aprobado en el repo
       (`assets/images/`, `assets/icons/` están vacíos) — una vista
       previa sin ícono es preferible a referencias rotas a archivos
       inexistentes. Agregar esos assets es una tarea de branding
       separada, no de esta vista previa de Hosting. -->

  <title>Korixa</title>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
