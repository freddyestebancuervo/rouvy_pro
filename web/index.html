<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RidePro — Entrena como nunca antes.">

  <!-- Google Sign-In (Web): el Client ID NO se declara aquí. Se pasa
       explícitamente vía `GoogleSignIn(clientId: ...)` en
       lib/core/di/injection.dart, que lo toma de
       lib/core/config/social_login_config.dart — única fuente de verdad.
       El meta tag `google-signin-client_id` se retiró a propósito: la
       librería de Google Identity Services lo auto-detecta y dispara su
       propia llamada a `initialize()` en paralelo con la del plugin,
       compitiendo por cuál "gana" según el orden de carga async
       (causaba el warning "initialize() is called multiple times" y
       enviaba, de forma no determinística, un client_id distinto al
       configurado). -->

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RidePro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RidePro</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
