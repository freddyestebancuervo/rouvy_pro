name: Backend — Production DB role hardening (ephemeral admin, manual dispatch only)

# T-F1.2 Point 8C — this file's content was REPLACED IN PLACE (PR #115 final-
# integration remediation, WIF Option W1) with the ephemeral-admin
# architecture proven in a disposable Cloud SQL instance
# (TF12-POINT8C-EPHEMERAL-HARDENER-ADMIN-NONPROD-PROOF-20260902): NO standing
# PostgreSQL hardener administrator exists at any time. See git history for
# the prior persistent-admin implementation this replaces.
#
# =============================================================================
# ZERO-STANDING-PRIVILEGE MODEL (PR #115 zero-standing-privilege final
# remediation) — READ THIS BEFORE TOUCHING ANY JOB BELOW
# =============================================================================
# A prior revision of this file left the Stage 1 ephemeral admin (cloudsql-
# superuser + ADMIN OPTION + DSN secret + Cloud Run Job) ALIVE across the
# entire Human Gate wait — deliberately, because the identity was meant to be
# "reused" by the later `apply` dispatch. A reactive 3600s "lease", checked
# only if/when `apply` was ever dispatched, was the sole guard against that
# window being unbounded. If `apply` was never dispatched (operator abandons
# the operation, closes their laptop, forgets), NO code ever ran — the
# privileged identity stayed alive on Production indefinitely. That
# contradicted "time-scoped"/"ephemeral"/"zero-standing-privilege" and was a
# real P1, independent of anything the reactive lease claimed to guarantee.
#
# The fix is structural, not a shorter timer: NO PostgreSQL cloudsqlsuperuser
# identity may exist while waiting for a human. Concretely:
#
#   STAGE 1 (`bootstrap_and_preflight`):
#     bootstrap a fresh ephemeral admin -> preflight -> capture non-secret
#     evidence -> ALWAYS full cleanup (success OR failure, no exceptions) ->
#     STOP. By the time this dispatch's summary is visible to the human, the
#     admin/secret/Job/ADMIN OPTION granted in this run are ALREADY GONE —
#     independently re-verified absent before the run is allowed to end
#     clean. There is nothing left to expire, lease, or forget.
#
#   HUMAN reviews the Stage 1 evidence (non-secret: operation_id, source SHA,
#   preflight disposition) completely outside any time pressure, because
#   nothing privileged is waiting on their decision.
#
#   STAGE 2 (`apply`) — a SEPARATE, explicitly-authorized Human Gate dispatch:
#     bootstraps a BRAND NEW ephemeral admin (a fresh, independently-random
#     identity — never a resurrection of Stage 1's, which no longer exists)
#     -> runs the real hardener preflight AGAIN, against current live state,
#     as a mandatory safety prerequisite inside this same authorized dispatch
#     -> if that fresh preflight passes: apply, remove korixa_app's
#     cloudsqlsuperuser, strict verify -> ALWAYS full cleanup.
#
# PREFLIGHT_OPERATION_ID vs APPLY_EXECUTION_ID: the `operation_id` an
# operator copies from Stage 1's summary into an `apply` dispatch is now
# PURELY an audit/binding value — proof the human reviewed a SPECIFIC Stage 1
# preflight run (together with `operation_source_sha`). It is NEVER reused to
# name Stage 2's own resources, because Stage 1's resources under that id no
# longer exist by the time Stage 2 runs. `derive-operation-names` mints a
# SEPARATE, fresh, independently-random `apply_execution_id` for every
# `apply` dispatch, and Stage 2's ephemeral admin/secret/Job are derived from
# THAT — never from the passthrough `operation_id`. `cleanup_only` remains
# generic over either kind of id (both are 12 lowercase hex chars, and
# resource-name derivation is a pure function of whichever one you give it) —
# it exists purely for incident recovery now (see cleanup-only's own header),
# never as part of a normal successful path, since both Stage 1 and Stage 2
# already self-clean unconditionally.
#
# NO REACTIVE LEASE: `EPHEMERAL_ADMIN_MAX_LIFETIME_SECONDS` and its entire
# cross-dispatch "lease" check (computed from a secret's `createTime`,
# enforced only if/when `apply` happened to be dispatched) have been REMOVED,
# not shortened — a passive timer that only evaluates when someone later
# dispatches something was never actually a resource-expiry mechanism, and
# claiming otherwise (as a prior revision's Stage 1 summary text did) is now
# recognized as false. The only "time budget" concept left in this file is
# each job's own GitHub Actions `timeout-minutes:` — a genuine
# MAX_EXECUTION_WINDOW for the single dispatch it bounds, enforced by the
# platform itself, never described as something that deletes a resource on
# its own. Nothing
# in this file, in any comment or step-summary text, claims a resource
# auto-expires without something actually executing a delete.
# =============================================================================
#
# WHY WIF OPTION W1 (this filename, not a new one): a live read-only audit of
# Production's WIF provider (`github-production-deployer`) and the deployer
# SA's `roles/iam.workloadIdentityUser` binding confirmed both are scoped, by
# an explicit `workflow_ref`/`job_workflow_ref` filename allowlist, to
# `production-db-role-hardening.yml` — this exact filename. No WIF/IAM
# mutation was performed or is required by this remediation.
#
# WHY THE OLD MIGRATION-SECRET IDENTITY MODEL IS GONE: the prior content of
# this file mounted `korixa-production-migration-database-url` as the
# hardener's connected identity — proven, across this investigation, to hold
# `korixa_app`'s OWN credentials (the target role itself), which
# `db-role-hardener.ts` correctly and unconditionally rejects
# (`TARGET_ROLE_IDENTITY_REJECTED`). That secret is NEVER read or referenced
# anywhere in this file's current content.
#
# ACTIVATION INTERLOCK (same as every other Production workflow in this
# repo): `on: workflow_dispatch` ONLY. No `schedule:` trigger exists or is
# introduced anywhere in this file.
#
# THREE MODES, TWO HUMAN GATES, EACH SELF-CLEANING:
#
#   1. `bootstrap_and_preflight` (Stage 1) — bootstraps a fresh ephemeral
#      admin, runs preflight, captures non-secret evidence, and — regardless
#      of success or failure — ALWAYS fully cleans up before the run ends.
#      Its only output is that non-secret evidence plus the
#      `preflight_operation_id` the operator must copy into a later `apply`
#      dispatch, if they choose to proceed.
#
#   2. `apply` (Stage 2) — a fully separate, explicitly-authorized dispatch.
#      Takes `operation_id` (= the Stage 1 `preflight_operation_id` being
#      referenced) and `operation_source_sha` as required inputs, verifies
#      `operation_source_sha` still equals `github.sha` (main hasn't
#      advanced), mints a brand-new `apply_execution_id`, bootstraps a fresh
#      ephemeral admin under it, runs preflight AGAIN against current live
#      state, and only if that fresh preflight passes proceeds to apply,
#      remove `korixa_app`'s `cloudsqlsuperuser`, and strict-verify. ALWAYS
#      attempts full cleanup of the Stage 2 identity regardless of where in
#      this sequence it stopped.
#
#   3. `cleanup_only` — incident recovery only. Takes an `operation_id`
#      (either a `preflight_operation_id` or an `apply_execution_id` — the
#      derivation is identical either way), discovers and removes exactly
#      that id's resources, idempotent (already-absent is success). Exists
#      only for the case a hard-cancelled runner stranded resources before
#      that dispatch's own `always()` cleanup job ever ran — NOT part of any
#      normal successful path any more, since both Stage 1 and Stage 2
#      self-clean unconditionally. Its required security property is NOT
#      "creates nothing" — it MAY deploy/redeploy the exact operation-scoped
#      ephemeral Cloud Run Job (never a new or different one) when necessary
#      to revoke ADMIN OPTION over the private VPC path before deleting the
#      admin. The actual invariant, always true: `cleanup_only` can never
#      create or elevate a PostgreSQL identity, a Secret Manager secret, an
#      IAM privilege, a role/target membership, or an application privilege.
#
# SOURCE SHA BINDING (corrected — PR #115 P1 remediation, Phase 9): `apply`
# requires `operation_source_sha` to equal `github.sha` EXACTLY. IMPORTANT
# CORRECTION: an earlier version of this comment claimed an operator could
# work around `main` having advanced by dispatching `apply` with
# `gh workflow run ... --ref <the exact source SHA>`. That is FALSE and
# UNSUPPORTED — confirmed via `gh workflow run --help`, which documents
# `--ref` as accepting only a "Branch or tag name," never a commit SHA;
# `workflow_dispatch` itself has no mechanism to pin execution to an
# arbitrary historical commit. Combined with this workflow's own
# `github.ref == refs/heads/main` guard requirement, there is NO supported
# way to re-dispatch `apply` against an old SHA once `main` has moved.
#
# The actual, fail-closed policy is therefore simpler than the old comment
# implied: IF `main`'s current tip still equals `operation_source_sha`,
# `apply` proceeds normally. IF `main` advanced, `apply` is refused
# (HOLD_OPERATION_CONTEXT_DRIFT) with NO retry path for that same operation
# — NO existe forma soportada de re-dispatchear apply contra el SHA original.
# The correct recovery is: dispatch `cleanup_only` for that `operation_id` if
# anything was stranded (usually nothing under the zero-standing-privilege
# model, since guard rejects before any Stage 2 resource is created), then
# start an entirely new operation via a fresh `bootstrap_and_preflight`
# dispatch on current `main`, under its own new Human Gate. Because Stage 1's
# resources are already gone by construction, and a SHA-drift rejection in
# `guard` happens before `bootstrap-apply-admin` ever runs, SHA drift never
# requires emergency cleanup of anything that actually got created.
#
# NAMING NOTE: resource-name derivation (ephemeral admin username, ephemeral
# DSN secret name) is DUPLICATED here in bash from
# `backend/src/ops/hardener-operation.ts`'s pure functions, because GitHub
# Actions bash steps cannot import a TypeScript module without a build step.
# `backend/src/ops/hardener-operation.spec.ts` is the single source of truth
# for the exact format; this file's `derive-operation-names` step must be
# kept in exact sync with it.
#
# =============================================================================
# PRIVATE-VPC-ONLY DESIGN — NO DATA API, NO REGIONAL SECRET (PR #115 P1-B
# remediation): the ADMIN OPTION grant/revoke runs entirely through
# `backend/src/ops/db-hardener-bootstrap.ts` (`dist/ops/db-hardener-
# bootstrap.js`), a narrowly-scoped typed entrypoint executed inside the SAME
# ephemeral Cloud Run Job used for preflight/apply/verify — same
# `MIGRATION_EXECUTOR_SA`, same `--vpc-egress=private-ranges-only`, same
# private Cloud SQL IP, same single global DSN secret per operation. There is
# no regional secret, no `execute-sql`, and no `dataApiAccess` dependency
# anywhere in this file (verified by `hardener-workflow-contract.spec.ts`).
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bootstrap_and_preflight (stage 1 — bootstraps, preflights, ALWAYS cleans up before returning) | apply (stage 2 — requires the preflight_operation_id from a completed stage 1 run; bootstraps a brand-new fresh identity, re-preflights, applies, ALWAYS cleans up) | cleanup_only (incident recovery only, requires operation_id)"
        required: true
        type: choice
        options:
          - bootstrap_and_preflight
          - apply
          - cleanup_only
      operation_id:
        description: "For apply: the preflight_operation_id printed in a completed bootstrap_and_preflight run's summary — audit/binding value only, NEVER used to name Stage 2's own resources (a fresh apply_execution_id is minted instead). For cleanup_only: the exact preflight_operation_id or apply_execution_id (12 hex chars) whose specific resource set needs incident-recovery cleanup. Must be left EMPTY for bootstrap_and_preflight (a fresh one is generated)."
        required: false
        type: string
        default: ""
      operation_source_sha:
        description: "Required for apply — must equal the exact source SHA the bootstrap_and_preflight run used (HOLD_OPERATION_CONTEXT_DRIFT otherwise). Ignored/unused for bootstrap_and_preflight (github.sha is used). Optional for cleanup_only — if provided, recorded as ORIGINAL_OPERATION_SHA alongside CLEANUP_IMPLEMENTATION_SHA (github.sha) for audit purposes only, never enforced (recovery may legitimately run newer trusted cleanup code)."
        required: false
        type: string
        default: ""
      confirmation:
        description: "Must be exactly BOOTSTRAP_AND_PREFLIGHT_EPHEMERAL_HARDENER (bootstrap_and_preflight), APPLY_EPHEMERAL_HARDENER_HARDEN_KORIXA_APP (apply), or CLEANUP_ONLY_EPHEMERAL_HARDENER (cleanup_only) — must match the chosen mode."
        required: true
        type: string

permissions:
  contents: read

env:
  PRODUCTION_PROJECT: ridepro-dbafe
  PRODUCTION_REGION: southamerica-east1
  CLOUD_SQL_INSTANCE: korixa-production-postgres
  # PR #115 P2 remediation: expectativas exactas de postura de red/versión
  # que `verify-prerequisites-instance` prueba estructuradamente (JSON, nunca
  # `ipAddresses[0]` por índice) antes de resolver EXPECTED_DB_HOST.
  EXPECTED_DATABASE_VERSION: POSTGRES_16
  EXPECTED_VPC_NETWORK: korixa-production-vpc
  TARGET_DATABASE: korixa_production
  TARGET_ROLE: korixa_app
  DEPLOYER_SA: korixa-production-deployer@ridepro-dbafe.iam.gserviceaccount.com
  MIGRATION_EXECUTOR_SA: korixa-prod-migration-exec@ridepro-dbafe.iam.gserviceaccount.com
  ARTIFACT_IMAGE: southamerica-east1-docker.pkg.dev/ridepro-dbafe/korixa-backend/api
  # Distinto, deliberadamente, del Job persistente legado
  # (`korixa-production-db-role-hardener`) — ver
  # `deriveEphemeralJobName` en hardener-operation.ts. Reutilizado sin
  # cambios tanto para la identidad de Stage 1 (preflight_operation_id) como
  # para la identidad de Stage 2 (apply_execution_id) — el prefijo es el
  # mismo, el id aleatorio que lo completa nunca lo es.
  EPHEMERAL_JOB_PREFIX: korixa-prod-hardener-once-
  EPHEMERAL_ADMIN_PREFIX: korixa_db_hardener_once_
  EPHEMERAL_DSN_SECRET_PREFIX: korixa-production-db-hardener-dsn-

jobs:
  # ===========================================================================
  # Job 1 — guard. Permission-less, sin checkout, sin OIDC, sin gcloud.
  # ===========================================================================
  guard:
    name: Guard — manual-dispatch-only, sin acceso cloud
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      guard_pass: ${{ steps.checks.outputs.guard_pass }}
      mode: ${{ steps.checks.outputs.mode }}
      operation_id: ${{ steps.checks.outputs.operation_id }}
      # PR #115 P1-4a remediation: `sha_drift_detected` se escribe ANTES del
      # `exit 1` del chequeo de drift — GitHub Actions conserva los outputs
      # ya escritos por `$GITHUB_OUTPUT` aunque el step/job termine en
      # failure. Esto permite que `derive-operation-names` y `cleanup-only`
      # (vía `if: always()`) sigan pudiendo derivar los nombres de recurso y
      # disparar cleanup automático para una operación real, rechazada
      # específicamente por drift de SHA — nunca para un dispatch
      # malformado/no autenticado, que nunca llega a esta rama. Bajo el
      # modelo zero-standing-privilege, esta rama normalmente no tiene nada
      # que limpiar (Stage 2 aún no bootstrapeó nada), pero se conserva por
      # si un dispatch previo de apply llegó a crear su identidad efímera y
      # el operador reintenta con un SHA desactualizado.
      sha_drift_detected: ${{ steps.checks.outputs.sha_drift_detected }}
    steps:
      - name: Validar origen, ref, SHA, modo, confirmación, operation_id (sin efectos, sin cloud)
        id: checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          OPERATION_ID: ${{ inputs.operation_id }}
          OPERATION_SOURCE_SHA: ${{ inputs.operation_source_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ "$EVENT_NAME" = "workflow_dispatch" ] || fail "EVENT_NAME esperado 'workflow_dispatch', obtenido '$EVENT_NAME'."
          [ "$REPOSITORY" = "freddyestebancuervo/rouvy_pro" ] || fail "REPOSITORY inesperado: '$REPOSITORY'"
          [ "$REF" = "refs/heads/main" ] || fail "REF esperado 'refs/heads/main', obtenido '$REF'."
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "github.sha no es un SHA-1 completo (40 hex minúsculas): '$SHA'"

          case "$MODE" in
            bootstrap_and_preflight) EXPECTED_CONFIRMATION="BOOTSTRAP_AND_PREFLIGHT_EPHEMERAL_HARDENER" ;;
            apply)                   EXPECTED_CONFIRMATION="APPLY_EPHEMERAL_HARDENER_HARDEN_KORIXA_APP" ;;
            cleanup_only)            EXPECTED_CONFIRMATION="CLEANUP_ONLY_EPHEMERAL_HARDENER" ;;
            *) fail "mode debe ser exactamente uno de bootstrap_and_preflight/apply/cleanup_only: '$MODE'" ;;
          esac
          [ "$CONFIRMATION" = "$EXPECTED_CONFIRMATION" ] || fail "confirmation no coincide con el valor exacto exigido para mode='$MODE'."

          if [ "$MODE" = "bootstrap_and_preflight" ]; then
            [ -z "$OPERATION_ID" ] || fail "operation_id debe estar VACÍO para bootstrap_and_preflight — se genera uno nuevo, nunca se acepta uno provisto por el operador para esta etapa."
          else
            [[ "$OPERATION_ID" =~ ^[0-9a-f]{12}$ ]] || fail "operation_id inválido para mode='$MODE' — debe ser exactamente 12 caracteres hexadecimales en minúsculas (ver hardener-operation.ts). Recibido: '$OPERATION_ID'"
          fi

          if [ "$MODE" = "apply" ]; then
            [[ "$OPERATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "operation_source_sha inválido para mode='apply': '$OPERATION_SOURCE_SHA'"
          fi

          # PR #115 P1-4a remediation: mode/operation_id se escriben tan
          # pronto como su FORMATO está validado — antes del chequeo de
          # drift de SHA, que es el ÚNICO chequeo restante que puede fallar
          # sobre una operación por lo demás legítima y bien formada.
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "operation_id=$OPERATION_ID" >> "$GITHUB_OUTPUT"

          if [ "$MODE" = "apply" ] && [ "$OPERATION_SOURCE_SHA" != "$SHA" ]; then
            echo "sha_drift_detected=YES" >> "$GITHUB_OUTPUT"
            fail "HOLD_OPERATION_CONTEXT_DRIFT — operation_source_sha ('$OPERATION_SOURCE_SHA') no coincide con github.sha actual ('$SHA'). main avanzó desde el dispatch de bootstrap_and_preflight que produjo ese preflight_operation_id. NO existe forma soportada de re-dispatchear apply contra el SHA original. Bajo el modelo zero-standing-privilege esta rama se rechaza ANTES de que Stage 2 bootstrapee ninguna identidad — normalmente no hay nada que limpiar; cleanup-only se dispara igual por si un dispatch previo llegó a crear algo. La recuperación es: iniciar una operación nueva con bootstrap_and_preflight sobre el main actual, bajo un nuevo Human Gate."
          fi

          echo "guard_pass=YES" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 2 — checkout y reverificación de frescura. Igual que el workflow
  # legado.
  # ===========================================================================
  prepare-inputs:
    name: Prepare inputs (checkout only)
    needs: guard
    if: needs.guard.outputs.guard_pass == 'YES'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verificar SHA fuente exacto
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          [ "$CHECKED_OUT_SHA" = "${{ github.sha }}" ] || { echo "::error::Checkout SHA mismatch."; exit 1; }
          echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 3 — deriva los identificadores y los tres nombres de recursos, de
  # forma permission-less. Espejo EXACTO de hardener-operation.ts — cualquier
  # cambio ahí requiere el mismo cambio acá.
  #
  # ZERO-STANDING-PRIVILEGE (Phase 2): bootstrap_and_preflight y cleanup_only
  # derivan los tres nombres de recurso DIRECTAMENTE del `operation_id` que
  # ya tienen (fresco o provisto por el operador, respectivamente) — sin
  # cambios respecto al diseño anterior. `apply` es DISTINTO: el
  # `operation_id` de su input (`preflight_operation_id`) se conserva como
  # valor de auditoría/binding, pero los nombres de recurso que Stage 2
  # realmente crea se derivan de un `apply_execution_id` FRESCO e
  # independientemente aleatorio — nunca del preflight_operation_id, porque
  # los recursos de Stage 1 bajo ese id ya no existen (Stage 1 se auto-limpia
  # siempre). Esto es lo que impide "fingir" que se reutilizan los recursos
  # de Stage 1.
  # ===========================================================================
  derive-operation-names:
    name: Derive operation/execution ids and resource names (sin cloud)
    needs: guard
    # PR #115 P1-4a remediation: también corre cuando guard rechazó apply
    # específicamente por drift de SHA (`sha_drift_detected`) — necesario
    # para que el cleanup automático de esa operación pueda derivar sus
    # nombres de recurso, aunque guard_pass haya sido NO en ese dispatch.
    if: |
      always() &&
      (needs.guard.outputs.guard_pass == 'YES' || needs.guard.outputs.sha_drift_detected == 'YES')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      operation_id: ${{ steps.derive.outputs.operation_id }}
      apply_execution_id: ${{ steps.derive.outputs.apply_execution_id }}
      ephemeral_admin_username: ${{ steps.derive.outputs.ephemeral_admin_username }}
      ephemeral_dsn_secret_name: ${{ steps.derive.outputs.ephemeral_dsn_secret_name }}
      ephemeral_job_name: ${{ steps.derive.outputs.ephemeral_job_name }}
    steps:
      - name: Generar/reutilizar identificadores y derivar nombres
        id: derive
        shell: bash
        env:
          MODE: ${{ needs.guard.outputs.mode }}
          INPUT_OPERATION_ID: ${{ needs.guard.outputs.operation_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          APPLY_EXECUTION_ID=""
          if [ "$MODE" = "bootstrap_and_preflight" ]; then
            OPERATION_ID="$(openssl rand -hex 6)"
            RESOURCE_ID="$OPERATION_ID"
          elif [ "$MODE" = "apply" ]; then
            # preflight_operation_id: passthrough puro, solo auditoría/binding.
            OPERATION_ID="$INPUT_OPERATION_ID"
            # apply_execution_id: identidad FRESCA e independiente — Stage 2
            # nunca reutiliza los nombres de recurso de Stage 1.
            APPLY_EXECUTION_ID="$(openssl rand -hex 6)"
            [[ "$APPLY_EXECUTION_ID" =~ ^[0-9a-f]{12}$ ]] || fail "apply_execution_id derivado inválido: '$APPLY_EXECUTION_ID'"
            [ "$APPLY_EXECUTION_ID" != "$OPERATION_ID" ] || fail "INVARIANT_VIOLATION — apply_execution_id coincidió por casualidad con preflight_operation_id (probabilidad ~2^-48); rechazado por seguridad, reintentar el dispatch."
            RESOURCE_ID="$APPLY_EXECUTION_ID"
          else
            OPERATION_ID="$INPUT_OPERATION_ID"
            RESOURCE_ID="$OPERATION_ID"
          fi
          [[ "$OPERATION_ID" =~ ^[0-9a-f]{12}$ ]] || fail "operation_id derivado inválido: '$OPERATION_ID'"
          [[ "$RESOURCE_ID" =~ ^[0-9a-f]{12}$ ]] || fail "resource_id derivado inválido: '$RESOURCE_ID'"

          echo "operation_id=$OPERATION_ID" >> "$GITHUB_OUTPUT"
          echo "apply_execution_id=$APPLY_EXECUTION_ID" >> "$GITHUB_OUTPUT"
          echo "ephemeral_admin_username=${{ env.EPHEMERAL_ADMIN_PREFIX }}${RESOURCE_ID}" >> "$GITHUB_OUTPUT"
          echo "ephemeral_dsn_secret_name=${{ env.EPHEMERAL_DSN_SECRET_PREFIX }}${RESOURCE_ID}" >> "$GITHUB_OUTPUT"
          echo "ephemeral_job_name=${{ env.EPHEMERAL_JOB_PREFIX }}${RESOURCE_ID}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Jobs 4a-4d — resolución del artefacto inmutable. IDÉNTICO en espíritu a la
  # implementación legacy de este mismo archivo — se ejecuta para los TRES
  # modos, ligada a SOURCE_SHA, nunca a ningún operation/execution id.
  # ===========================================================================
  check-artifact-existence:
    name: Check whether the exact SHA artifact already exists (read-only)
    needs: [guard, prepare-inputs]
    if: needs.guard.outputs.guard_pass == 'YES' && (needs.guard.outputs.mode == 'bootstrap_and_preflight' || needs.guard.outputs.mode == 'apply' || needs.guard.outputs.mode == 'cleanup_only')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_exists: ${{ steps.check.outputs.artifact_exists }}
    steps:
      - name: Google Auth — WIF to Production deployer SA (read-only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Contar tags exactos == SOURCE_SHA (solo lectura)
        id: check
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          command -v python3 >/dev/null 2>&1 || fail "ARTIFACT_EXISTENCE_CHECK=PARSER_UNAVAILABLE — FAIL_CLOSED."

          LIST_STDOUT="$(mktemp)"; LIST_STDERR="$(mktemp)"
          trap 'rm -f "$LIST_STDOUT" "$LIST_STDERR"' EXIT
          set +e
          gcloud artifacts docker images list "${{ env.ARTIFACT_IMAGE }}" --include-tags --project="${{ env.PRODUCTION_PROJECT }}" --format=json >"$LIST_STDOUT" 2>"$LIST_STDERR"
          LIST_EXIT=$?
          set -e
          if [ "$LIST_EXIT" -ne 0 ]; then
            LIST_ERR="$(grep -v 'gha-creds' "$LIST_STDERR" || true)"
            fail "ARTIFACT_EXISTENCE_CHECK=LOOKUP_FAILED — exit=$LIST_EXIT. $LIST_ERR"
          fi

          MATCH_COUNT="$(python3 - "$SOURCE_SHA" "$LIST_STDOUT" <<'PY'
          import json, sys
          source_sha, json_path = sys.argv[1], sys.argv[2]
          with open(json_path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          count = 0
          for image in payload:
              for tag in (image.get("tags") or []):
                  if tag == source_sha:
                      count += 1
          print(count)
          PY
          )"
          case "$MATCH_COUNT" in
            0) echo "artifact_exists=NO" >> "$GITHUB_OUTPUT" ;;
            1) echo "artifact_exists=YES" >> "$GITHUB_OUTPUT" ;;
            *) fail "ARTIFACT_EXISTENCE_CHECK=INVARIANT_VIOLATION — $MATCH_COUNT coincidencias, se esperaba 0 o 1." ;;
          esac

  build-production-artifact:
    name: Build & publish Production artifact (artifact absent)
    needs: [guard, prepare-inputs, check-artifact-existence]
    if: needs.check-artifact-existence.outputs.artifact_exists == 'NO'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_backend-build-publish-production.yml
    with:
      operation: build-publish
      source_sha: ${{ github.sha }}

  reuse-existing-artifact:
    name: Reuse existing Production artifact (never pushes)
    needs: [guard, prepare-inputs, check-artifact-existence]
    if: needs.check-artifact-existence.outputs.artifact_exists == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      source_sha: ${{ steps.revision.outputs.source_sha }}
      immutable_ref: ${{ steps.revision.outputs.immutable_ref }}
    steps:
      - name: Google Auth — WIF to Production deployer SA (read-only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Reconfirmar EXACTAMENTE un tag == SOURCE_SHA
        id: recheck
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          IMAGE_TAG_REF="${{ env.ARTIFACT_IMAGE }}:${SOURCE_SHA}"
          MATCH_COUNT="$(gcloud artifacts docker images list "${{ env.ARTIFACT_IMAGE }}" --include-tags --project="${{ env.PRODUCTION_PROJECT }}" --format=json | python3 -c "
          import json, sys
          payload = json.load(sys.stdin)
          count = sum(1 for image in payload for tag in (image.get('tags') or []) if tag == '$SOURCE_SHA')
          print(count)
          ")"
          [ "$MATCH_COUNT" = "1" ] || fail "REUSE_RECHECK=UNEXPECTED_MATCH_COUNT — $MATCH_COUNT."
          echo "image_tag_ref=$IMAGE_TAG_REF" >> "$GITHUB_OUTPUT"
      - name: Resolver digest de la imagen EXISTENTE (nunca push)
        id: digest
        shell: bash
        env:
          IMAGE_TAG_REF: ${{ steps.recheck.outputs.image_tag_ref }}
        run: |
          set -euo pipefail
          ARTIFACT_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG_REF" --project="${{ env.PRODUCTION_PROJECT }}" --format='value(image_summary.digest)')"
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest inválido"; exit 1; }
          echo "immutable_ref=${{ env.ARTIFACT_IMAGE }}@${ARTIFACT_DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Configurar Docker (solo pull)
        shell: bash
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet
      - name: Descargar la imagen inmutable EXISTENTE (solo lectura)
        shell: bash
        env:
          IMMUTABLE_REF: ${{ steps.digest.outputs.immutable_ref }}
        run: docker pull "$IMMUTABLE_REF"
      - name: Verificar label OCI de revisión
        id: revision
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare-inputs.outputs.source_sha }}
          IMMUTABLE_REF: ${{ steps.digest.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          ACTUAL_LABEL="$(docker image inspect "$IMMUTABLE_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [ "$ACTUAL_LABEL" = "$SOURCE_SHA" ] || { echo "::error::REUSE_REVISION_MISMATCH"; exit 1; }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=$IMMUTABLE_REF" >> "$GITHUB_OUTPUT"

  resolve-artifact:
    name: Resolve artifact identity (sin cloud)
    needs: [guard, build-production-artifact, reuse-existing-artifact]
    if: |
      always() &&
      needs.guard.outputs.guard_pass == 'YES' &&
      (needs.guard.outputs.mode == 'bootstrap_and_preflight' || needs.guard.outputs.mode == 'apply' || needs.guard.outputs.mode == 'cleanup_only') &&
      (needs.build-production-artifact.result == 'success' || needs.reuse-existing-artifact.result == 'success')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      verify_pass: ${{ steps.verify.outputs.verify_pass }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      immutable_ref: ${{ steps.verify.outputs.immutable_ref }}
    steps:
      - name: Reverificar source_sha e immutable_ref (sin efectos, sin cloud)
        id: verify
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BUILD_SOURCE_SHA: ${{ needs.build-production-artifact.outputs.source_sha }}
          BUILD_IMMUTABLE_REF: ${{ needs.build-production-artifact.outputs.immutable_ref }}
          REUSE_SOURCE_SHA: ${{ needs.reuse-existing-artifact.outputs.source_sha }}
          REUSE_IMMUTABLE_REF: ${{ needs.reuse-existing-artifact.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          if [ -n "$BUILD_SOURCE_SHA" ] && [ -n "$REUSE_SOURCE_SHA" ]; then
            fail "INVARIANT_VIOLATION — build y reuse ambos produjeron salida."
          fi
          if [ -n "$BUILD_SOURCE_SHA" ]; then
            SOURCE_SHA="$BUILD_SOURCE_SHA"; IMMUTABLE_REF="$BUILD_IMMUTABLE_REF"
          elif [ -n "$REUSE_SOURCE_SHA" ]; then
            SOURCE_SHA="$REUSE_SOURCE_SHA"; IMMUTABLE_REF="$REUSE_IMMUTABLE_REF"
          else
            fail "Ni build ni reuse produjeron source_sha."
          fi
          [ "$SOURCE_SHA" = "$EXPECTED_SHA" ] || fail "source_sha no coincide con github.sha."
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=$IMMUTABLE_REF" >> "$GITHUB_OUTPUT"
          echo "verify_pass=YES" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 5b — TF12-POINT8C-IAM-P1 remediation. Gate de readiness de solo
  # lectura: prueba, ANTES de cualquier mutación real, que DEPLOYER_SA tiene
  # exactamente los permisos IAM que bootstrap-ephemeral-admin/
  # bootstrap-apply-admin están por ejercer. Existe porque el run real
  # 33718581473 falló con HTTP 403 en `gcloud sql users create` —
  # DEPLOYER_SA nunca tuvo ningún permiso de mutación de Cloud SQL users ni
  # de Secret Manager, y ninguna auditoría previa lo había verificado
  # (todas verificaban "el IAM no cambió", nunca "el IAM alcanza"). Este job
  # cierra esa brecha de PROCESO, no solo la brecha de IAM puntual.
  #
  # El conjunto exacto de 12 permisos (10 operativos + 2 meta-permissions
  # que este mismo job necesita para poder leerse a sí mismo) es un espejo
  # bash de `backend/src/ops/production-hardener-required-permissions.ts`
  # — igual disciplina de duplicación documentada que
  # `derive-operation-names` respecto de `hardener-operation.ts`.
  # `hardener-workflow-contract.spec.ts` prueba que ambas listas coinciden
  # exactamente.
  #
  # Solo lectura: `gcloud projects get-iam-policy` + `gcloud iam roles
  # describe` (ambos GET, nunca mutan nada). Nunca vuelca la política IAM
  # completa (que incluye todos los `members` de cada binding, no solo
  # DEPLOYER_SA) ni la lista completa de permisos de cada rol a los logs —
  # solo los nombres de los permisos REQUERIDOS que resultaron faltantes o
  # prohibidos, nunca más que eso.
  #
  # EXPECTATIVA ACTUAL: este job DEBE fallar contra el estado real de
  # Producción hasta que el Human Gate de remediación IAM
  # (IAM_CUSTOM_ROLE_CREATE_AND_GRANT) se aplique — eso es exactamente lo
  # que se espera y lo correcto, no un defecto de este job.
  # ===========================================================================
  verify-deployer-permissions:
    name: Verify DEPLOYER_SA has required Cloud SQL/Secret Manager permissions (read-only — HOLD if insufficient)
    needs: guard
    if: needs.guard.outputs.guard_pass == 'YES' && (needs.guard.outputs.mode == 'bootstrap_and_preflight' || needs.guard.outputs.mode == 'apply')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Leer roles otorgados a DEPLOYER_SA y comparar su expansión de permisos contra el manifiesto requerido (solo lectura)
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::HOLD_INSUFFICIENT_DEPLOYER_PERMISSIONS — $1"; exit 1; }
          command -v python3 >/dev/null 2>&1 || fail "PARSER_UNAVAILABLE — python3 requerido, FAIL_CLOSED."

          # Espejo bash EXACTO de ALL_REQUIRED_DEPLOYER_PERMISSIONS +
          # READINESS_GATE_META_PERMISSIONS en
          # production-hardener-required-permissions.ts (12 permisos —
          # probado idéntico por hardener-workflow-contract.spec.ts).
          # TF12-POINT8C-IAM-P1-EFFECTIVE-ACTAS-FINAL-REMEDIATION:
          # iam.serviceAccounts.getIamPolicy fue REMOVIDA — el chequeo de
          # actAs (ver step siguiente) ahora usa testIamPermissions, que no
          # exige ningún permiso IAM adicional más allá de credenciales
          # autenticadas válidas (verificado en vivo, de solo lectura).
          REQUIRED_PERMISSIONS=(
            "cloudsql.users.create"
            "cloudsql.users.delete"
            "cloudsql.users.get"
            "cloudsql.users.update"
            "secretmanager.secrets.create"
            "secretmanager.secrets.delete"
            "secretmanager.secrets.get"
            "secretmanager.secrets.getIamPolicy"
            "secretmanager.secrets.setIamPolicy"
            "secretmanager.versions.add"
            "iam.roles.get"
            "resourcemanager.projects.getIamPolicy"
          )
          FORBIDDEN_PERMISSIONS=(
            "secretmanager.versions.access"
          )

          PROJECT_POLICY_JSON="$(mktemp)"
          trap 'rm -f "$PROJECT_POLICY_JSON" "${ALL_GRANTED:-}"' EXIT
          set +e
          gcloud projects get-iam-policy "${{ env.PRODUCTION_PROJECT }}" --format=json >"$PROJECT_POLICY_JSON" 2>/dev/null
          POLICY_READ_EXIT=$?
          set -e
          [ "$POLICY_READ_EXIT" -eq 0 ] || fail "No se pudo leer la política IAM del proyecto — falta resourcemanager.projects.getIamPolicy en DEPLOYER_SA (meta-permission que este mismo gate necesita para auto-verificarse)."

          DEPLOYER_MEMBER="serviceAccount:${{ env.DEPLOYER_SA }}"
          # Fail-closed ante bindings CONDICIONALES (Fase 8 red team): un
          # binding con `condition` puede evaluar false en el momento real
          # de la mutación aunque el rol aparezca "otorgado" en la política
          # ahora mismo — nunca se cuenta como suficiente sin evaluar la
          # condición, lo cual este gate no intenta hacer (fuera de alcance:
          # evaluar CEL contra el contexto real de la request). Un binding
          # condicional se reporta aparte y NUNCA contribuye permisos a
          # DEPLOYER_ROLES — un HOLD por esto es la respuesta correcta, no
          # un falso PASS.
          CONDITIONAL_ROLES="$(python3 -c "
          import json
          with open('$PROJECT_POLICY_JSON', encoding='utf-8') as handle:
              policy = json.load(handle)
          member = '$DEPLOYER_MEMBER'
          roles = sorted({b['role'] for b in policy.get('bindings', []) if member in (b.get('members') or []) and b.get('condition')})
          print('\n'.join(roles))
          ")"
          if [ -n "$CONDITIONAL_ROLES" ]; then
            fail "DEPLOYER_SA tiene al menos un binding de rol CONDICIONAL a nivel de proyecto ($(echo "$CONDITIONAL_ROLES" | tr '\n' ',' | sed 's/,$//')) — este gate nunca evalúa condiciones CEL, así que nunca puede confiar en que ese rol esté realmente activo en el momento de la mutación real. Revisar manualmente si ese binding cubre alguno de los 12 permisos requeridos."
          fi

          DEPLOYER_ROLES="$(python3 -c "
          import json
          with open('$PROJECT_POLICY_JSON', encoding='utf-8') as handle:
              policy = json.load(handle)
          member = '$DEPLOYER_MEMBER'
          roles = sorted({b['role'] for b in policy.get('bindings', []) if member in (b.get('members') or []) and not b.get('condition')})
          print('\n'.join(roles))
          ")"
          [ -n "$DEPLOYER_ROLES" ] || fail "DEPLOYER_SA no tiene ningún binding de rol INCONDICIONAL a nivel de proyecto — no se puede otorgar el manifiesto requerido sin al menos un rol."

          ALL_GRANTED="$(mktemp)"
          while IFS= read -r role; do
            [ -z "$role" ] && continue
            if [[ "$role" == roles/* ]]; then
              gcloud iam roles describe "$role" --format="value(includedPermissions)" 2>/dev/null | tr ';' '\n' >> "$ALL_GRANTED" || true
            else
              ROLE_ID="${role##*/}"
              gcloud iam roles describe "$ROLE_ID" --project="${{ env.PRODUCTION_PROJECT }}" --format="value(includedPermissions)" 2>/dev/null | tr ';' '\n' >> "$ALL_GRANTED" || true
            fi
          done <<< "$DEPLOYER_ROLES"
          sort -u -o "$ALL_GRANTED" "$ALL_GRANTED"

          MISSING=()
          for permission in "${REQUIRED_PERMISSIONS[@]}"; do
            grep -qxF "$permission" "$ALL_GRANTED" || MISSING+=("$permission")
          done

          FORBIDDEN_PRESENT=()
          for permission in "${FORBIDDEN_PERMISSIONS[@]}"; do
            grep -qxF "$permission" "$ALL_GRANTED" && FORBIDDEN_PRESENT+=("$permission")
          done

          if [ "${#FORBIDDEN_PRESENT[@]}" -gt 0 ]; then
            fail "DEPLOYER_SA tiene otorgado un permiso explícitamente prohibido: ${FORBIDDEN_PRESENT[*]} — nunca debe tener acceso de lectura de payload de secretos. Revisar el/los rol(es) que lo otorgan antes de continuar."
          fi

          if [ "${#MISSING[@]}" -gt 0 ]; then
            fail "DEPLOYER_SA carece de ${#MISSING[@]} permiso(s) requerido(s): ${MISSING[*]} — dispatch bloqueado hasta que el Human Gate de remediación IAM (crear/otorgar el rol custom korixaProductionDbHardenerOrchestrator) se aplique."
          fi

          echo "DEPLOYER_PERMISSIONS_SUFFICIENT=YES"

      - name: Reprobar EN VIVO el permiso EFECTIVO actAs sobre MIGRATION_EXECUTOR_SA — testIamPermissions, nunca inferencia de binding (solo lectura)
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::HOLD_INSUFFICIENT_DEPLOYER_PERMISSIONS — $1"; exit 1; }
          command -v python3 >/dev/null 2>&1 || fail "PARSER_UNAVAILABLE — python3 requerido, FAIL_CLOSED."

          # TF12-POINT8C-IAM-P1-EFFECTIVE-ACTAS-FINAL-REMEDIATION. Una
          # auditoría independiente posterior rechazó también la versión
          # anterior de este step (leer `get-iam-policy` de
          # MIGRATION_EXECUTOR_SA e INFERIR `actAs` de la presencia de
          # `roles/iam.serviceAccountUser`) — inferir un permiso efectivo a
          # partir de UN binding conocido nunca prueba el permiso efectivo
          # real (podría existir una deny policy, una condición de
          # organización, o cualquier otro mecanismo IAM que la inferencia
          # simplemente no ve). La API de IAM expone exactamente el método
          # diseñado para esto — `projects.serviceAccounts.
          # testIamPermissions` — que devuelve el subconjunto REAL de los
          # permisos consultados que el caller autenticado efectivamente
          # tiene sobre ese recurso, evaluado por el propio backend de IAM
          # (incluye cualquier deny policy/condición/mecanismo, no solo los
          # allow bindings visibles). No existe un subcomando `gcloud`
          # dedicado para service accounts (confirmado: ausente en gcloud
          # estable y beta; solo existiría bajo el track `alpha`, que
          # requiere instalar un componente adicional — evitado
          # deliberadamente para no ampliar la superficie del runner) — se
          # invoca el método REST directo, autenticado con el propio access
          # token de DEPLOYER_SA (mismo scope OAuth cloud-platform que ya
          # usa toda `gcloud` en este workflow). Verificado en vivo, de
          # solo lectura, durante esta misma investigación: el método NO
          # exige ningún permiso IAM adicional más allá de credenciales
          # autenticadas válidas — por eso `iam.serviceAccounts.
          # getIamPolicy` se elimina del manifiesto en este mismo cambio,
          # no se preserva artificialmente.
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          [ -n "$ACCESS_TOKEN" ] || fail "No se pudo obtener un access token de DEPLOYER_SA."

          TESTIAM_BODY="$(mktemp)"
          trap 'rm -f "$TESTIAM_BODY"' EXIT
          set +e
          HTTP_STATUS="$(curl -s -o "$TESTIAM_BODY" -w '%{http_code}' --max-time 15 -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"permissions":["iam.serviceAccounts.actAs"]}' \
            "https://iam.googleapis.com/v1/projects/${{ env.PRODUCTION_PROJECT }}/serviceAccounts/${{ env.MIGRATION_EXECUTOR_SA }}:testIamPermissions")"
          CURL_EXIT=$?
          ACCESS_TOKEN=""
          set -e
          # El token nunca se imprime — ni acá, ni vía `curl -v`/`set -x`
          # (ninguno de los dos se usa en este archivo), ni en el cuerpo de
          # la respuesta (testIamPermissions nunca devuelve credenciales).
          [ "$CURL_EXIT" -eq 0 ] || fail "La llamada HTTP a testIamPermissions falló (curl exit=$CURL_EXIT) — posible timeout/error de red. Nunca se asume actAs ante un fallo de transporte."
          [ "$HTTP_STATUS" = "200" ] || fail "testIamPermissions devolvió HTTP $HTTP_STATUS (se esperaba 200) — nunca se asume actAs ante un código de error/timeout/auth."

          ACTAS_RESULT="$(python3 -c "
          import json
          try:
              with open('$TESTIAM_BODY', encoding='utf-8') as handle:
                  data = json.load(handle)
          except Exception:
              print('PARSE_ERROR')
              raise SystemExit(0)
          if not isinstance(data, dict):
              print('PARSE_ERROR')
              raise SystemExit(0)
          permissions = data.get('permissions')
          if permissions is None:
              # Respuesta bien formada pero SIN el campo permissions —
              # comportamiento documentado de testIamPermissions cuando
              # NINGÚN permiso consultado está efectivamente otorgado.
              print('ABSENT')
              raise SystemExit(0)
          if not isinstance(permissions, list):
              print('PARSE_ERROR')
              raise SystemExit(0)
          print('PRESENT' if 'iam.serviceAccounts.actAs' in permissions else 'ABSENT')
          ")"

          case "$ACTAS_RESULT" in
            PRESENT)
              echo "CAN_DEPLOYER_ACT_AS_MIGRATION_EXECUTOR=YES"
              ;;
            ABSENT)
              fail "testIamPermissions confirma que DEPLOYER_SA NO tiene EFECTIVAMENTE iam.serviceAccounts.actAs sobre MIGRATION_EXECUTOR_SA — no puede actAs para desplegar el Cloud Run Job efímero. dispatch bloqueado hasta que el Human Gate de remediación IAM lo confirme/restaure."
              ;;
            *)
              fail "Respuesta de testIamPermissions no reconocida/malformada (parser=$ACTAS_RESULT) — FAIL_CLOSED, nunca se asume actAs sin una prueba explícita bien formada."
              ;;
          esac

  # ===========================================================================
  # Job 6 — prerrequisitos de solo lectura (nunca crea nada, HOLD fail-closed
  # si algo no puede probarse). Se ejecuta para los TRES modos.
  # ===========================================================================
  verify-prerequisites-instance:
    name: Verify Cloud SQL instance reachable (read-only — HOLD if absent)
    needs: guard
    if: needs.guard.outputs.guard_pass == 'YES' && (needs.guard.outputs.mode == 'bootstrap_and_preflight' || needs.guard.outputs.mode == 'apply' || needs.guard.outputs.mode == 'cleanup_only')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      db_host: ${{ steps.cloud-sql.outputs.db_host }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Resolver EXPECTED_DB_HOST (postura de red EXACTA probada estructuradamente, solo lectura)
        id: cloud-sql
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::HOLD_PRODUCTION_DB_NETWORK_POSTURE_DRIFT — $1"; exit 1; }
          command -v python3 >/dev/null 2>&1 || fail "PARSER_UNAVAILABLE — python3 requerido, FAIL_CLOSED."

          # PR #115 P2 remediation: nunca `ipAddresses[0].ipAddress` por
          # índice (un índice no prueba TYPE=PRIVATE ni descarta una IP
          # pública accidental en la posición 0) — JSON completo, parseado
          # estructuradamente, probando cada campo relevante explícitamente.
          INSTANCE_JSON="$(gcloud sql instances describe "${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --format=json)"

          PARSE_RESULT="$(echo "$INSTANCE_JSON" | python3 -c "
          import json, sys

          data = json.load(sys.stdin)

          def hold(msg):
              print('FAIL:' + msg)
              raise SystemExit(0)

          if data.get('name') != '${{ env.CLOUD_SQL_INSTANCE }}':
              hold('instance name mismatch: ' + str(data.get('name')))
          if data.get('project') != '${{ env.PRODUCTION_PROJECT }}':
              hold('project mismatch: ' + str(data.get('project')))
          if data.get('region') != '${{ env.PRODUCTION_REGION }}':
              hold('region mismatch: ' + str(data.get('region')))
          if data.get('state') != 'RUNNABLE':
              hold('state mismatch: ' + str(data.get('state')))
          if data.get('databaseVersion') != '${{ env.EXPECTED_DATABASE_VERSION }}':
              hold('databaseVersion mismatch: ' + str(data.get('databaseVersion')))

          ip_config = (data.get('settings') or {}).get('ipConfiguration') or {}
          if ip_config.get('ipv4Enabled'):
              hold('public IPv4 (ipv4Enabled) is enabled — expected private-only')

          private_network = ip_config.get('privateNetwork') or ''
          expected_network_suffix = '/networks/${{ env.EXPECTED_VPC_NETWORK }}'
          if not private_network.endswith(expected_network_suffix):
              hold('unexpected privateNetwork (VPC contract not intact): ' + private_network)

          addresses = data.get('ipAddresses') or []
          if any(a.get('type') == 'PRIMARY' for a in addresses):
              hold('a public PRIMARY address is present despite expecting private-only posture')

          private_ips = [a.get('ipAddress') for a in addresses if a.get('type') == 'PRIVATE' and a.get('ipAddress')]
          if len(private_ips) != 1:
              hold('expected exactly one usable PRIVATE ip address, found ' + str(len(private_ips)))

          print('OK:' + private_ips[0])
          ")"

          case "$PARSE_RESULT" in
            OK:*) DB_HOST="${PARSE_RESULT#OK:}" ;;
            FAIL:*) fail "${PARSE_RESULT#FAIL:}" ;;
            *) fail "Salida del parser de postura de red no reconocida: '$PARSE_RESULT'" ;;
          esac

          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 5 — STAGE 1 únicamente. Crea el admin efímero (cloudsqlsuperuser
  # INTENCIONAL) bajo `preflight_operation_id`, el ÚNICO secret efímero de
  # este diseño (DSN global), su binding IAM mínimo, y despliega+ejecuta el
  # Cloud Run Job efímero corriendo `db-hardener-bootstrap.js
  # grant-admin-option` para auto-otorgarse el ADMIN OPTION sobre korixa_app
  # — nunca ExecuteSql API, nunca dataApiAccess. Esta identidad y todo lo que
  # crea acá es eliminado, siempre, por `cleanup-after-preflight` antes de
  # que el dispatch termine (ver ese job).
  # ===========================================================================
  bootstrap-ephemeral-admin:
    name: Bootstrap ephemeral DB admin (stage 1 only)
    needs: [guard, derive-operation-names, verify-prerequisites-instance, resolve-artifact, verify-deployer-permissions]
    if: |
      !cancelled() &&
      needs.guard.outputs.mode == 'bootstrap_and_preflight' &&
      needs.resolve-artifact.result == 'success' &&
      needs.verify-deployer-permissions.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      ephemeral_admin_username: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
      ephemeral_dsn_secret_name: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Crear usuario PostgreSQL efímero con cloudsqlsuperuser (intencional), crear el secret DSN, y otorgar su IAM
        shell: bash
        env:
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Password fresco, criptográficamente aleatorio, charset
          # alfanumérico-only. Se usa UNA sola vez, en memoria, para crear el
          # usuario Cloud SQL y construir el DSN — nunca persiste como
          # secret propio. Nunca se hace echo, nunca se guarda en un
          # archivo, nunca aparece en ningún output de step ni en
          # GITHUB_STEP_SUMMARY.
          EPHEMERAL_PASSWORD="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 40)"
          [ ${#EPHEMERAL_PASSWORD} -ge 32 ] || fail "No se pudo generar un password efímero suficientemente largo."

          gcloud sql users create "$EPHEMERAL_ADMIN" \
            --instance="${{ env.CLOUD_SQL_INSTANCE }}" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --password="$EPHEMERAL_PASSWORD" \
            --database-roles=cloudsqlsuperuser \
            --quiet
          echo "EPHEMERAL_ADMIN_CREATED=YES"

          DSN="postgres://${EPHEMERAL_ADMIN}:${EPHEMERAL_PASSWORD}@${DB_HOST}:5432/${{ env.TARGET_DATABASE }}"

          gcloud secrets create "$EPHEMERAL_DSN_SECRET" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --quiet
          printf '%s' "$DSN" | gcloud secrets versions add "$EPHEMERAL_DSN_SECRET" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --data-file=- \
            --quiet
          unset DSN EPHEMERAL_PASSWORD
          echo "EPHEMERAL_DSN_SECRET_CREATED=YES"
          echo "SECRET_PAYLOAD_PRINTED=NO"

          # Único accesor del DSN SECRET: MIGRATION_EXECUTOR_SA — la
          # identidad bajo la cual corren TODOS los Jobs efímeros de Cloud
          # Run de este workflow. DEPLOYER_SA nunca lo necesita.
          gcloud secrets add-iam-policy-binding "$EPHEMERAL_DSN_SECRET" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --member="serviceAccount:${{ env.MIGRATION_EXECUTOR_SA }}" \
            --role=roles/secretmanager.secretAccessor \
            --quiet
          echo "EPHEMERAL_DSN_SECRET_IAM_GRANTED=YES"

      - name: Otorgar ADMIN OPTION sobre korixa_app — Cloud Run Job efímero, VPC privada, db-hardener-bootstrap.js grant-admin-option (sin ExecuteSql API)
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          gcloud run jobs deploy "$EPHEMERAL_JOB" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --region="${{ env.PRODUCTION_REGION }}" \
            --image="$IMMUTABLE_REF" \
            --command=node \
            --args=dist/ops/db-hardener-bootstrap.js \
            --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
            --network=korixa-production-vpc \
            --subnet=korixa-production-sa-east1 \
            --vpc-egress=private-ranges-only \
            --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
            --set-env-vars="BOOTSTRAP_MODE=grant-admin-option,EPHEMERAL_ADMIN_USERNAME=${EPHEMERAL_ADMIN},EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet

          set +e
          gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait
          EXECUTE_EXIT=$?
          set -e
          [ "$EXECUTE_EXIT" -eq 0 ] || fail "Job de grant-admin-option falló (exit=$EXECUTE_EXIT) — ver Cloud Logging para el JSON saneado del bootstrap (nunca DSN/password)."
          echo "TARGET_ADMIN_OPTION_GRANTED=YES"

  # ===========================================================================
  # Job 7 — STAGE 1: preflight, usando la identidad efímera de
  # bootstrap-ephemeral-admin. Nunca fluye automáticamente hacia apply — ese
  # es un dispatch separado, bajo su propio Human Gate.
  # ===========================================================================
  preflight:
    name: Preflight (stage 1 — ephemeral admin)
    needs: [guard, derive-operation-names, resolve-artifact, verify-prerequisites-instance, bootstrap-ephemeral-admin]
    if: |
      !cancelled() &&
      needs.guard.outputs.mode == 'bootstrap_and_preflight' &&
      needs.resolve-artifact.result == 'success' &&
      needs.bootstrap-ephemeral-admin.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      preflight_result: ${{ steps.execute.outputs.preflight_result }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Crear/actualizar y ejecutar el Job efímero de preflight (solo node dist/ops/db-role-hardener.js)
        id: execute
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          gcloud run jobs deploy "$EPHEMERAL_JOB" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --region="${{ env.PRODUCTION_REGION }}" \
            --image="$IMMUTABLE_REF" \
            --command=node \
            --args=dist/ops/db-role-hardener.js \
            --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
            --network=korixa-production-vpc \
            --subnet=korixa-production-sa-east1 \
            --vpc-egress=private-ranges-only \
            --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
            --set-env-vars="HARDENER_MODE=preflight,EXPECTED_ADMIN_DB_USER=UNPROVEN_PREFLIGHT_ONLY,EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet

          set +e
          gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait --format='value(status.state)' > /tmp/exec_id.txt
          EXECUTE_EXIT=$?
          set -e
          [ "$EXECUTE_EXIT" -eq 0 ] || fail "Job de preflight falló (exit=$EXECUTE_EXIT) — ver Cloud Logging para el JSON saneado del hardener (nunca DSN/password)."
          echo "preflight_result=PASS" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 8 — resumen de STAGE 1. Solo evidencia NO secreta. Corre con
  # `always()` y NO depende de que cleanup haya corrido — sus datos (SHA,
  # operation_id, disposition de preflight) ya están fijados en outputs de
  # steps previos, independientes de qué recurso siga o no vivo. El job de
  # cleanup (`cleanup-after-preflight`) declara explícitamente
  # `needs: [..., stage1-summary]`, forzando que la evidencia quede
  # publicada en el step summary del run ANTES de que cleanup pueda
  # empezar a ejecutar — orden explícito, no solo casual (Phase 1).
  # ===========================================================================
  stage1-summary:
    name: Stage 1 summary — evidence, then cleanup (see cleanup-after-preflight)
    needs: [guard, derive-operation-names, prepare-inputs, preflight, bootstrap-ephemeral-admin]
    if: always() && needs.guard.outputs.mode == 'bootstrap_and_preflight'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Emitir evidencia no secreta y próximos pasos
        shell: bash
        run: |
          {
            echo "### T-F1.2 Point 8C — Ephemeral hardener admin — STAGE 1"
            echo ""
            echo "- PREFLIGHT_OPERATION_ID = ${{ needs.derive-operation-names.outputs.operation_id }}"
            echo "- PREFLIGHT_SOURCE_SHA = ${{ needs.prepare-inputs.outputs.source_sha }}"
            echo "- PREFLIGHT_RESULT = ${{ needs.preflight.outputs.preflight_result }}"
            echo ""
            echo "Los recursos privilegiados que este dispatch creó (usuario PostgreSQL efímero, secret DSN, Cloud Run Job) son ELIMINADOS SIEMPRE por este mismo dispatch (job cleanup-after-preflight, éxito o falla, sin excepciones) antes de que el run termine — no quedan esperando a que un humano dispatchee apply ni a que expire ningún timer."
            echo ""
            if [ "${{ needs.preflight.result }}" = "success" ]; then
              echo "READY_FOR_APPLY_HUMAN_GATE_WITH_ZERO_PRIVILEGED_RESOURCES_REMAINING"
              echo ""
              echo "Para continuar: dispatch este mismo workflow con:"
              echo '```'
              echo "mode = apply"
              echo "operation_id = ${{ needs.derive-operation-names.outputs.operation_id }}"
              echo "operation_source_sha = ${{ needs.prepare-inputs.outputs.source_sha }}"
              echo "confirmation = APPLY_EPHEMERAL_HARDENER_HARDEN_KORIXA_APP"
              echo '```'
              echo ""
              echo "apply bootstrapea una identidad efímera COMPLETAMENTE NUEVA (nunca reutiliza la de este dispatch, que ya fue eliminada) y vuelve a correr preflight sobre esa identidad fresca, contra el estado real vigente, antes de aplicar nada. No hay una ventana temporal que expire — no hay nada privilegiado activo esperando."
            else
              echo "PREFLIGHT_FAILED — cleanup automático de Stage 1 fue intentado igualmente (job cleanup-after-preflight) para este operation_id. Verificar su resultado en el resumen de ese job."
              echo "Si por algún motivo el cleanup automático no pudo completarse, dispatch mode=cleanup_only con operation_id=${{ needs.derive-operation-names.outputs.operation_id }} como respaldo de recuperación de incidentes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job 8b — CLEANUP AUTOMÁTICO E INCONDICIONAL de Stage 1 (PR #115
  # zero-standing-privilege remediation). Antes de esta remediación, un
  # preflight EXITOSO dejaba deliberadamente el admin/secret/Job efímeros
  # activos, indefinidamente, en espera de que un humano dispatcheara apply
  # — el único guardarraíl era un timer reactivo que nunca corría si apply
  # jamás se dispatcheaba. Ahora corre SIEMPRE que bootstrap_and_preflight
  # llegó a este punto, sin importar si preflight tuvo éxito o falló — el
  # descubrimiento de recursos es idempotente (describe-antes-de-borrar), así
  # que nunca asume qué llegó a crearse. `cleanup_only` sigue existiendo,
  # pero SOLO como respaldo de recuperación de incidentes (runner cancelado a
  # mitad de este job) — nunca como el mecanismo normal de limpieza.
  # ===========================================================================
  cleanup-after-preflight:
    name: Cleanup after Stage 1 (automatic, unconditional — success or failure, no exceptions)
    needs: [guard, derive-operation-names, resolve-artifact, verify-prerequisites-instance, bootstrap-ephemeral-admin, preflight, stage1-summary]
    if: |
      always() &&
      needs.guard.outputs.guard_pass == 'YES' &&
      needs.guard.outputs.mode == 'bootstrap_and_preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Descubrir y remover, defensivamente, exactamente los recursos de esta operation_id (idempotente — clasifica antes de borrar, nunca asume ausencia ante un fallo genérico)
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set +e

          # TF12-POINT8C-IAM-P1 remediation (P1-A) — clasificador
          # fail-closed de existencia. ANY non-zero exit de `describe` NO
          # es lo mismo que "no existe": un 403/timeout/error transitorio
          # de la API nunca debe interpretarse como ausencia. Solo un
          # texto de error que PRUEBA NOT_FOUND (observado en vivo, esta
          # investigación: Cloud SQL users -> "HTTPError 404"; Secret
          # Manager -> "NOT_FOUND:"; Cloud Run Jobs -> "Cannot find job")
          # produce ABSENT_CONFIRMED. Cualquier otro fallo es
          # LOOKUP_FAILED — invariante: PERMISSION_DENIED != NOT_FOUND,
          # TIMEOUT != NOT_FOUND, API_FAILURE != NOT_FOUND.
          classify_resource() {
            local kind="$1"; shift
            local stderr_file; stderr_file="$(mktemp)"
            "$@" >/dev/null 2>"$stderr_file"
            local exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
              rm -f "$stderr_file"
              echo "EXISTS"
              return 0
            fi
            local not_found_pattern=""
            case "$kind" in
              cloudsql_user) not_found_pattern="HTTPError 404" ;;
              secret) not_found_pattern="NOT_FOUND:" ;;
              cloudrun_job) not_found_pattern="Cannot find job" ;;
              *)
                # TF12-POINT8C-IAM-P1-EFFECTIVE-ACTAS-FINAL-REMEDIATION
                # (P2): un `kind` desconocido NUNCA debe caer al chequeo
                # genérico de abajo — con `not_found_pattern` vacío,
                # `grep -q ""` matchea CUALQUIER stderr no vacío,
                # produciendo ABSENT_CONFIRMED falso. Return inmediato,
                # fail-closed: un kind no reconocido es, por definición,
                # una clasificación que este código no sabe hacer con
                # certeza — nunca ausencia.
                rm -f "$stderr_file"
                echo "LOOKUP_FAILED"
                return 0
                ;;
            esac
            if grep -q "$not_found_pattern" "$stderr_file"; then
              rm -f "$stderr_file"
              echo "ABSENT_CONFIRMED"
            else
              rm -f "$stderr_file"
              echo "LOOKUP_FAILED"
            fi
          }

          # A — revocar ADMIN OPTION, salvo que el admin esté
          # ABSENT_CONFIRMED (un LOOKUP_FAILED se trata igual que EXISTS —
          # nunca se asume que no hace falta revocar). Vía el mismo Cloud
          # Run Job efímero, VPC privada, `db-hardener-bootstrap.js
          # revoke-admin-option` — nunca ExecuteSql API. Best-effort
          # respecto de IMMUTABLE_REF.
          ADMIN_STATE_A="$(classify_resource cloudsql_user gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}")"
          [ "$ADMIN_STATE_A" = "LOOKUP_FAILED" ] && echo "::warning::LOOKUP_FAILED al comprobar el admin efímero antes de revocar ADMIN OPTION — nunca se asume ausencia, se intenta igual."
          if [ "$ADMIN_STATE_A" != "ABSENT_CONFIRMED" ]; then
            DSN_SECRET_STATE_A="$(classify_resource secret gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}")"
            [ "$DSN_SECRET_STATE_A" = "LOOKUP_FAILED" ] && echo "::warning::LOOKUP_FAILED al comprobar el secret DSN antes de revocar ADMIN OPTION — nunca se asume ausencia, se intenta igual."
            if [ "$DSN_SECRET_STATE_A" != "ABSENT_CONFIRMED" ] && [ -n "$IMMUTABLE_REF" ]; then
              gcloud run jobs deploy "$EPHEMERAL_JOB" \
                --project="${{ env.PRODUCTION_PROJECT }}" \
                --region="${{ env.PRODUCTION_REGION }}" \
                --image="$IMMUTABLE_REF" \
                --command=node \
                --args=dist/ops/db-hardener-bootstrap.js \
                --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
                --network=korixa-production-vpc \
                --subnet=korixa-production-sa-east1 \
                --vpc-egress=private-ranges-only \
                --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
                --set-env-vars="BOOTSTRAP_MODE=revoke-admin-option,EPHEMERAL_ADMIN_USERNAME=${EPHEMERAL_ADMIN},EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
                --max-retries=0 \
                --task-timeout=300s \
                --quiet >/dev/null 2>&1
              gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait >/dev/null 2>&1
              echo "state=DONE" >> "$GITHUB_OUTPUT"
            else
              echo "state=SKIPPED" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "state=SKIPPED" >> "$GITHUB_OUTPUT"
          fi

          # B — eliminar el admin. ABSENT_CONFIRMED es la ÚNICA razón
          # válida para saltear el delete — EXISTS y LOOKUP_FAILED
          # intentan el delete igual.
          ADMIN_STATE_B="$(classify_resource cloudsql_user gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}")"
          if [ "$ADMIN_STATE_B" = "ABSENT_CONFIRMED" ]; then
            echo "STAGE1_CLEANUP_B_SKIPPED=ADMIN_ALREADY_ABSENT"
          else
            gcloud sql users delete "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --quiet >/dev/null 2>&1
            echo "STAGE1_CLEANUP_B_ATTEMPTED=YES (pre_state=$ADMIN_STATE_B)"
          fi

          # C/D — eliminar el secret DSN. Misma regla: solo ABSENT_CONFIRMED salta el delete.
          SECRET_STATE_CD="$(classify_resource secret gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}")"
          if [ "$SECRET_STATE_CD" = "ABSENT_CONFIRMED" ]; then
            echo "STAGE1_CLEANUP_C_D_SKIPPED=DSN_SECRET_ALREADY_ABSENT"
          else
            gcloud secrets delete "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" --quiet >/dev/null 2>&1
            echo "STAGE1_CLEANUP_C_D_ATTEMPTED=YES (pre_state=$SECRET_STATE_CD)"
          fi

          # E — eliminar el Cloud Run Job efímero. Misma regla.
          JOB_STATE_E="$(classify_resource cloudrun_job gcloud run jobs describe "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}")"
          if [ "$JOB_STATE_E" = "ABSENT_CONFIRMED" ]; then
            echo "STAGE1_CLEANUP_E_SKIPPED=JOB_ALREADY_ABSENT"
          else
            gcloud run jobs delete "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --quiet >/dev/null 2>&1
            echo "STAGE1_CLEANUP_E_ATTEMPTED=YES (pre_state=$JOB_STATE_E)"
          fi

          set -e

      - name: Verificación independiente de ausencia — nunca se declara CLEAN salvo ABSENT_CONFIRMED en los tres recursos
        shell: bash
        env:
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
        run: |
          set +e

          # Mismo clasificador fail-closed que el paso anterior (Fase P1-A)
          # — duplicado deliberadamente: cada step de GitHub Actions es un
          # proceso bash nuevo, las funciones no persisten entre steps.
          classify_resource() {
            local kind="$1"; shift
            local stderr_file; stderr_file="$(mktemp)"
            "$@" >/dev/null 2>"$stderr_file"
            local exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
              rm -f "$stderr_file"
              echo "EXISTS"
              return 0
            fi
            local not_found_pattern=""
            case "$kind" in
              cloudsql_user) not_found_pattern="HTTPError 404" ;;
              secret) not_found_pattern="NOT_FOUND:" ;;
              cloudrun_job) not_found_pattern="Cannot find job" ;;
              *)
                # TF12-POINT8C-IAM-P1-EFFECTIVE-ACTAS-FINAL-REMEDIATION
                # (P2): un `kind` desconocido NUNCA debe caer al chequeo
                # genérico de abajo — con `not_found_pattern` vacío,
                # `grep -q ""` matchea CUALQUIER stderr no vacío,
                # produciendo ABSENT_CONFIRMED falso. Return inmediato,
                # fail-closed: un kind no reconocido es, por definición,
                # una clasificación que este código no sabe hacer con
                # certeza — nunca ausencia.
                rm -f "$stderr_file"
                echo "LOOKUP_FAILED"
                return 0
                ;;
            esac
            if grep -q "$not_found_pattern" "$stderr_file"; then
              rm -f "$stderr_file"
              echo "ABSENT_CONFIRMED"
            else
              rm -f "$stderr_file"
              echo "LOOKUP_FAILED"
            fi
          }

          ADMIN_STATE="$(classify_resource cloudsql_user gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}")"
          DSN_SECRET_STATE="$(classify_resource secret gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}")"
          JOB_STATE="$(classify_resource cloudrun_job gcloud run jobs describe "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}")"
          set -e
          {
            echo "### T-F1.2 Point 8C — cleanup-after-preflight — operation ${{ needs.derive-operation-names.outputs.operation_id }}"
            echo ""
            if [ "$ADMIN_STATE" = "ABSENT_CONFIRMED" ] && [ "$DSN_SECRET_STATE" = "ABSENT_CONFIRMED" ] && [ "$JOB_STATE" = "ABSENT_CONFIRMED" ]; then
              echo "STAGE1_CLEANUP_RESULT = CLEAN (los tres recursos confirmados AUSENTES — ABSENT_CONFIRMED, nunca inferido de un error genérico)"
              echo "PRIVILEGED_RESOURCES_WHILE_WAITING_HUMAN_GATE = 0"
            else
              echo "STAGE1_CLEANUP_RESULT = HOLD_STILL_PRESENT_OR_UNVERIFIED (admin=$ADMIN_STATE, secret=$DSN_SECRET_STATE, job=$JOB_STATE)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ADMIN_STATE" != "ABSENT_CONFIRMED" ] || [ "$DSN_SECRET_STATE" != "ABSENT_CONFIRMED" ] || [ "$JOB_STATE" != "ABSENT_CONFIRMED" ]; then
            echo "::error::HOLD_STAGE1_CLEANUP_INCOMPLETE — el cleanup automático de Stage 1 no logró confirmar los tres recursos AUSENTES (ABSENT_CONFIRMED) — un LOOKUP_FAILED nunca se trata como ausencia. Dispatch mode=cleanup_only con este operation_id."
            exit 1
          fi

  # ===========================================================================
  # Job 9 — STAGE 2, prerrequisito A: valida el estado de korixa_app ANTES de
  # que apply pueda tocarlo. Reemplaza el antiguo `verify-operation-context`
  # (que verificaba que el admin/secret de STAGE 1 siguieran existiendo — ya
  # no aplica, porque bajo el modelo zero-standing-privilege esos recursos
  # SIEMPRE están eliminados para cuando apply corre). Este chequeo es
  # independiente de cualquier identidad efímera — corre en paralelo con
  # bootstrap-apply-admin.
  # ===========================================================================
  verify-target-role-preconditions:
    name: Verify korixa_app database roles (exact precondition — stage 2)
    needs: [guard, verify-prerequisites-instance]
    if: needs.guard.outputs.guard_pass == 'YES' && needs.guard.outputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      target_role_verified: ${{ steps.verify.outputs.target_role_verified }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: databaseRoles EXACTO de korixa_app antes de permitir apply
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::HOLD_TARGET_DATABASE_ROLES_DRIFT — $1"; exit 1; }
          command -v python3 >/dev/null 2>&1 || fail "PARSER_UNAVAILABLE — python3 requerido, FAIL_CLOSED."

          # PR #115 P1-5 remediation (preservado): databaseRoles EXACTO de
          # korixa_app — nunca substring/grep. Debe ser EXACTAMENTE
          # [cloudsqlsuperuser], el único estado real, documentado y
          # conocido de Producción hoy (la premisa completa de este esfuerzo
          # de endurecimiento). Un rol adicional o faltante nunca se asume
          # seguro de remover en bloque vía `assign-roles
          # --revoke-existing-roles` más abajo en el job `apply`.
          TARGET_DESCRIBE_JSON="$(gcloud sql users describe "${{ env.TARGET_ROLE }}" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --format=json)"
          TARGET_ROLES_EXACT="$(echo "$TARGET_DESCRIBE_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          roles = sorted(data.get('databaseRoles') or [])
          print('EXACT' if roles == ['cloudsqlsuperuser'] else 'DRIFT:' + ','.join(roles))
          ")"
          [ "$TARGET_ROLES_EXACT" = "EXACT" ] || fail "databaseRoles de '${{ env.TARGET_ROLE }}' no es EXACTAMENTE [cloudsqlsuperuser]: '$TARGET_ROLES_EXACT'."

          echo "target_role_verified=YES" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 10 — STAGE 2, prerrequisito B: bootstrapea una identidad efímera
  # COMPLETAMENTE NUEVA para apply, bajo `apply_execution_id` (nunca bajo el
  # `preflight_operation_id` de Stage 1, cuyos recursos ya no existen).
  # Estructuralmente idéntico a `bootstrap-ephemeral-admin` — la única
  # diferencia es el modo y qué identidad (derive-operation-names ya emite
  # los nombres correctos para cada modo).
  # ===========================================================================
  bootstrap-apply-admin:
    name: Bootstrap FRESH ephemeral DB admin (stage 2 — never reuses stage 1's)
    needs: [guard, derive-operation-names, verify-prerequisites-instance, resolve-artifact, verify-deployer-permissions]
    if: |
      !cancelled() &&
      needs.guard.outputs.mode == 'apply' &&
      needs.resolve-artifact.result == 'success' &&
      needs.verify-deployer-permissions.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Crear usuario PostgreSQL efímero FRESCO (apply_execution_id) con cloudsqlsuperuser (intencional), crear el secret DSN, y otorgar su IAM
        shell: bash
        env:
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          EPHEMERAL_PASSWORD="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 40)"
          [ ${#EPHEMERAL_PASSWORD} -ge 32 ] || fail "No se pudo generar un password efímero suficientemente largo."

          gcloud sql users create "$EPHEMERAL_ADMIN" \
            --instance="${{ env.CLOUD_SQL_INSTANCE }}" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --password="$EPHEMERAL_PASSWORD" \
            --database-roles=cloudsqlsuperuser \
            --quiet
          echo "EPHEMERAL_ADMIN_CREATED=YES"

          DSN="postgres://${EPHEMERAL_ADMIN}:${EPHEMERAL_PASSWORD}@${DB_HOST}:5432/${{ env.TARGET_DATABASE }}"

          gcloud secrets create "$EPHEMERAL_DSN_SECRET" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --quiet
          printf '%s' "$DSN" | gcloud secrets versions add "$EPHEMERAL_DSN_SECRET" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --data-file=- \
            --quiet
          unset DSN EPHEMERAL_PASSWORD
          echo "EPHEMERAL_DSN_SECRET_CREATED=YES"
          echo "SECRET_PAYLOAD_PRINTED=NO"

          gcloud secrets add-iam-policy-binding "$EPHEMERAL_DSN_SECRET" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --member="serviceAccount:${{ env.MIGRATION_EXECUTOR_SA }}" \
            --role=roles/secretmanager.secretAccessor \
            --quiet
          echo "EPHEMERAL_DSN_SECRET_IAM_GRANTED=YES"

      - name: Otorgar ADMIN OPTION sobre korixa_app — Cloud Run Job efímero, VPC privada, db-hardener-bootstrap.js grant-admin-option (sin ExecuteSql API)
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          gcloud run jobs deploy "$EPHEMERAL_JOB" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --region="${{ env.PRODUCTION_REGION }}" \
            --image="$IMMUTABLE_REF" \
            --command=node \
            --args=dist/ops/db-hardener-bootstrap.js \
            --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
            --network=korixa-production-vpc \
            --subnet=korixa-production-sa-east1 \
            --vpc-egress=private-ranges-only \
            --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
            --set-env-vars="BOOTSTRAP_MODE=grant-admin-option,EPHEMERAL_ADMIN_USERNAME=${EPHEMERAL_ADMIN},EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet

          set +e
          gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait
          EXECUTE_EXIT=$?
          set -e
          [ "$EXECUTE_EXIT" -eq 0 ] || fail "Job de grant-admin-option falló (exit=$EXECUTE_EXIT) — ver Cloud Logging para el JSON saneado del bootstrap (nunca DSN/password)."
          echo "TARGET_ADMIN_OPTION_GRANTED=YES"

  # ===========================================================================
  # Job 11 — STAGE 2, prerrequisito C, OBLIGATORIO: vuelve a correr el
  # preflight REAL del hardener, contra la identidad recién creada por
  # bootstrap-apply-admin y el estado LIVE actual — nunca se asume que el
  # estado observado en el Stage 1 original (potencialmente minutos u horas
  # atrás) sigue siendo válido. Esto NO es un bypass automático Stage1->apply
  # — el Human Gate de Stage 2 ya ocurrió (este es un dispatch explícito,
  # separado, con su propia confirmation exacta); este fresh preflight es un
  # prerrequisito de seguridad DENTRO de ese dispatch ya autorizado. Si
  # falla: apply NO corre, y cleanup-after-apply corre igual.
  # ===========================================================================
  fresh-preflight:
    name: Fresh preflight (mandatory, stage 2 — re-proves live state right before apply)
    needs: [guard, derive-operation-names, resolve-artifact, verify-prerequisites-instance, bootstrap-apply-admin]
    if: |
      !cancelled() &&
      needs.guard.outputs.mode == 'apply' &&
      needs.resolve-artifact.result == 'success' &&
      needs.bootstrap-apply-admin.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      fresh_preflight_result: ${{ steps.execute.outputs.fresh_preflight_result }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Crear/actualizar y ejecutar el Job efímero de preflight FRESCO (solo node dist/ops/db-role-hardener.js)
        id: execute
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::HOLD_FRESH_PREFLIGHT_FAILED — $1"; exit 1; }

          gcloud run jobs deploy "$EPHEMERAL_JOB" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --region="${{ env.PRODUCTION_REGION }}" \
            --image="$IMMUTABLE_REF" \
            --command=node \
            --args=dist/ops/db-role-hardener.js \
            --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
            --network=korixa-production-vpc \
            --subnet=korixa-production-sa-east1 \
            --vpc-egress=private-ranges-only \
            --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
            --set-env-vars="HARDENER_MODE=preflight,EXPECTED_ADMIN_DB_USER=UNPROVEN_PREFLIGHT_ONLY,EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet

          set +e
          gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait
          EXECUTE_EXIT=$?
          set -e
          [ "$EXECUTE_EXIT" -eq 0 ] || fail "Job de fresh preflight falló (exit=$EXECUTE_EXIT) — ver Cloud Logging para el JSON saneado del hardener (nunca DSN/password). apply NO corre; cleanup-after-apply corre igual."
          echo "fresh_preflight_result=PASS" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 12 — apply real, usando la identidad efímera FRESCA de Stage 2
  # (bootstrap-apply-admin), solo si tanto verify-target-role-preconditions
  # como fresh-preflight (Job 11, obligatorio) pasaron.
  # ===========================================================================
  apply:
    name: Apply (stage 2 — fresh ephemeral admin)
    needs: [guard, derive-operation-names, resolve-artifact, verify-prerequisites-instance, verify-target-role-preconditions, bootstrap-apply-admin, fresh-preflight]
    if: |
      !cancelled() &&
      needs.guard.outputs.mode == 'apply' &&
      needs.resolve-artifact.result == 'success' &&
      needs.verify-target-role-preconditions.outputs.target_role_verified == 'YES' &&
      needs.fresh-preflight.outputs.fresh_preflight_result == 'PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      apply_result: ${{ steps.execute.outputs.apply_result }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Crear/actualizar y ejecutar el Job efímero de apply (solo node dist/ops/db-role-hardener.js)
        id: execute
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          gcloud run jobs deploy "$EPHEMERAL_JOB" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --region="${{ env.PRODUCTION_REGION }}" \
            --image="$IMMUTABLE_REF" \
            --command=node \
            --args=dist/ops/db-role-hardener.js \
            --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
            --network=korixa-production-vpc \
            --subnet=korixa-production-sa-east1 \
            --vpc-egress=private-ranges-only \
            --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
            --set-env-vars="HARDENER_MODE=apply,EXPECTED_ADMIN_DB_USER=${EPHEMERAL_ADMIN},EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA,HARDEN_CONFIRMATION=HARDEN_KORIXA_APP_PRODUCTION" \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet

          set +e
          gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait
          EXECUTE_EXIT=$?
          set -e
          [ "$EXECUTE_EXIT" -eq 0 ] || fail "Job de apply falló (exit=$EXECUTE_EXIT) — ver Cloud Logging para el JSON saneado del hardener."
          echo "apply_result=HARDENED" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 13 — remoción de cloudsqlsuperuser de korixa_app. SOLO vía Cloud SQL
  # Admin API (assign-roles --revoke-existing-roles) — NUNCA SQL REVOKE,
  # probado ineficaz contra este rol específico en la investigación de
  # cleanroom (TF12-POINT8C-CLOUDSQL-CREATEROLE-ESCALATION-CLEANROOM-PROOF).
  # ===========================================================================
  remove-target-cloudsqlsuperuser:
    name: Remove korixa_app cloudsqlsuperuser (Admin API only)
    needs: [guard, apply]
    if: needs.guard.outputs.mode == 'apply' && needs.apply.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      removal_result: ${{ steps.remove.outputs.removal_result }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: assign-roles --revoke-existing-roles sobre korixa_app, luego verificar en ambas capas
        id: remove
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          gcloud sql users assign-roles "${{ env.TARGET_ROLE }}" \
            --instance="${{ env.CLOUD_SQL_INSTANCE }}" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --type=BUILT_IN \
            --revoke-existing-roles \
            --quiet

          REMAINING_ROLES="$(gcloud sql users describe "${{ env.TARGET_ROLE }}" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --format='value(databaseRoles)')"
          [ -z "$REMAINING_ROLES" ] || fail "TARGET_CLOUDSQLSUPERUSER_REMOVAL_FAILED — databaseRoles todavía contiene: '$REMAINING_ROLES' (metadata Cloud SQL)."

          echo "removal_result=PASS" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 14 — verify real (DB-level, vía el propio hardener) — confirma tanto
  # el estado SQL como la ausencia de cloudsqlsuperuser leída directamente
  # del catálogo de Postgres, no solo de la metadata de Cloud SQL.
  # ===========================================================================
  verify:
    name: Verify (stage 2 — fresh ephemeral admin, still alive)
    needs: [guard, derive-operation-names, resolve-artifact, verify-prerequisites-instance, remove-target-cloudsqlsuperuser]
    if: needs.guard.outputs.mode == 'apply' && needs.remove-target-cloudsqlsuperuser.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      verify_disposition_ok: ${{ steps.execute.outputs.verify_disposition_ok }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Ejecutar el Job efímero en modo verify y confirmar SQL_AND_CLOUDSQL_FULLY_HARDENED
        id: execute
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set -euo pipefail
