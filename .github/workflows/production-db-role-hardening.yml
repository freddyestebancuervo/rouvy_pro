      - name: Estado F — verificación independiente de ausencia (admin + secret DSN + Cloud Run Job) — solo ABSENT_CONFIRMED en los tres cuenta como verificado
        id: independent-verify
        shell: bash
        env:
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
        run: |
          set +e

          # TF12-POINT8C-IAM-P1 remediation (P1-A) — mismo clasificador
          # fail-closed. Este es el step más importante de todos: su
          # resultado alimenta directamente CLEANUP_OK en el step final.
          classify_resource() {
            local kind="$1"; shift
            local stderr_file; stderr_file="$(mktemp)"
            "$@" >/dev/null 2>"$stderr_file"
            local exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
