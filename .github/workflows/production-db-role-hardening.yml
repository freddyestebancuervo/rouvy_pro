  # ===========================================================================
  # Job 16 — CLEANUP_ONLY. Recuperación de incidentes ÚNICAMENTE (PR #115
  # zero-standing-privilege remediation): ya NO forma parte de ningún camino
  # normal exitoso — tanto Stage 1 (cleanup-after-preflight) como Stage 2
  # (cleanup-after-apply) se auto-limpian siempre, incondicionalmente. Este
  # job existe solo para el caso en que un runner fue cancelado a la fuerza
  # (fuera del período de gracia de GitHub Actions) a mitad de uno de esos
  # jobs de cleanup, o una salida de plataforma similar, y algo quedó
  # varado. Genérico sobre CUALQUIER id de 12 hex — preflight_operation_id o
  # apply_execution_id, la derivación de nombres es idéntica para ambos.
  # ===========================================================================
  cleanup-only:
    name: Cleanup only (incident recovery ONLY — never part of the normal path)
    needs: [guard, derive-operation-names, resolve-artifact, verify-prerequisites-instance]
    if: |
      always() &&
      needs.derive-operation-names.result == 'success' &&
      ((needs.guard.outputs.guard_pass == 'YES' && needs.guard.outputs.mode == 'cleanup_only') ||
       needs.guard.outputs.sha_drift_detected == 'YES')
