name: Backend — Production DB role hardening (manual dispatch only)

# T-F1.2 Point 8B — wires backend/src/ops/db-role-hardener.ts (preflight/apply/
# verify) so it becomes reachable ONLY through a deliberate, manual
# workflow_dispatch. Neither the reusable build/publish workflow nor the
# hardener source is modified by this file.
#
# ACTIVATION INTERLOCK (same pattern as production-deploy.yml and
# production-db-readonly-inspection.yml): `on: workflow_dispatch` ONLY. No
# `workflow_run`, `push`, `pull_request`, or `schedule`. Nothing in this
# repository can invoke this workflow except a human explicitly choosing
# "Run workflow" and typing every value below by hand. Merging this file
# changes nothing about whether Production is reachable automatically: it
# still is not.
#
# CURRENT REAL-WORLD STATE (as of this PR): the runtime identity this
# workflow needs, `korixa-prod-migration-exec@ridepro-dbafe.iam
# .gserviceaccount.com`, DOES NOT EXIST YET, and the Production deployer has
# no IAM binding letting it actAs that identity, and the migration secret has
# no accessor binding for it either. All three are explicitly OUT OF SCOPE
# for this PR (separate, future, individually-authorized Human Gates) — see
# `verify-prerequisites` below. Until every one of those exists, this
# workflow HOLDS at that job and never reaches `run-db-role-hardener`, no
# matter what a human dispatches. This file does not create the service
# account, does not grant IAM, and does not change Secret Manager policy.
#
# NAMING NOTE (T-F1.2 Point 8B.2): the identity was originally specified as
# `korixa-production-migration-executor` (37 chars including the trailing
# `@`-prefixed account id portion — 36 chars for the account id alone),
# which GCP's IAM API rejects outright (`INVALID_ARGUMENT`: account ids must
# be 6-30 characters). `korixa-prod-migration-exec` (26 characters) is the
# corrected, GCP-valid account id — the only identity this workflow ever
# references for this role from this point forward.
#
# WHAT A FUTURE REAL DISPATCH WOULD DO, once prerequisites exist: (A) resolve
# a Production artifact for the exact dispatched commit — building/publishing
# it if absent, or safely REUSING the already-published immutable artifact if
# a prior dispatch (e.g. an earlier `preflight` at the same commit) already
# built it, since `_backend-build-publish-production.yml` intentionally fails
# closed on a duplicate SHA tag and must never be asked to push twice for the
# same commit (see `check-artifact-existence`/`reuse-existing-artifact`
# below); (B) create/update and execute, exactly once, a narrowly-scoped
# Cloud Run Job running ONLY `node dist/ops/db-role-hardener.js` in the
# requested mode (preflight/apply/verify) — never a shell, never an arbitrary
# command. `apply` additionally requires the exact confirmation token the
# hardener itself re-validates independently of this workflow.
#
# PREFLIGHT ADMIN INPUT SENTINEL: `runPreflight` (backend/src/ops/
# db-role-hardener.ts) discovers the connected `current_user` itself and
# never reads `EXPECTED_ADMIN_DB_USER` as an authorization condition — only
# `runApply` does, via `assertExpectedAdminIdentity`. For `mode=preflight`
# the operator MAY supply the sentinel `UNPROVEN_PREFLIGHT_ONLY` for
# `expected_admin_db_user` when the real admin identity isn't known yet
# (that's exactly what preflight is for: discovering it, and proving its
# PostgreSQL 16 admin capability, before anyone commits to an `apply` run).
# preflight still independently rejects `korixa_app`/`korixa_runtime` as the
# connected identity, requires `current_user == session_user`, and requires
# proven admin capability (superuser, or CREATEROLE + ADMIN OPTION on the
# target role) — the sentinel changes none of that. `runVerify` also never
# reads `EXPECTED_ADMIN_DB_USER`, so the sentinel is harmless there too. The
# `guard` job below explicitly REJECTS the sentinel only for `mode=apply`
# (the one mode that actually authorizes anything from this value): the
# identity `preflight` proved must be carried forward verbatim into
# `apply`'s `expected_admin_db_user`, never the placeholder.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Hardener mode to run."
        required: true
        type: choice
        options:
          - preflight
          - apply
          - verify
      migration_secret_version:
        description: "Exact positive integer version of korixa-production-migration-database-url to mount — never 'latest', to avoid racing a concurrent secret rotation. No default — owner must supply the current version explicitly."
        required: true
        type: string
      expected_admin_db_user:
        description: "Explicit expected admin DB identity (current_user) the hardener must connect as. Never inferred. Only enforced by apply. For mode=preflight, the sentinel UNPROVEN_PREFLIGHT_ONLY may be used — preflight discovers the real identity itself and never authorizes anything from this value. apply MUST use the exact identity preflight proved; the guard rejects the sentinel for mode=apply."
        required: true
        type: string
      confirmation:
        description: "Must be exactly PREFLIGHT_PRODUCTION_DB_ROLE_HARDENING (preflight), HARDEN_KORIXA_APP_PRODUCTION (apply), or VERIFY_PRODUCTION_DB_ROLE_HARDENING (verify) — must match the chosen mode."
        required: true
        type: string

permissions:
  contents: read

env:
  PRODUCTION_PROJECT: ridepro-dbafe
  PRODUCTION_REGION: southamerica-east1
  CLOUD_SQL_INSTANCE: korixa-production-postgres
  TARGET_DATABASE: korixa_production
  DEPLOYER_SA: korixa-production-deployer@ridepro-dbafe.iam.gserviceaccount.com
  # Future identity — does NOT exist yet (see header comment). Never created,
  # never granted IAM, never bound to the secret by this file.
  MIGRATION_EXECUTOR_SA: korixa-prod-migration-exec@ridepro-dbafe.iam.gserviceaccount.com
  SECRET_MIGRATION_DATABASE_URL: korixa-production-migration-database-url
  ARTIFACT_IMAGE: southamerica-east1-docker.pkg.dev/ridepro-dbafe/korixa-backend/api
  HARDENER_JOB: korixa-production-db-role-hardener

jobs:
  # ===========================================================================
  # Job 1 — permission-less guard. No checkout, no OIDC, no gcloud. Exact
  # repo/ref/SHA/mode/confirmation/secret-version-format checks — the same
  # discipline as production-db-readonly-inspection.yml's guard.
  # ===========================================================================
  guard:
    name: Guard — manual-dispatch-only, sin acceso cloud
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      guard_pass: ${{ steps.checks.outputs.guard_pass }}
    steps:
      - name: Validar origen, ref, SHA, modo, confirmación y formato de versión de secreto (sin efectos, sin cloud)
        id: checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SECRET_VERSION: ${{ inputs.migration_secret_version }}
          ADMIN_DB_USER: ${{ inputs.expected_admin_db_user }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ "$EVENT_NAME" = "workflow_dispatch" ] || fail "EVENT_NAME esperado 'workflow_dispatch', obtenido '$EVENT_NAME'."
          [ "$REPOSITORY" = "freddyestebancuervo/rouvy_pro" ] || fail "REPOSITORY inesperado: '$REPOSITORY'"
          [ "$REF" = "refs/heads/main" ] || fail "REF esperado 'refs/heads/main', obtenido '$REF'."
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "github.sha no es un SHA-1 completo (40 hex minúsculas): '$SHA'"

          case "$MODE" in
            preflight) EXPECTED_CONFIRMATION="PREFLIGHT_PRODUCTION_DB_ROLE_HARDENING" ;;
            apply)     EXPECTED_CONFIRMATION="HARDEN_KORIXA_APP_PRODUCTION" ;;
            verify)    EXPECTED_CONFIRMATION="VERIFY_PRODUCTION_DB_ROLE_HARDENING" ;;
            *) fail "mode debe ser exactamente uno de preflight/apply/verify: '$MODE'" ;;
          esac
          [ "$CONFIRMATION" = "$EXPECTED_CONFIRMATION" ] || fail "confirmation no coincide con el valor exacto exigido para mode='$MODE' (defensa en profundidad; el hardener revalida su propio token de forma independiente para apply)."

          [[ "$SECRET_VERSION" =~ ^[1-9][0-9]*$ ]] || fail "migration_secret_version debe ser un entero positivo, nunca 'latest' ni cero: '$SECRET_VERSION'"
          [ -n "$ADMIN_DB_USER" ] || fail "expected_admin_db_user no puede estar vacío."

          if [ "$MODE" = "apply" ] && [ "$ADMIN_DB_USER" = "UNPROVEN_PREFLIGHT_ONLY" ]; then
            fail "expected_admin_db_user='UNPROVEN_PREFLIGHT_ONLY' no puede usarse con mode=apply — ese sentinel solo es válido para preflight (que descubre la identidad real por sí mismo). apply exige la identidad EXACTA que preflight ya probó."
          fi

          echo "guard_pass=YES" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 2 — checkout exactamente github.sha y reverificación de frescura.
  # ===========================================================================
  prepare-inputs:
    name: Prepare inputs (checkout only)
    needs: guard
    if: needs.guard.outputs.guard_pass == 'YES'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verificar SHA fuente exacto
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          [ "$CHECKED_OUT_SHA" = "${{ github.sha }}" ] || { echo "::error::Checkout SHA mismatch."; exit 1; }
          echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 3 — decide BUILD vs REUSE, read-only. `_backend-build-publish-
  # production.yml` intentionally fails closed (TAG_ALREADY_EXISTS) if the
  # deterministic SHA tag already exists — calling it unconditionally on
  # every dispatch means a second dispatch at the SAME audited commit (e.g.
  # `apply` right after a `preflight` that already built it) would always
  # fail. This job runs the EXACT SAME list+count algorithm the reusable's
  # own precheck uses (copied verbatim, never reimplemented divergently) to
  # decide, BEFORE calling anything, whether the reusable should run at all.
  # Read-only: `artifactregistry.reader` only, same identity already used by
  # `verify-prerequisites` below — never the publisher SA, since this job
  # never pushes.
  # ===========================================================================
  check-artifact-existence:
    name: Check whether the exact SHA artifact already exists (read-only)
    needs: [guard, prepare-inputs]
    if: needs.guard.outputs.guard_pass == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_exists: ${{ steps.check.outputs.artifact_exists }}
    steps:
      - name: Google Auth — WIF to Production deployer SA (read-only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Contar tags exactos == SOURCE_SHA (mismo algoritmo que el precheck del reusable, solo lectura)
        id: check
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          command -v python3 >/dev/null 2>&1 || fail "ARTIFACT_EXISTENCE_CHECK=PARSER_UNAVAILABLE — python3 no disponible. FAIL_CLOSED."

          LIST_STDOUT="$(mktemp)"
          trap 'rm -f "$LIST_STDOUT"' EXIT

          set +e
          gcloud artifacts docker images list "${{ env.ARTIFACT_IMAGE }}" \
            --include-tags \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --format=json >"$LIST_STDOUT" 2>&1
          LIST_EXIT=$?
          set -e
          [ "$LIST_EXIT" -eq 0 ] || fail "ARTIFACT_EXISTENCE_CHECK=LOOKUP_ERROR — docker images list terminó con exit=$LIST_EXIT. FAIL_CLOSED."

          set +e
          MATCH_COUNT="$(python3 - "$SOURCE_SHA" "$LIST_STDOUT" <<'PY'
          import json
          import sys

          source_sha, json_path = sys.argv[1], sys.argv[2]
          try:
              with open(json_path, "r", encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, json.JSONDecodeError):
              sys.exit(20)
          if not isinstance(payload, list):
              sys.exit(21)
          match_count = 0
          for image in payload:
              if not isinstance(image, dict):
                  sys.exit(22)
              tags = image.get("tags") or []
              if not isinstance(tags, list):
                  sys.exit(23)
              for tag in tags:
                  if not isinstance(tag, str):
                      sys.exit(24)
                  if tag == source_sha:
                      match_count += 1
          print(match_count)
          PY
          )"
          PARSE_EXIT=$?
          set -e
          [ "$PARSE_EXIT" -eq 0 ] || fail "ARTIFACT_EXISTENCE_CHECK=LOOKUP_ERROR — parser_exit=$PARSE_EXIT. FAIL_CLOSED."
          [[ "$MATCH_COUNT" =~ ^[0-9]+$ ]] || fail "ARTIFACT_EXISTENCE_CHECK=LOOKUP_ERROR — match_count inválido: '$MATCH_COUNT'."

          case "$MATCH_COUNT" in
            0) echo "artifact_exists=NO" >> "$GITHUB_OUTPUT" ;;
            1) echo "artifact_exists=YES" >> "$GITHUB_OUTPUT" ;;
            *) fail "ARTIFACT_EXISTENCE_CHECK=INVARIANT_VIOLATION — el tag exacto $SOURCE_SHA aparece $MATCH_COUNT veces (se esperaba 0 o 1). FAIL_CLOSED." ;;
          esac

  # ===========================================================================
  # Job 4a — SOLO si el artefacto está ausente: build & publish real (mismo
  # reusable ya usado por production-db-readonly-inspection.yml, sin
  # modificar su contrato de seguridad).
  # ===========================================================================
  build-production-artifact:
    name: Build & publish Production artifact (artifact absent)
    needs: [guard, prepare-inputs, check-artifact-existence]
    if: needs.check-artifact-existence.outputs.artifact_exists == 'NO'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_backend-build-publish-production.yml
    with:
      operation: build-publish
      source_sha: ${{ github.sha }}

  # ===========================================================================
  # Job 4b — SOLO si el artefacto ya existe: REUTILIZA la imagen inmutable ya
  # publicada. NUNCA hace `docker push`, NUNCA sobrescribe el tag exacto —
  # solo resuelve su digest y prueba, leyendo la propia imagen ya publicada
  # (`docker pull` + `docker image inspect`, ambas de solo lectura), que
  # corresponde exactamente a SOURCE_SHA vía su label OCI
  # `org.opencontainers.image.revision` (la misma prueba que el build
  # original ya hace ANTES de publicar — acá se repite DESPUÉS, sobre el
  # artefacto remoto, en vez de asumir que el tag por sí solo basta).
  # ===========================================================================
  reuse-existing-artifact:
    name: Reuse existing Production artifact (never pushes)
    needs: [guard, prepare-inputs, check-artifact-existence]
    if: needs.check-artifact-existence.outputs.artifact_exists == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      source_sha: ${{ steps.revision.outputs.source_sha }}
      immutable_ref: ${{ steps.revision.outputs.immutable_ref }}
    steps:
      - name: Google Auth — WIF to Production deployer SA (read-only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Reconfirmar EXACTAMENTE un tag == SOURCE_SHA (nunca confiar ciegamente en el job anterior)
        id: recheck
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          IMAGE_TAG_REF="${{ env.ARTIFACT_IMAGE }}:${SOURCE_SHA}"

          LIST_STDOUT="$(mktemp)"
          trap 'rm -f "$LIST_STDOUT"' EXIT
          set +e
          gcloud artifacts docker images list "${{ env.ARTIFACT_IMAGE }}" \
            --include-tags --project="${{ env.PRODUCTION_PROJECT }}" --format=json >"$LIST_STDOUT" 2>&1
          LIST_EXIT=$?
          set -e
          [ "$LIST_EXIT" -eq 0 ] || fail "REUSE_RECHECK=LOOKUP_ERROR — exit=$LIST_EXIT."

          set +e
          MATCH_COUNT="$(python3 - "$SOURCE_SHA" "$LIST_STDOUT" <<'PY'
          import json, sys
          source_sha, json_path = sys.argv[1], sys.argv[2]
          with open(json_path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          count = 0
          for image in payload:
              for tag in (image.get("tags") or []):
                  if tag == source_sha:
                      count += 1
          print(count)
          PY
          )"
          PARSE_EXIT=$?
          set -e
          [ "$PARSE_EXIT" -eq 0 ] || fail "REUSE_RECHECK=LOOKUP_ERROR — parser_exit=$PARSE_EXIT."
          [ "$MATCH_COUNT" = "1" ] || fail "REUSE_RECHECK=UNEXPECTED_MATCH_COUNT — se esperaba exactamente 1 tag == $SOURCE_SHA, se encontraron $MATCH_COUNT. FAIL_CLOSED, sin reintento."

          echo "image_tag_ref=$IMAGE_TAG_REF" >> "$GITHUB_OUTPUT"

      - name: Resolver digest de la imagen EXISTENTE (nunca push)
        id: digest
        shell: bash
        env:
          IMAGE_TAG_REF: ${{ steps.recheck.outputs.image_tag_ref }}
        run: |
          set -euo pipefail
          ARTIFACT_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG_REF" --project="${{ env.PRODUCTION_PROJECT }}" --format='value(image_summary.digest)')"
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::ARTIFACT_DIGEST con formato inválido: '$ARTIFACT_DIGEST'"; exit 1; }
          echo "immutable_ref=${{ env.ARTIFACT_IMAGE }}@${ARTIFACT_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker exclusivamente para Artifact Registry southamerica-east1 (solo pull)
        shell: bash
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Descargar la imagen inmutable EXISTENTE por digest (solo lectura — nunca push)
        shell: bash
        env:
          IMMUTABLE_REF: ${{ steps.digest.outputs.immutable_ref }}
        run: docker pull "$IMMUTABLE_REF"

      - name: Verificar que el label OCI de revisión de la imagen EXISTENTE coincide con SOURCE_SHA
        id: revision
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare-inputs.outputs.source_sha }}
          IMMUTABLE_REF: ${{ steps.digest.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          ACTUAL_LABEL="$(docker image inspect "$IMMUTABLE_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$ACTUAL_LABEL" != "$SOURCE_SHA" ]; then
            echo "::error::REUSE_REVISION_MISMATCH — org.opencontainers.image.revision de la imagen existente ('$ACTUAL_LABEL') no coincide con SOURCE_SHA ('$SOURCE_SHA'). FAIL_CLOSED — el tag por sí solo no basta como prueba."
            exit 1
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=$IMMUTABLE_REF" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 5 — puente permission-less: normaliza y revuelve a probar, sin cloud,
  # los outputs de CUALQUIERA de los dos caminos (4a o 4b — exactamente uno
  # de los dos corre) antes de que cualquier job posterior los reciba.
  # ===========================================================================
  resolve-artifact:
    name: Resolve artifact identity (sin cloud)
    needs: [guard, build-production-artifact, reuse-existing-artifact]
    if: |
      always() &&
      needs.guard.outputs.guard_pass == 'YES' &&
      (needs.build-production-artifact.result == 'success' || needs.reuse-existing-artifact.result == 'success')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      verify_pass: ${{ steps.verify.outputs.verify_pass }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      immutable_ref: ${{ steps.verify.outputs.immutable_ref }}
    steps:
      - name: Reverificar source_sha e immutable_ref de cualquiera de los dos caminos (sin efectos, sin cloud)
        id: verify
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BUILD_SOURCE_SHA: ${{ needs.build-production-artifact.outputs.source_sha }}
          BUILD_IMMUTABLE_REF: ${{ needs.build-production-artifact.outputs.immutable_ref }}
          REUSE_SOURCE_SHA: ${{ needs.reuse-existing-artifact.outputs.source_sha }}
          REUSE_IMMUTABLE_REF: ${{ needs.reuse-existing-artifact.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          if [ -n "$BUILD_SOURCE_SHA" ] && [ -n "$REUSE_SOURCE_SHA" ]; then
            fail "INVARIANT_VIOLATION — tanto build como reuse produjeron salida; exactamente uno debía correr."
          fi
          if [ -n "$BUILD_SOURCE_SHA" ]; then
            SOURCE_SHA="$BUILD_SOURCE_SHA"; IMMUTABLE_REF="$BUILD_IMMUTABLE_REF"; PATH_TAKEN="build"
          elif [ -n "$REUSE_SOURCE_SHA" ]; then
            SOURCE_SHA="$REUSE_SOURCE_SHA"; IMMUTABLE_REF="$REUSE_IMMUTABLE_REF"; PATH_TAKEN="reuse"
          else
            fail "Ni build ni reuse produjeron source_sha — no se puede continuar."
          fi

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "source_sha inválido: '$SOURCE_SHA'"
          [ "$SOURCE_SHA" = "$EXPECTED_SHA" ] || fail "source_sha no coincide con github.sha."

          EXPECTED_PREFIX="southamerica-east1-docker.pkg.dev/ridepro-dbafe/korixa-backend/api@sha256:"
          case "$IMMUTABLE_REF" in
            "${EXPECTED_PREFIX}"*)
              DIGEST="${IMMUTABLE_REF#"$EXPECTED_PREFIX"}"
              [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]] || fail "immutable_ref sin digest sha256 válido: '$IMMUTABLE_REF'"
              ;;
            *) fail "immutable_ref con forma inesperada: '$IMMUTABLE_REF'" ;;
          esac

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=$IMMUTABLE_REF" >> "$GITHUB_OUTPUT"
          echo "artifact_path_taken=$PATH_TAKEN"
          echo "verify_pass=YES" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 5 — verificación de prerrequisitos, ÚNICAMENTE de solo lectura. Este
  # job NUNCA crea la Service Account futura, NUNCA otorga IAM, NUNCA cambia
  # la política de Secret Manager — solo describe/lista. Mientras
  # MIGRATION_EXECUTOR_SA no exista (estado real hoy), este job falla
  # limpiamente y ningún job posterior se ejecuta (HOLD).
  # ===========================================================================
  verify-prerequisites:
    name: Verify prerequisites (read-only — HOLD if absent)
    needs: guard
    if: needs.guard.outputs.guard_pass == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      prerequisites_met: ${{ steps.summary.outputs.prerequisites_met }}
      db_host: ${{ steps.cloud-sql.outputs.db_host }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verificar que MIGRATION_EXECUTOR_SA existe y está habilitada (NUNCA la crea)
        id: sa
        shell: bash
        run: |
          set -euo pipefail
          set +e
          DISABLED="$(gcloud iam service-accounts describe "${{ env.MIGRATION_EXECUTOR_SA }}" --project="${{ env.PRODUCTION_PROJECT }}" --format='value(disabled)' 2>&1)"
          DESCRIBE_EXIT=$?
          set -e
          if [ "$DESCRIBE_EXIT" -ne 0 ]; then
            echo "::error::MIGRATION_EXECUTOR_SA no existe todavía (${{ env.MIGRATION_EXECUTOR_SA }}) — HOLD. Este workflow nunca la crea; su creación es un Human Gate GCP/IAM separado."
            echo "sa_exists=NO" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$DISABLED" = "True" ] || [ "$DISABLED" = "true" ]; then
            echo "::error::MIGRATION_EXECUTOR_SA existe pero está deshabilitada — HOLD."
            echo "sa_exists=NO" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "sa_exists=YES" >> "$GITHUB_OUTPUT"

      - name: Verificar que la versión de secreto solicitada está ENABLED (nunca accede al payload)
        id: secret
        shell: bash
        run: |
          set -euo pipefail
          STATE="$(gcloud secrets versions describe "${{ inputs.migration_secret_version }}" --secret="${{ env.SECRET_MIGRATION_DATABASE_URL }}" --project="${{ env.PRODUCTION_PROJECT }}" --format='value(state)')"
          [ "$STATE" = "ENABLED" ] || { echo "::error::Versión ${{ inputs.migration_secret_version }} de ${{ env.SECRET_MIGRATION_DATABASE_URL }} no está ENABLED (estado real: '$STATE')."; exit 1; }
          echo "SECRET_VERSION_ENABLED=YES"
          echo "SECRET_PAYLOAD_ACCESSED=NO"

      - name: Verificar que MIGRATION_EXECUTOR_SA tiene accessor sobre el secreto de migración (nunca lo otorga)
        id: secret-iam
        shell: bash
        run: |
          set -euo pipefail
          MEMBER="serviceAccount:${{ env.MIGRATION_EXECUTOR_SA }}"
          HAS_ACCESS="$(gcloud secrets get-iam-policy "${{ env.SECRET_MIGRATION_DATABASE_URL }}" --project="${{ env.PRODUCTION_PROJECT }}" --format=json | python3 -c "
          import json, sys
          policy = json.load(sys.stdin)
          member = '$MEMBER'
          for b in policy.get('bindings', []):
              if b.get('role') == 'roles/secretmanager.secretAccessor' and member in b.get('members', []):
                  print('YES'); break
          else:
              print('NO')
          ")"
          [ "$HAS_ACCESS" = "YES" ] || { echo "::error::MIGRATION_EXECUTOR_SA no tiene roles/secretmanager.secretAccessor sobre ${{ env.SECRET_MIGRATION_DATABASE_URL }} — HOLD. Este workflow nunca otorga ese binding; es un Human Gate IAM separado."; exit 1; }
          echo "SECRET_ACCESSOR_BINDING=YES"

      - name: Resolver EXPECTED_DB_HOST (IP privada real de Cloud SQL, solo lectura)
        id: cloud-sql
        shell: bash
        run: |
          set -euo pipefail
          DB_HOST="$(gcloud sql instances describe "${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --format='value(ipAddresses[0].ipAddress)')"
          [ -n "$DB_HOST" ] || { echo "::error::No se pudo resolver la IP privada de ${{ env.CLOUD_SQL_INSTANCE }}."; exit 1; }
          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"

      - name: Resumen — todos los prerrequisitos de solo lectura pasaron
        id: summary
        shell: bash
        run: echo "prerequisites_met=YES" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 6 — ejecución real. Solo alcanzable si guard, resolve-artifact y
  # verify-prerequisites pasaron los tres. En el estado real de hoy
  # (MIGRATION_EXECUTOR_SA inexistente), verify-prerequisites SIEMPRE falla
  # primero y este job nunca corre — eso es HOLD por diseño, no un bug.
  # Crea/actualiza y ejecuta UNA VEZ un Cloud Run Job cuyo único comando es
  # `node dist/ops/db-role-hardener.js` — nunca un shell, nunca un comando
  # arbitrario. Misma VPC/subred/egress ya probados por el inspector de
  # solo lectura. `resolve-artifact` ya probó, sin importar si el artefacto
  # vino de build o de reuse, que `immutable_ref` corresponde exactamente a
  # `source_sha` == `github.sha`.
  # ===========================================================================
  run-db-role-hardener:
    name: Run DB role hardener (${{ inputs.mode }})
    needs: [guard, prepare-inputs, resolve-artifact, verify-prerequisites]
    if: needs.resolve-artifact.outputs.verify_pass == 'YES' && needs.verify-prerequisites.outputs.prerequisites_met == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Crear/actualizar el Job del hardener (solo node dist/ops/db-role-hardener.js)
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites.outputs.db_host }}
        run: |
          set -euo pipefail
          APPLY_ENV_FLAGS=()
          if [ "${{ inputs.mode }}" = "apply" ]; then
            APPLY_ENV_FLAGS=(--set-env-vars="HARDEN_CONFIRMATION=${{ inputs.confirmation }}")
          fi

          gcloud run jobs deploy "${{ env.HARDENER_JOB }}" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --region="${{ env.PRODUCTION_REGION }}" \
            --image="$IMMUTABLE_REF" \
            --command=node \
            --args=dist/ops/db-role-hardener.js \
            --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
            --network=korixa-production-vpc \
            --subnet=korixa-production-sa-east1 \
            --vpc-egress=private-ranges-only \
            --set-secrets="MIGRATION_DATABASE_URL=${{ env.SECRET_MIGRATION_DATABASE_URL }}:${{ inputs.migration_secret_version }}" \
            --set-env-vars="HARDENER_MODE=${{ inputs.mode }},EXPECTED_ADMIN_DB_USER=${{ inputs.expected_admin_db_user }},EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
            "${APPLY_ENV_FLAGS[@]}" \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet

      - name: Ejecutar el Job una vez y esperar su resultado
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "${{ env.HARDENER_JOB }}" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --region="${{ env.PRODUCTION_REGION }}" \
            --wait

      - name: Emitir resumen (el propio hardener ya sanea su stdout — nunca DSN/password)
        shell: bash
        run: |
          {
            echo "### T-F1.2 Point 8 — Production DB role hardening (${{ inputs.mode }})"
            echo ""
            echo "- SOURCE_SHA = ${{ needs.resolve-artifact.outputs.source_sha }}"
            echo "- MODE = ${{ inputs.mode }}"
            echo "- MIGRATION_SECRET_VERSION = ${{ inputs.migration_secret_version }}"
            echo "- SECRET_PAYLOAD_ACCESSED = NO"
            echo "- Ver logs del Job (${{ env.HARDENER_JOB }}) en Cloud Logging para el JSON estructurado de salida."
          } >> "$GITHUB_STEP_SUMMARY"
