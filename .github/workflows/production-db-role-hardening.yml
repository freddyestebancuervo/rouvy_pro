              echo "::error::Cleanup C/D (delete ephemeral DSN secret) falló — HOLD requerido."
            fi
          fi

      - name: "Estado E — eliminar el Cloud Run Job efímero (idempotente — ausente ya es éxito)"
        id: delete-job
        shell: bash
        env:
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
        run: |
          set +e

          # TF12-POINT8C-IAM-P1 remediation (P1-A) — mismo clasificador
          # fail-closed, duplicado por step.
          classify_resource() {
