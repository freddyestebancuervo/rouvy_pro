          SECRET_STATE="$(classify_resource secret gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}")"
          if [ "$SECRET_STATE" = "ABSENT_CONFIRMED" ]; then
            echo "DSN secret efímero ya ausente (ABSENT_CONFIRMED) — cleanup idempotente, éxito."
            echo "state=DONE" >> "$GITHUB_OUTPUT"
          else
            [ "$SECRET_STATE" = "LOOKUP_FAILED" ] && echo "::warning::LOOKUP_FAILED al comprobar el secret DSN — nunca se asume ausencia, se intenta el delete igual."
            gcloud secrets delete "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" --quiet
            DELETE_EXIT=$?
            set -e
            if [ "$DELETE_EXIT" -eq 0 ]; then
