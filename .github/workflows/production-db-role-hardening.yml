          fi

      - name: Clasificar resultado final — nunca esconder un cleanup incompleto detrás de "la operación falló"
        if: always()
        shell: bash
        env:
          APPLY_RESULT: ${{ needs.apply.result }}
          REMOVE_RESULT: ${{ needs.remove-target-cloudsqlsuperuser.result }}
