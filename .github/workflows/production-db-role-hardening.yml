        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Descubrir y remover, defensivamente, exactamente los recursos de esta operation_id (nunca crea nada salvo — si el admin todavía existe — el Cloud Run Job efímero, necesario para revocar por el camino VPC privado)
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set +e

          # TF12-POINT8C-IAM-P1 remediation (P1-A) — clasificador
          # fail-closed de existencia (ver cleanup-after-preflight para la
          # explicación completa de la evidencia detrás de cada patrón de
          # NOT_FOUND). Duplicado por step — las funciones no persisten
          # entre steps de GitHub Actions.
          classify_resource() {
            local kind="$1"; shift
            local stderr_file; stderr_file="$(mktemp)"
            "$@" >/dev/null 2>"$stderr_file"
            local exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
              rm -f "$stderr_file"
              echo "EXISTS"
              return 0
            fi
            local not_found_pattern=""
            case "$kind" in
              cloudsql_user) not_found_pattern="HTTPError 404" ;;
              secret) not_found_pattern="NOT_FOUND:" ;;
              cloudrun_job) not_found_pattern="Cannot find job" ;;
              *)
                # TF12-POINT8C-IAM-P1-EFFECTIVE-ACTAS-FINAL-REMEDIATION
                # (P2): un `kind` desconocido NUNCA debe caer al chequeo
                # genérico de abajo — con `not_found_pattern` vacío,
                # `grep -q ""` matchea CUALQUIER stderr no vacío,
                # produciendo ABSENT_CONFIRMED falso. Return inmediato,
                # fail-closed: un kind no reconocido es, por definición,
                # una clasificación que este código no sabe hacer con
                # certeza — nunca ausencia.
                rm -f "$stderr_file"
                echo "LOOKUP_FAILED"
                return 0
                ;;
            esac
            if grep -q "$not_found_pattern" "$stderr_file"; then
              rm -f "$stderr_file"
              echo "ABSENT_CONFIRMED"
            else
              rm -f "$stderr_file"
              echo "LOOKUP_FAILED"
            fi
          }

          ADMIN_STATE_A="$(classify_resource cloudsql_user gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}")"
          [ "$ADMIN_STATE_A" = "LOOKUP_FAILED" ] && echo "::warning::LOOKUP_FAILED al comprobar el admin efímero — nunca se asume ausencia, se intenta igual."
          if [ "$ADMIN_STATE_A" != "ABSENT_CONFIRMED" ]; then
            DSN_SECRET_STATE_A="$(classify_resource secret gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}")"
            [ "$DSN_SECRET_STATE_A" = "LOOKUP_FAILED" ] && echo "::warning::LOOKUP_FAILED al comprobar el secret DSN — nunca se asume ausencia, se intenta igual."
            if [ "$DSN_SECRET_STATE_A" != "ABSENT_CONFIRMED" ] && [ -n "$IMMUTABLE_REF" ]; then
              gcloud run jobs deploy "$EPHEMERAL_JOB" \
                --project="${{ env.PRODUCTION_PROJECT }}" \
                --region="${{ env.PRODUCTION_REGION }}" \
                --image="$IMMUTABLE_REF" \
                --command=node \
                --args=dist/ops/db-hardener-bootstrap.js \
                --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
                --network=korixa-production-vpc \
                --subnet=korixa-production-sa-east1 \
                --vpc-egress=private-ranges-only \
                --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
                --set-env-vars="BOOTSTRAP_MODE=revoke-admin-option,EPHEMERAL_ADMIN_USERNAME=${EPHEMERAL_ADMIN},EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
                --max-retries=0 \
                --task-timeout=300s \
                --quiet >/dev/null 2>&1
              gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait >/dev/null 2>&1
              echo "CLEANUP_A_ATTEMPTED=YES"
            elif [ "$DSN_SECRET_STATE_A" = "ABSENT_CONFIRMED" ]; then
              echo "CLEANUP_A_SKIPPED=DSN_SECRET_ALREADY_ABSENT (nada que revocar vía él)"
            else
              echo "CLEANUP_A_SKIPPED=ARTIFACT_UNAVAILABLE (no bloquea B/C-D/E)"
            fi
            # B — eliminar el admin.
            gcloud sql users delete "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --quiet >/dev/null 2>&1
            echo "CLEANUP_B_ATTEMPTED=YES (pre_state=$ADMIN_STATE_A)"
          else
            echo "CLEANUP_A_B_SKIPPED=ADMIN_ALREADY_ABSENT"
          fi

          # C/D — eliminar el DSN secret (global). Solo ABSENT_CONFIRMED salta el delete.
          SECRET_STATE_CD="$(classify_resource secret gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}")"
          if [ "$SECRET_STATE_CD" = "ABSENT_CONFIRMED" ]; then
            echo "CLEANUP_C_D_SKIPPED=DSN_SECRET_ALREADY_ABSENT"
          else
            [ "$SECRET_STATE_CD" = "LOOKUP_FAILED" ] && echo "::warning::LOOKUP_FAILED al comprobar el secret DSN — nunca se asume ausencia, se intenta el delete igual."
            gcloud secrets delete "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" --quiet >/dev/null 2>&1
            echo "CLEANUP_C_D_ATTEMPTED=YES (pre_state=$SECRET_STATE_CD)"
          fi

          # E — eliminar el Cloud Run Job efímero. Solo ABSENT_CONFIRMED salta el delete.
          JOB_STATE_E="$(classify_resource cloudrun_job gcloud run jobs describe "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}")"
          if [ "$JOB_STATE_E" = "ABSENT_CONFIRMED" ]; then
            echo "CLEANUP_E_SKIPPED=JOB_ALREADY_ABSENT"
          else
            [ "$JOB_STATE_E" = "LOOKUP_FAILED" ] && echo "::warning::LOOKUP_FAILED al comprobar el Cloud Run Job efímero — nunca se asume ausencia, se intenta el delete igual."
            gcloud run jobs delete "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --quiet >/dev/null 2>&1
            echo "CLEANUP_E_ATTEMPTED=YES (pre_state=$JOB_STATE_E)"
          fi

          set -e

      - name: Verificación independiente de ausencia — nunca se declara CLEAN salvo ABSENT_CONFIRMED en los tres recursos
        shell: bash
        env:
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
        run: |
          set +e

          # TF12-POINT8C-IAM-P1 remediation (P1-A) — mismo clasificador fail-closed.
          classify_resource() {
            local kind="$1"; shift
            local stderr_file; stderr_file="$(mktemp)"
            "$@" >/dev/null 2>"$stderr_file"
            local exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
              rm -f "$stderr_file"
              echo "EXISTS"
              return 0
            fi
            local not_found_pattern=""
            case "$kind" in
              cloudsql_user) not_found_pattern="HTTPError 404" ;;
              secret) not_found_pattern="NOT_FOUND:" ;;
              cloudrun_job) not_found_pattern="Cannot find job" ;;
              *)
                # TF12-POINT8C-IAM-P1-EFFECTIVE-ACTAS-FINAL-REMEDIATION
                # (P2): un `kind` desconocido NUNCA debe caer al chequeo
                # genérico de abajo — con `not_found_pattern` vacío,
                # `grep -q ""` matchea CUALQUIER stderr no vacío,
                # produciendo ABSENT_CONFIRMED falso. Return inmediato,
                # fail-closed: un kind no reconocido es, por definición,
                # una clasificación que este código no sabe hacer con
                # certeza — nunca ausencia.
                rm -f "$stderr_file"
                echo "LOOKUP_FAILED"
                return 0
                ;;
            esac
            if grep -q "$not_found_pattern" "$stderr_file"; then
              rm -f "$stderr_file"
              echo "ABSENT_CONFIRMED"
            else
              rm -f "$stderr_file"
              echo "LOOKUP_FAILED"
            fi
          }

          ADMIN_STATE="$(classify_resource cloudsql_user gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}")"
          DSN_SECRET_STATE="$(classify_resource secret gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}")"
          JOB_STATE="$(classify_resource cloudrun_job gcloud run jobs describe "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}")"
          set -e
          {
            echo "### T-F1.2 Point 8C — cleanup_only — operation ${{ needs.derive-operation-names.outputs.operation_id }}"
            echo ""
            echo "- ORIGINAL_OPERATION_SHA = ${{ inputs.operation_source_sha != '' && inputs.operation_source_sha || 'NOT_PROVIDED_BY_OPERATOR' }} (audit-only, never enforced for cleanup_only — recovery may legitimately run newer trusted cleanup code)"
            echo "- CLEANUP_IMPLEMENTATION_SHA = ${{ github.sha }}"
            echo ""
            if [ "$ADMIN_STATE" = "ABSENT_CONFIRMED" ] && [ "$DSN_SECRET_STATE" = "ABSENT_CONFIRMED" ] && [ "$JOB_STATE" = "ABSENT_CONFIRMED" ]; then
              echo "CLEANUP_ONLY_RESULT = CLEAN (los tres recursos confirmados AUSENTES — ABSENT_CONFIRMED, nunca inferido de un error genérico)"
            else
              echo "CLEANUP_ONLY_RESULT = HOLD_STILL_PRESENT_OR_UNVERIFIED (admin=$ADMIN_STATE, secret=$DSN_SECRET_STATE, job=$JOB_STATE)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ADMIN_STATE" != "ABSENT_CONFIRMED" ] || [ "$DSN_SECRET_STATE" != "ABSENT_CONFIRMED" ] || [ "$JOB_STATE" != "ABSENT_CONFIRMED" ]; then
            echo "::error::HOLD_PRIVILEGED_CLEANUP_INCOMPLETE — CLEANUP_ONLY no logró confirmar los tres recursos AUSENTES (ABSENT_CONFIRMED) — un LOOKUP_FAILED nunca se trata como ausencia — reintentar o escalar."
            exit 1
          fi
