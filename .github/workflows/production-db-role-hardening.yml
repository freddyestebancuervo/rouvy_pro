name: Backend — Production DB role hardening (ephemeral admin, manual dispatch only)

# T-F1.2 Point 8C — this file's content was REPLACED IN PLACE (PR #115 final-
# integration remediation, WIF Option W1) with the ephemeral-admin
# architecture proven in a disposable Cloud SQL instance
# (TF12-POINT8C-EPHEMERAL-HARDENER-ADMIN-NONPROD-PROOF-20260902): NO standing
# PostgreSQL hardener administrator exists at any time. Every dispatch
# creates exactly one purpose-scoped, time-scoped, `cloudsqlsuperuser`-
# holding identity, uses it once, and deletes it — independently verified
# absent afterward. See git history for the prior persistent-admin
# implementation this replaces.
#
# WHY WIF OPTION W1 (this filename, not a new one): a live read-only audit of
# Production's WIF provider (`github-production-deployer`) and the deployer
# SA's `roles/iam.workloadIdentityUser` binding confirmed both are scoped, by
# an explicit `workflow_ref`/`job_workflow_ref` filename allowlist, to
# `production-db-role-hardening.yml` — this exact filename. A separate,
# short-lived file (`production-db-role-hardener-ephemeral.yml`, used while
# developing and proving this architecture in PR #115) was NEVER in that
# allowlist and could never have been dispatched against Production; it has
# been deleted, and this architecture now lives at the one filename Production
# WIF already authorizes. No WIF/IAM mutation was performed or is required —
# confirmed via `gcloud iam workload-identity-pools providers describe` and
# `gcloud iam service-accounts get-iam-policy` (read-only) both before and
# after this consolidation.
#
# WHY THE OLD MIGRATION-SECRET IDENTITY MODEL IS GONE: the prior content of
# this file mounted `korixa-production-migration-database-url` as the
# hardener's connected identity — proven, across this investigation, to hold
# `korixa_app`'s OWN credentials (the target role itself), which
# `db-role-hardener.ts` correctly and unconditionally rejects
# (`TARGET_ROLE_IDENTITY_REJECTED`). That secret is NEVER read or referenced
# anywhere in this file's current content. The ephemeral DSN secret this
# architecture uses is entirely separate, newly created per operation, and
# destroyed at the end of every operation.
#
# ACTIVATION INTERLOCK (same as every other Production workflow in this
# repo): `on: workflow_dispatch` ONLY.
#
# TWO-DISPATCH, TWO-GATE MODEL: this workflow has three mutually exclusive
# modes, dispatched separately, each requiring its own distinct exact
# confirmation token:
#
#   1. `bootstrap_and_preflight` — creates the ephemeral admin + ephemeral
#      DSN secret + IAM binding + ADMIN OPTION grant, runs preflight, and
#      DELIBERATELY STOPS. It does NOT clean up (the ephemeral identity must
#      survive into the next dispatch) and does NOT proceed to apply
#      automatically. Its only output is non-secret evidence plus the
#      `operation_id` the operator must copy into the next dispatch.
#
#   2. `apply` — takes the `operation_id` and `operation_source_sha` from
#      step 1 as required inputs, re-verifies the exact operation context
#      hasn't drifted, applies, removes `korixa_app`'s `cloudsqlsuperuser`
#      via the Cloud SQL Admin API (never SQL REVOKE — proven ineffective
#      against that specific role in the cleanroom investigation), verifies,
#      and ALWAYS attempts full cleanup regardless of success or failure.
#
#   3. `cleanup_only` — incident recovery. Takes only `operation_id`,
#      discovers and removes exactly that operation's resources, and is
#      idempotent (already-absent is success, not failure). Exists because a
#      cancelled/lost runner can strand resources before `apply`'s own
#      `always()` cleanup ever runs. Its required security property is NOT
#      "creates nothing" — PR #115 final-integration remediation, Phase 6:
#      it MAY deploy/redeploy the exact operation-scoped ephemeral Cloud Run
#      Job (never a new or different one) when necessary to revoke ADMIN
#      OPTION over the private VPC path before deleting the admin. The
#      actual invariant, always true, is: `cleanup_only` can never create or
#      elevate a PostgreSQL identity, a Secret Manager secret, an IAM
#      privilege, a role/target membership, or an application privilege —
#      every action it takes either removes a privileged resource or
#      redeploys the one cleanup execution surface strictly needed to do so.
#
# SOURCE SHA BINDING (corrected — PR #115 P1 remediation, Phase 9): `apply`
# requires `operation_source_sha` to equal `github.sha` EXACTLY. IMPORTANT
# CORRECTION: an earlier version of this comment claimed an operator could
# work around `main` having advanced by dispatching `apply` with
# `gh workflow run ... --ref <the exact source SHA>`. That is FALSE and
# UNSUPPORTED — confirmed via `gh workflow run --help`, which documents
# `--ref` as accepting only a "Branch or tag name," never a commit SHA;
# `workflow_dispatch` itself has no mechanism to pin execution to an
# arbitrary historical commit. Combined with this workflow's own
# `github.ref == refs/heads/main` guard requirement, there is NO supported
# way to re-dispatch `apply` against an old SHA once `main` has moved.
#
# The actual, fail-closed policy is therefore simpler than the old comment
# implied: IF `main`'s current tip still equals `operation_source_sha`,
# `apply` proceeds normally. IF `main` advanced, `apply` is refused
# (HOLD_OPERATION_CONTEXT_DRIFT) with NO retry path for that same operation
# — the correct recovery is: dispatch `cleanup_only` for that `operation_id`
# (which deliberately does NOT enforce this SHA match, since incident
# recovery may legitimately need newer, trusted cleanup code — it records
# `ORIGINAL_OPERATION_SHA` and `CLEANUP_IMPLEMENTATION_SHA` separately,
# never silently mixing them), then start an entirely new operation via a
# fresh `bootstrap_and_preflight` dispatch on current `main`, under its own
# new Human Gate.
#
# NAMING NOTE: resource-name derivation (ephemeral admin username, ephemeral
# DSN secret name) is DUPLICATED here in bash from
# `backend/src/ops/hardener-operation.ts`'s pure functions, because GitHub
# Actions bash steps cannot import a TypeScript module without a build step.
# `backend/src/ops/hardener-operation.spec.ts` is the single source of truth
# for the exact format; this file's `derive-operation-names` step must be
# kept in exact sync with it — this is a real, documented duplication risk
# (see PR description), not a shortcut.
#
# =============================================================================
# PRIVATE-VPC-ONLY DESIGN — NO DATA API, NO REGIONAL SECRET (PR #115 P1-B
# remediation): a prior revision of this file used `gcloud sql instances
# execute-sql --password-secret-version` for the ephemeral admin's ADMIN
# OPTION grant/revoke. That mechanism was fully removed after live NONPROD
# proof surfaced two real defects with it: (1) `gcloud secrets ...
# --location=<region>` is broken in the installed gcloud SDK for every
# regional-secret subcommand (a client-side CLI defect, confirmed by direct
# REST calls succeeding against the same API), and (2) `execute-sql` itself
# requires `settings.dataApiAccess=ALLOW_DATA_API` on the instance — never
# verified before, and a real Production security-posture change on a
# private-IP instance (per `gcloud sql instances patch --help`: it "will
# allow authorized users to access the instance from the public internet
# using ExecuteSql API"), never appropriate to bundle silently into this PR.
# =============================================================================
# Both defects are now moot: the ADMIN OPTION grant/revoke runs entirely
# through `backend/src/ops/db-hardener-bootstrap.ts`
# (`dist/ops/db-hardener-bootstrap.js`), a narrowly-scoped typed entrypoint
# executed inside the SAME ephemeral Cloud Run Job used for preflight/apply/
# verify — same `MIGRATION_EXECUTOR_SA`, same `--vpc-egress=private-ranges-
# only`, same private Cloud SQL IP, same single global DSN secret. There is
# no regional secret, no `execute-sql`, and no `dataApiAccess` dependency
# anywhere in this file (verified by `hardener-workflow-contract.spec.ts`).
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bootstrap_and_preflight (stage 1, stops after preflight) | apply (stage 2, requires operation_id from stage 1) | cleanup_only (incident recovery, requires operation_id)"
        required: true
        type: choice
        options:
          - bootstrap_and_preflight
          - apply
          - cleanup_only
      operation_id:
        description: "Required for apply/cleanup_only — exactly the operation_id printed in the bootstrap_and_preflight run's summary. Must be left EMPTY for bootstrap_and_preflight (a fresh one is generated)."
        required: false
        type: string
        default: ""
      operation_source_sha:
        description: "Required for apply — must equal the exact source SHA the bootstrap_and_preflight run used (HOLD_OPERATION_CONTEXT_DRIFT otherwise). Ignored/unused for bootstrap_and_preflight (github.sha is used). Optional for cleanup_only — if provided, recorded as ORIGINAL_OPERATION_SHA alongside CLEANUP_IMPLEMENTATION_SHA (github.sha) for audit purposes only, never enforced (Phase 14: recovery may legitimately run newer trusted cleanup code)."
        required: false
        type: string
        default: ""
      confirmation:
        description: "Must be exactly BOOTSTRAP_AND_PREFLIGHT_EPHEMERAL_HARDENER (bootstrap_and_preflight), APPLY_EPHEMERAL_HARDENER_HARDEN_KORIXA_APP (apply), or CLEANUP_ONLY_EPHEMERAL_HARDENER (cleanup_only) — must match the chosen mode."
        required: true
        type: string

permissions:
  contents: read

env:
  PRODUCTION_PROJECT: ridepro-dbafe
  PRODUCTION_REGION: southamerica-east1
  CLOUD_SQL_INSTANCE: korixa-production-postgres
  # PR #115 P2 remediation: expectativas exactas de postura de red/versión
  # que `verify-prerequisites-instance` prueba estructuradamente (JSON, nunca
  # `ipAddresses[0]` por índice) antes de resolver EXPECTED_DB_HOST.
  EXPECTED_DATABASE_VERSION: POSTGRES_16
  EXPECTED_VPC_NETWORK: korixa-production-vpc
  TARGET_DATABASE: korixa_production
  TARGET_ROLE: korixa_app
  # PR #115 P1-3 remediation — lease acotado y machine-enforced del admin
  # efímero. "purpose-scoped, time-scoped, ephemeral" exige que la ventana
  # entre bootstrap_and_preflight y apply tenga un límite EXPLÍCITO, no
  # "indefinido hasta que un humano recuerde limpiar". 3600s (1 hora):
  # suficiente para que un operador revise la evidencia de Stage 1 y
  # dispatchee apply en la misma sesión de trabajo, acotado para que una
  # operación abandonada nunca deje una identidad cloudsqlsuperuser viva
  # sin límite de tiempo. No existe (ni se introduce) ningún trigger
  # `schedule:` — este workflow sigue siendo estrictamente
  # `workflow_dispatch`-only. La aplicación es REACTIVA: `verify-operation-
  # context` calcula el lease a partir del propio `createTime` del secret
  # DSN efímero (metadata de GCP ya existente, sin infraestructura nueva) y
  # rechaza `apply` con HOLD_OPERATION_LEASE_EXPIRED si expiró — ese rechazo
  # dispara automáticamente cleanup (P1-4), igual que cualquier otro drift
  # pre-apply. Manejo de carrera: el cálculo ocurre en una única lectura
  # dentro de este job (ventana acotada por el timeout del propio job, 10
  # min) — nunca hay una ventana donde una operación expirada se trate como
  # válida más allá de esa evaluación puntual.
  EPHEMERAL_ADMIN_MAX_LIFETIME_SECONDS: "3600"
  DEPLOYER_SA: korixa-production-deployer@ridepro-dbafe.iam.gserviceaccount.com
  MIGRATION_EXECUTOR_SA: korixa-prod-migration-exec@ridepro-dbafe.iam.gserviceaccount.com
  ARTIFACT_IMAGE: southamerica-east1-docker.pkg.dev/ridepro-dbafe/korixa-backend/api
  # Distinto, deliberadamente, del Job persistente legado
  # (`korixa-production-db-role-hardener`) — ver
  # `deriveEphemeralJobName` en hardener-operation.ts.
  EPHEMERAL_JOB_PREFIX: korixa-prod-hardener-once-
  EPHEMERAL_ADMIN_PREFIX: korixa_db_hardener_once_
  # PR #115 P1-B remediation (Phase 3): un único secret GLOBAL con el DSN
  # completo — el secret REGIONAL de password (que existió brevemente en una
  # revisión anterior de este PR, para `gcloud sql instances execute-sql
  # --password-secret-version`) fue eliminado por completo: ese mecanismo
  # exigía `settings.dataApiAccess=ALLOW_DATA_API` en la instancia, nunca
  # antes verificado y con implicancias reales de postura de seguridad en una
  # instancia de IP privada (ver `db-hardener-bootstrap.ts`). El GRANT/REVOKE
  # del ADMIN OPTION corre ahora enteramente por el camino VPC privado ya
  # probado para preflight/apply/verify.
  EPHEMERAL_DSN_SECRET_PREFIX: korixa-production-db-hardener-dsn-

jobs:
  # ===========================================================================
  # Job 1 — guard. Permission-less, sin checkout, sin OIDC, sin gcloud.
  # ===========================================================================
  guard:
    name: Guard — manual-dispatch-only, sin acceso cloud
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      guard_pass: ${{ steps.checks.outputs.guard_pass }}
      mode: ${{ steps.checks.outputs.mode }}
      operation_id: ${{ steps.checks.outputs.operation_id }}
      # PR #115 P1-4a remediation: `sha_drift_detected` se escribe ANTES del
      # `exit 1` del chequeo de drift — GitHub Actions conserva los outputs
      # ya escritos por `$GITHUB_OUTPUT` aunque el step/job termine en
      # failure. Esto permite que `derive-operation-names` y `cleanup-only`
      # (vía `if: always()`) sigan pudiendo derivar los nombres de recurso y
      # disparar cleanup automático para una operación real, rechazada
      # específicamente por drift de SHA — nunca para un dispatch
      # malformado/no autenticado, que nunca llega a esta rama.
      sha_drift_detected: ${{ steps.checks.outputs.sha_drift_detected }}
    steps:
      - name: Validar origen, ref, SHA, modo, confirmación, operation_id (sin efectos, sin cloud)
        id: checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          OPERATION_ID: ${{ inputs.operation_id }}
          OPERATION_SOURCE_SHA: ${{ inputs.operation_source_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ "$EVENT_NAME" = "workflow_dispatch" ] || fail "EVENT_NAME esperado 'workflow_dispatch', obtenido '$EVENT_NAME'."
          [ "$REPOSITORY" = "freddyestebancuervo/rouvy_pro" ] || fail "REPOSITORY inesperado: '$REPOSITORY'"
          [ "$REF" = "refs/heads/main" ] || fail "REF esperado 'refs/heads/main', obtenido '$REF'."
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "github.sha no es un SHA-1 completo (40 hex minúsculas): '$SHA'"

          case "$MODE" in
            bootstrap_and_preflight) EXPECTED_CONFIRMATION="BOOTSTRAP_AND_PREFLIGHT_EPHEMERAL_HARDENER" ;;
            apply)                   EXPECTED_CONFIRMATION="APPLY_EPHEMERAL_HARDENER_HARDEN_KORIXA_APP" ;;
            cleanup_only)            EXPECTED_CONFIRMATION="CLEANUP_ONLY_EPHEMERAL_HARDENER" ;;
            *) fail "mode debe ser exactamente uno de bootstrap_and_preflight/apply/cleanup_only: '$MODE'" ;;
          esac
          [ "$CONFIRMATION" = "$EXPECTED_CONFIRMATION" ] || fail "confirmation no coincide con el valor exacto exigido para mode='$MODE'."

          if [ "$MODE" = "bootstrap_and_preflight" ]; then
            [ -z "$OPERATION_ID" ] || fail "operation_id debe estar VACÍO para bootstrap_and_preflight — se genera uno nuevo, nunca se acepta uno provisto por el operador para esta etapa."
          else
            [[ "$OPERATION_ID" =~ ^[0-9a-f]{12}$ ]] || fail "operation_id inválido para mode='$MODE' — debe ser exactamente 12 caracteres hexadecimales en minúsculas (ver hardener-operation.ts). Recibido: '$OPERATION_ID'"
          fi

          if [ "$MODE" = "apply" ]; then
            [[ "$OPERATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "operation_source_sha inválido para mode='apply': '$OPERATION_SOURCE_SHA'"
          fi

          # PR #115 P1-4a remediation: mode/operation_id se escriben tan
          # pronto como su FORMATO está validado — antes del chequeo de
          # drift de SHA, que es el ÚNICO chequeo restante que puede fallar
          # sobre una operación por lo demás legítima y bien formada.
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "operation_id=$OPERATION_ID" >> "$GITHUB_OUTPUT"

          if [ "$MODE" = "apply" ] && [ "$OPERATION_SOURCE_SHA" != "$SHA" ]; then
            echo "sha_drift_detected=YES" >> "$GITHUB_OUTPUT"
            fail "HOLD_OPERATION_CONTEXT_DRIFT — operation_source_sha ('$OPERATION_SOURCE_SHA') no coincide con github.sha actual ('$SHA'). main avanzó desde el dispatch de bootstrap_and_preflight. NO existe forma soportada de re-dispatchear apply contra el SHA original (workflow_dispatch/--ref de gh CLI solo aceptan branch o tag, nunca un SHA de commit). PR #115 P1-4a: este rechazo dispara automáticamente cleanup para operation_id=$OPERATION_ID (job cleanup-only, trigger automático) — no requiere una segunda acción manual además de iniciar una operación nueva con bootstrap_and_preflight sobre el main actual, bajo un nuevo Human Gate."
          fi

          echo "guard_pass=YES" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 2 — checkout y reverificación de frescura. Igual que el workflow
  # legado.
  # ===========================================================================
  prepare-inputs:
    name: Prepare inputs (checkout only)
    needs: guard
    if: needs.guard.outputs.guard_pass == 'YES'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verificar SHA fuente exacto
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          [ "$CHECKED_OUT_SHA" = "${{ github.sha }}" ] || { echo "::error::Checkout SHA mismatch."; exit 1; }
          echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 3 — deriva operation_id (bootstrap_and_preflight genera uno fresco;
  # apply/cleanup_only reutilizan el del input) y los tres nombres de
  # recursos, de forma permission-less. Espejo EXACTO de
  # hardener-operation.ts — cualquier cambio ahí requiere el mismo cambio
  # acá.
  # ===========================================================================
  derive-operation-names:
    name: Derive operation_id and resource names (sin cloud)
    needs: guard
    # PR #115 P1-4a remediation: también corre cuando guard rechazó apply
    # específicamente por drift de SHA (`sha_drift_detected`) — necesario
    # para que el cleanup automático de esa operación pueda derivar sus
    # nombres de recurso, aunque guard_pass haya sido NO en ese dispatch.
    if: |
      always() &&
      (needs.guard.outputs.guard_pass == 'YES' || needs.guard.outputs.sha_drift_detected == 'YES')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      operation_id: ${{ steps.derive.outputs.operation_id }}
      ephemeral_admin_username: ${{ steps.derive.outputs.ephemeral_admin_username }}
      ephemeral_dsn_secret_name: ${{ steps.derive.outputs.ephemeral_dsn_secret_name }}
      ephemeral_job_name: ${{ steps.derive.outputs.ephemeral_job_name }}
    steps:
      - name: Generar/reutilizar operation_id y derivar nombres
        id: derive
        shell: bash
        env:
          MODE: ${{ needs.guard.outputs.mode }}
          INPUT_OPERATION_ID: ${{ needs.guard.outputs.operation_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          if [ "$MODE" = "bootstrap_and_preflight" ]; then
            OPERATION_ID="$(openssl rand -hex 6)"
          else
            OPERATION_ID="$INPUT_OPERATION_ID"
          fi
          [[ "$OPERATION_ID" =~ ^[0-9a-f]{12}$ ]] || fail "operation_id derivado inválido: '$OPERATION_ID'"

          echo "operation_id=$OPERATION_ID" >> "$GITHUB_OUTPUT"
          echo "ephemeral_admin_username=${{ env.EPHEMERAL_ADMIN_PREFIX }}${OPERATION_ID}" >> "$GITHUB_OUTPUT"
          echo "ephemeral_dsn_secret_name=${{ env.EPHEMERAL_DSN_SECRET_PREFIX }}${OPERATION_ID}" >> "$GITHUB_OUTPUT"
          echo "ephemeral_job_name=${{ env.EPHEMERAL_JOB_PREFIX }}${OPERATION_ID}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Jobs 4a-4d — resolución del artefacto inmutable. IDÉNTICO en espíritu a la
  # implementación legacy de este mismo archivo (persistent-admin, ver git
  # history — nunca se modificó ese contrato al rediseñar la identidad DB).
  # Se ejecuta para los TRES modos — PR #115 P1-B remediation: `cleanup_only`
  # ahora también puede necesitar ejecutar el Cloud Run Job efímero
  # (`db-hardener-bootstrap.js revoke-admin-option`, camino VPC privado) si
  # el admin efímero todavía existe, así que también necesita resolver un
  # artefacto inmutable — ya no es cierto que `cleanup_only` nunca ejecuta
  # ningún Cloud Run Job.
  # ===========================================================================
  check-artifact-existence:
    name: Check whether the exact SHA artifact already exists (read-only)
    needs: [guard, prepare-inputs]
    if: needs.guard.outputs.guard_pass == 'YES' && (needs.guard.outputs.mode == 'bootstrap_and_preflight' || needs.guard.outputs.mode == 'apply' || needs.guard.outputs.mode == 'cleanup_only')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_exists: ${{ steps.check.outputs.artifact_exists }}
    steps:
      - name: Google Auth — WIF to Production deployer SA (read-only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Contar tags exactos == SOURCE_SHA (solo lectura)
        id: check
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          command -v python3 >/dev/null 2>&1 || fail "ARTIFACT_EXISTENCE_CHECK=PARSER_UNAVAILABLE — FAIL_CLOSED."

          LIST_STDOUT="$(mktemp)"; LIST_STDERR="$(mktemp)"
          trap 'rm -f "$LIST_STDOUT" "$LIST_STDERR"' EXIT
          set +e
          gcloud artifacts docker images list "${{ env.ARTIFACT_IMAGE }}" --include-tags --project="${{ env.PRODUCTION_PROJECT }}" --format=json >"$LIST_STDOUT" 2>"$LIST_STDERR"
          LIST_EXIT=$?
          set -e
          if [ "$LIST_EXIT" -ne 0 ]; then
            LIST_ERR="$(grep -v 'gha-creds' "$LIST_STDERR" || true)"
            fail "ARTIFACT_EXISTENCE_CHECK=LOOKUP_FAILED — exit=$LIST_EXIT. $LIST_ERR"
          fi

          MATCH_COUNT="$(python3 - "$SOURCE_SHA" "$LIST_STDOUT" <<'PY'
          import json, sys
          source_sha, json_path = sys.argv[1], sys.argv[2]
          with open(json_path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          count = 0
          for image in payload:
              for tag in (image.get("tags") or []):
                  if tag == source_sha:
                      count += 1
          print(count)
          PY
          )"
          case "$MATCH_COUNT" in
            0) echo "artifact_exists=NO" >> "$GITHUB_OUTPUT" ;;
            1) echo "artifact_exists=YES" >> "$GITHUB_OUTPUT" ;;
            *) fail "ARTIFACT_EXISTENCE_CHECK=INVARIANT_VIOLATION — $MATCH_COUNT coincidencias, se esperaba 0 o 1." ;;
          esac

  build-production-artifact:
    name: Build & publish Production artifact (artifact absent)
    needs: [guard, prepare-inputs, check-artifact-existence]
    if: needs.check-artifact-existence.outputs.artifact_exists == 'NO'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_backend-build-publish-production.yml
    with:
      operation: build-publish
      source_sha: ${{ github.sha }}

  reuse-existing-artifact:
    name: Reuse existing Production artifact (never pushes)
    needs: [guard, prepare-inputs, check-artifact-existence]
    if: needs.check-artifact-existence.outputs.artifact_exists == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      source_sha: ${{ steps.revision.outputs.source_sha }}
      immutable_ref: ${{ steps.revision.outputs.immutable_ref }}
    steps:
      - name: Google Auth — WIF to Production deployer SA (read-only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Reconfirmar EXACTAMENTE un tag == SOURCE_SHA
        id: recheck
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          IMAGE_TAG_REF="${{ env.ARTIFACT_IMAGE }}:${SOURCE_SHA}"
          MATCH_COUNT="$(gcloud artifacts docker images list "${{ env.ARTIFACT_IMAGE }}" --include-tags --project="${{ env.PRODUCTION_PROJECT }}" --format=json | python3 -c "
          import json, sys
          payload = json.load(sys.stdin)
          count = sum(1 for image in payload for tag in (image.get('tags') or []) if tag == '$SOURCE_SHA')
          print(count)
          ")"
          [ "$MATCH_COUNT" = "1" ] || fail "REUSE_RECHECK=UNEXPECTED_MATCH_COUNT — $MATCH_COUNT."
          echo "image_tag_ref=$IMAGE_TAG_REF" >> "$GITHUB_OUTPUT"
      - name: Resolver digest de la imagen EXISTENTE (nunca push)
        id: digest
        shell: bash
        env:
          IMAGE_TAG_REF: ${{ steps.recheck.outputs.image_tag_ref }}
        run: |
          set -euo pipefail
          ARTIFACT_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG_REF" --project="${{ env.PRODUCTION_PROJECT }}" --format='value(image_summary.digest)')"
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest inválido"; exit 1; }
          echo "immutable_ref=${{ env.ARTIFACT_IMAGE }}@${ARTIFACT_DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Configurar Docker (solo pull)
        shell: bash
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet
      - name: Descargar la imagen inmutable EXISTENTE (solo lectura)
        shell: bash
        env:
          IMMUTABLE_REF: ${{ steps.digest.outputs.immutable_ref }}
        run: docker pull "$IMMUTABLE_REF"
      - name: Verificar label OCI de revisión
        id: revision
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare-inputs.outputs.source_sha }}
          IMMUTABLE_REF: ${{ steps.digest.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          ACTUAL_LABEL="$(docker image inspect "$IMMUTABLE_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [ "$ACTUAL_LABEL" = "$SOURCE_SHA" ] || { echo "::error::REUSE_REVISION_MISMATCH"; exit 1; }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=$IMMUTABLE_REF" >> "$GITHUB_OUTPUT"

  resolve-artifact:
    name: Resolve artifact identity (sin cloud)
    needs: [guard, build-production-artifact, reuse-existing-artifact]
    if: |
      always() &&
      needs.guard.outputs.guard_pass == 'YES' &&
      (needs.guard.outputs.mode == 'bootstrap_and_preflight' || needs.guard.outputs.mode == 'apply' || needs.guard.outputs.mode == 'cleanup_only') &&
      (needs.build-production-artifact.result == 'success' || needs.reuse-existing-artifact.result == 'success')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      verify_pass: ${{ steps.verify.outputs.verify_pass }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      immutable_ref: ${{ steps.verify.outputs.immutable_ref }}
    steps:
      - name: Reverificar source_sha e immutable_ref (sin efectos, sin cloud)
        id: verify
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BUILD_SOURCE_SHA: ${{ needs.build-production-artifact.outputs.source_sha }}
          BUILD_IMMUTABLE_REF: ${{ needs.build-production-artifact.outputs.immutable_ref }}
          REUSE_SOURCE_SHA: ${{ needs.reuse-existing-artifact.outputs.source_sha }}
          REUSE_IMMUTABLE_REF: ${{ needs.reuse-existing-artifact.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          if [ -n "$BUILD_SOURCE_SHA" ] && [ -n "$REUSE_SOURCE_SHA" ]; then
            fail "INVARIANT_VIOLATION — build y reuse ambos produjeron salida."
          fi
          if [ -n "$BUILD_SOURCE_SHA" ]; then
            SOURCE_SHA="$BUILD_SOURCE_SHA"; IMMUTABLE_REF="$BUILD_IMMUTABLE_REF"
          elif [ -n "$REUSE_SOURCE_SHA" ]; then
            SOURCE_SHA="$REUSE_SOURCE_SHA"; IMMUTABLE_REF="$REUSE_IMMUTABLE_REF"
          else
            fail "Ni build ni reuse produjeron source_sha."
          fi
          [ "$SOURCE_SHA" = "$EXPECTED_SHA" ] || fail "source_sha no coincide con github.sha."
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=$IMMUTABLE_REF" >> "$GITHUB_OUTPUT"
          echo "verify_pass=YES" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 5 — STAGE 1 únicamente. Crea el admin efímero (cloudsqlsuperuser
  # INTENCIONAL), el ÚNICO secret efímero de este diseño (DSN global — PR
  # #115 P1-B remediation, Phase 3: el secret regional de password fue
  # eliminado por completo), su binding IAM mínimo, y despliega+ejecuta el
  # mismo Cloud Run Job efímero que preflight/apply/verify reutilizan
  # (MIGRATION_EXECUTOR_SA, VPC privada) corriendo
  # `db-hardener-bootstrap.js grant-admin-option` para auto-otorgarse el
  # ADMIN OPTION sobre korixa_app — nunca ExecuteSql API, nunca
  # dataApiAccess, nunca se necesita ni se lee la contraseña de `postgres`.
  # ===========================================================================
  bootstrap-ephemeral-admin:
    name: Bootstrap ephemeral DB admin (stage 1 only)
    needs: [guard, derive-operation-names, verify-prerequisites-instance, resolve-artifact]
    if: |
      !cancelled() &&
      needs.guard.outputs.mode == 'bootstrap_and_preflight' &&
      needs.resolve-artifact.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      ephemeral_admin_username: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
      ephemeral_dsn_secret_name: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Crear usuario PostgreSQL efímero con cloudsqlsuperuser (intencional), crear el secret DSN, y otorgar su IAM
        shell: bash
        env:
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Password fresco, criptográficamente aleatorio, charset
          # alfanumérico-only (evita necesitar url-encoding para construir el
          # DSN). Se usa UNA sola vez, en memoria, para crear el usuario
          # Cloud SQL y construir el DSN — nunca persiste como secret propio
          # (PR #115 P1-B remediation, Phase 3). Nunca se hace echo, nunca se
          # guarda en un archivo, nunca aparece en ningún output de step ni
          # en GITHUB_STEP_SUMMARY.
          EPHEMERAL_PASSWORD="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 40)"
          [ ${#EPHEMERAL_PASSWORD} -ge 32 ] || fail "No se pudo generar un password efímero suficientemente largo."

          gcloud sql users create "$EPHEMERAL_ADMIN" \
            --instance="${{ env.CLOUD_SQL_INSTANCE }}" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --password="$EPHEMERAL_PASSWORD" \
            --database-roles=cloudsqlsuperuser \
            --quiet
          echo "EPHEMERAL_ADMIN_CREATED=YES"

          DSN="postgres://${EPHEMERAL_ADMIN}:${EPHEMERAL_PASSWORD}@${DB_HOST}:5432/${{ env.TARGET_DATABASE }}"

          gcloud secrets create "$EPHEMERAL_DSN_SECRET" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --quiet
          printf '%s' "$DSN" | gcloud secrets versions add "$EPHEMERAL_DSN_SECRET" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --data-file=- \
            --quiet
          unset DSN EPHEMERAL_PASSWORD
          echo "EPHEMERAL_DSN_SECRET_CREATED=YES"
          echo "SECRET_PAYLOAD_PRINTED=NO"

          # Único accesor del DSN SECRET: MIGRATION_EXECUTOR_SA — la
          # identidad bajo la cual corren TODOS los Jobs efímeros de Cloud
          # Run de este workflow (bootstrap-grant/preflight/apply/verify/
          # revoke). DEPLOYER_SA nunca lo necesita.
          gcloud secrets add-iam-policy-binding "$EPHEMERAL_DSN_SECRET" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --member="serviceAccount:${{ env.MIGRATION_EXECUTOR_SA }}" \
            --role=roles/secretmanager.secretAccessor \
            --quiet
          echo "EPHEMERAL_DSN_SECRET_IAM_GRANTED=YES"

      - name: Otorgar ADMIN OPTION sobre korixa_app — Cloud Run Job efímero, VPC privada, db-hardener-bootstrap.js grant-admin-option (sin ExecuteSql API)
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          gcloud run jobs deploy "$EPHEMERAL_JOB" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --region="${{ env.PRODUCTION_REGION }}" \
            --image="$IMMUTABLE_REF" \
            --command=node \
            --args=dist/ops/db-hardener-bootstrap.js \
            --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
            --network=korixa-production-vpc \
            --subnet=korixa-production-sa-east1 \
            --vpc-egress=private-ranges-only \
            --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
            --set-env-vars="BOOTSTRAP_MODE=grant-admin-option,EPHEMERAL_ADMIN_USERNAME=${EPHEMERAL_ADMIN},EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet

          set +e
          gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait
          EXECUTE_EXIT=$?
          set -e
          [ "$EXECUTE_EXIT" -eq 0 ] || fail "Job de grant-admin-option falló (exit=$EXECUTE_EXIT) — ver Cloud Logging para el JSON saneado del bootstrap (nunca DSN/password)."
          echo "TARGET_ADMIN_OPTION_GRANTED=YES"

  # ===========================================================================
  # Job 6 — prerrequisitos de solo lectura (misma disciplina que el workflow
  # legado: nunca crea nada, HOLD fail-closed si algo no puede probarse).
  # Se ejecuta para bootstrap_and_preflight y apply.
  # ===========================================================================
  verify-prerequisites-instance:
    name: Verify Cloud SQL instance reachable (read-only — HOLD if absent)
    needs: guard
    if: needs.guard.outputs.guard_pass == 'YES' && (needs.guard.outputs.mode == 'bootstrap_and_preflight' || needs.guard.outputs.mode == 'apply' || needs.guard.outputs.mode == 'cleanup_only')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      db_host: ${{ steps.cloud-sql.outputs.db_host }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Resolver EXPECTED_DB_HOST (postura de red EXACTA probada estructuradamente, solo lectura)
        id: cloud-sql
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::HOLD_PRODUCTION_DB_NETWORK_POSTURE_DRIFT — $1"; exit 1; }
          command -v python3 >/dev/null 2>&1 || fail "PARSER_UNAVAILABLE — python3 requerido, FAIL_CLOSED."

          # PR #115 P2 remediation: nunca `ipAddresses[0].ipAddress` por
          # índice (un índice no prueba TYPE=PRIVATE ni descarta una IP
          # pública accidental en la posición 0) — JSON completo, parseado
          # estructuradamente, probando cada campo relevante explícitamente.
          INSTANCE_JSON="$(gcloud sql instances describe "${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --format=json)"

          PARSE_RESULT="$(echo "$INSTANCE_JSON" | python3 -c "
          import json, sys

          data = json.load(sys.stdin)

          def hold(msg):
              print('FAIL:' + msg)
              raise SystemExit(0)

          if data.get('name') != '${{ env.CLOUD_SQL_INSTANCE }}':
              hold('instance name mismatch: ' + str(data.get('name')))
          if data.get('project') != '${{ env.PRODUCTION_PROJECT }}':
              hold('project mismatch: ' + str(data.get('project')))
          if data.get('region') != '${{ env.PRODUCTION_REGION }}':
              hold('region mismatch: ' + str(data.get('region')))
          if data.get('state') != 'RUNNABLE':
              hold('state mismatch: ' + str(data.get('state')))
          if data.get('databaseVersion') != '${{ env.EXPECTED_DATABASE_VERSION }}':
              hold('databaseVersion mismatch: ' + str(data.get('databaseVersion')))

          ip_config = (data.get('settings') or {}).get('ipConfiguration') or {}
          if ip_config.get('ipv4Enabled'):
              hold('public IPv4 (ipv4Enabled) is enabled — expected private-only')

          private_network = ip_config.get('privateNetwork') or ''
          expected_network_suffix = '/networks/${{ env.EXPECTED_VPC_NETWORK }}'
          if not private_network.endswith(expected_network_suffix):
              hold('unexpected privateNetwork (VPC contract not intact): ' + private_network)

          addresses = data.get('ipAddresses') or []
          if any(a.get('type') == 'PRIMARY' for a in addresses):
              hold('a public PRIMARY address is present despite expecting private-only posture')

          private_ips = [a.get('ipAddress') for a in addresses if a.get('type') == 'PRIVATE' and a.get('ipAddress')]
          if len(private_ips) != 1:
              hold('expected exactly one usable PRIVATE ip address, found ' + str(len(private_ips)))

          print('OK:' + private_ips[0])
          ")"

          case "$PARSE_RESULT" in
            OK:*) DB_HOST="${PARSE_RESULT#OK:}" ;;
            FAIL:*) fail "${PARSE_RESULT#FAIL:}" ;;
            *) fail "Salida del parser de postura de red no reconocida: '$PARSE_RESULT'" ;;
          esac

          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 7 — STAGE 1: preflight, usando la identidad efímera. Nunca fluye
  # automáticamente hacia apply — ese es un dispatch separado.
  # ===========================================================================
  preflight:
    name: Preflight (stage 1 — ephemeral admin)
    needs: [guard, derive-operation-names, resolve-artifact, verify-prerequisites-instance, bootstrap-ephemeral-admin]
    if: |
      !cancelled() &&
      needs.guard.outputs.mode == 'bootstrap_and_preflight' &&
      needs.resolve-artifact.result == 'success' &&
      needs.bootstrap-ephemeral-admin.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      preflight_result: ${{ steps.execute.outputs.preflight_result }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Crear/actualizar y ejecutar el Job efímero de preflight (solo node dist/ops/db-role-hardener.js)
        id: execute
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          gcloud run jobs deploy "$EPHEMERAL_JOB" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --region="${{ env.PRODUCTION_REGION }}" \
            --image="$IMMUTABLE_REF" \
            --command=node \
            --args=dist/ops/db-role-hardener.js \
            --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
            --network=korixa-production-vpc \
            --subnet=korixa-production-sa-east1 \
            --vpc-egress=private-ranges-only \
            --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
            --set-env-vars="HARDENER_MODE=preflight,EXPECTED_ADMIN_DB_USER=UNPROVEN_PREFLIGHT_ONLY,EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet

          set +e
          gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait --format='value(status.state)' > /tmp/exec_id.txt
          EXECUTE_EXIT=$?
          set -e
          [ "$EXECUTE_EXIT" -eq 0 ] || fail "Job de preflight falló (exit=$EXECUTE_EXIT) — ver Cloud Logging para el JSON saneado del hardener (nunca DSN/password)."
          echo "preflight_result=PASS" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 8 — resumen de STAGE 1. Solo evidencia NO secreta. Explícitamente NO
  # limpia — la identidad efímera debe sobrevivir hasta el dispatch de apply.
  # ===========================================================================
  stage1-summary:
    name: Stage 1 summary — READY_FOR_APPLY_HUMAN_GATE
    needs: [guard, derive-operation-names, prepare-inputs, preflight, bootstrap-ephemeral-admin]
    if: always() && needs.guard.outputs.mode == 'bootstrap_and_preflight'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Emitir evidencia no secreta y próximos pasos
        shell: bash
        run: |
          {
            echo "### T-F1.2 Point 8C — Ephemeral hardener admin — STAGE 1"
            echo ""
            echo "- OPERATION_ID = ${{ needs.derive-operation-names.outputs.operation_id }}"
            echo "- OPERATION_SOURCE_SHA = ${{ needs.prepare-inputs.outputs.source_sha }}"
            echo "- EPHEMERAL_ADMIN_USERNAME = ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}"
            echo "- EPHEMERAL_DSN_SECRET_NAME = ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }} (global — único secret de este diseño, PR #115 P1-B remediation)"
            echo "- PREFLIGHT_RESULT = ${{ needs.preflight.outputs.preflight_result }}"
            echo ""
            if [ "${{ needs.preflight.result }}" = "success" ]; then
              echo "READY_FOR_APPLY_HUMAN_GATE"
              echo ""
              echo "Para continuar: dispatch este mismo workflow con:"
              echo '```'
              echo "mode = apply"
              echo "operation_id = ${{ needs.derive-operation-names.outputs.operation_id }}"
              echo "operation_source_sha = ${{ needs.prepare-inputs.outputs.source_sha }}"
              echo "confirmation = APPLY_EPHEMERAL_HARDENER_HARDEN_KORIXA_APP"
              echo '```'
              echo ""
              echo "**LEASE ACOTADO (PR #115 P1-3)**: esta ventana expira ${{ env.EPHEMERAL_ADMIN_MAX_LIFETIME_SECONDS }}s ($(( ${{ env.EPHEMERAL_ADMIN_MAX_LIFETIME_SECONDS }} / 60 )) min) después de este bootstrap. Un dispatch de apply después de expirar el lease es rechazado (HOLD_OPERATION_LEASE_EXPIRED) y dispara cleanup automático — el admin/secret NUNCA quedan activos indefinidamente por diseño."
              echo "Si apply nunca se dispatchea a tiempo, dispatch mode=cleanup_only con este mismo operation_id (o simplemente intentar apply tras la expiración también dispara el cleanup automáticamente)."
            else
              echo "PREFLIGHT_FAILED — cleanup automático de Stage 1 fue intentado (PR #115 P1-2, job cleanup-after-stage1-failure) para este operation_id. Verificar su resultado en el resumen de ese job."
              echo "Si por algún motivo el cleanup automático no pudo completarse, dispatch mode=cleanup_only con operation_id=${{ needs.derive-operation-names.outputs.operation_id }} como respaldo de recuperación de incidentes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job 8b — CLEANUP AUTOMÁTICO tras una falla de Stage 1 (PR #115 P1-2
  # remediation). Antes de esta remediación, una falla ordinaria de
  # preflight (o una falla parcial de bootstrap-ephemeral-admin — p. ej.
  # falla tras crear el admin pero antes de crear el secret, o tras el
  # secret pero antes del ADMIN OPTION) dejaba deliberadamente el
  # admin/secret/Job efímeros activos hasta que un humano invocara
  # cleanup_only manualmente — inaceptable para una identidad
  # cloudsqlsuperuser. Corre siempre que bootstrap_and_preflight NO logró el
  # camino feliz completo (bootstrap exitoso Y preflight exitoso), sin
  # importar en qué paso exacto falló — el descubrimiento de recursos es
  # idempotente (describe-antes-de-borrar, igual que cleanup_only), así que
  # nunca asume qué llegó a crearse. cleanup_only sigue siendo el respaldo
  # de recuperación de incidentes, ya NO el mecanismo normal de limpieza
  # para una falla ordinaria de preflight.
  # ===========================================================================
  cleanup-after-stage1-failure:
    name: Cleanup after Stage 1 failure (automatic — ordinary preflight/bootstrap failure, not incident recovery)
    needs: [guard, derive-operation-names, resolve-artifact, verify-prerequisites-instance, bootstrap-ephemeral-admin, preflight]
    if: |
      always() &&
      needs.guard.outputs.guard_pass == 'YES' &&
      needs.guard.outputs.mode == 'bootstrap_and_preflight' &&
      !(needs.bootstrap-ephemeral-admin.result == 'success' && needs.preflight.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Descubrir y remover, defensivamente, exactamente los recursos de esta operation_id (idempotente — describe antes de borrar, igual que cleanup_only)
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set +e

          # A — revocar ADMIN OPTION, solo si el admin y el secret DSN siguen
          # existiendo. Vía el mismo Cloud Run Job efímero, VPC privada,
          # `db-hardener-bootstrap.js revoke-admin-option` — nunca ExecuteSql
          # API. Best-effort respecto de IMMUTABLE_REF (P1-7).
          gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          ADMIN_EXISTS_BEFORE=$?
          if [ "$ADMIN_EXISTS_BEFORE" -eq 0 ]; then
            gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
            DSN_SECRET_EXISTS_BEFORE=$?
            if [ "$DSN_SECRET_EXISTS_BEFORE" -eq 0 ] && [ -n "$IMMUTABLE_REF" ]; then
              gcloud run jobs deploy "$EPHEMERAL_JOB" \
                --project="${{ env.PRODUCTION_PROJECT }}" \
                --region="${{ env.PRODUCTION_REGION }}" \
                --image="$IMMUTABLE_REF" \
                --command=node \
                --args=dist/ops/db-hardener-bootstrap.js \
                --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
                --network=korixa-production-vpc \
                --subnet=korixa-production-sa-east1 \
                --vpc-egress=private-ranges-only \
                --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
                --set-env-vars="BOOTSTRAP_MODE=revoke-admin-option,EPHEMERAL_ADMIN_USERNAME=${EPHEMERAL_ADMIN},EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
                --max-retries=0 \
                --task-timeout=300s \
                --quiet >/dev/null 2>&1
              gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait >/dev/null 2>&1
              echo "state=DONE" >> "$GITHUB_OUTPUT"
            else
              echo "state=SKIPPED" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "state=SKIPPED" >> "$GITHUB_OUTPUT"
          fi

          # B — eliminar el admin (idempotente).
          gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            gcloud sql users delete "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --quiet >/dev/null 2>&1
            echo "STAGE1_CLEANUP_B_ATTEMPTED=YES"
          else
            echo "STAGE1_CLEANUP_B_SKIPPED=ADMIN_ALREADY_ABSENT"
          fi

          # C/D — eliminar el secret DSN (idempotente).
          gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            gcloud secrets delete "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" --quiet >/dev/null 2>&1
            echo "STAGE1_CLEANUP_C_D_ATTEMPTED=YES"
          else
            echo "STAGE1_CLEANUP_C_D_SKIPPED=DSN_SECRET_ALREADY_ABSENT"
          fi

          # E — eliminar el Cloud Run Job efímero (idempotente).
          gcloud run jobs describe "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            gcloud run jobs delete "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --quiet >/dev/null 2>&1
            echo "STAGE1_CLEANUP_E_ATTEMPTED=YES"
          else
            echo "STAGE1_CLEANUP_E_SKIPPED=JOB_ALREADY_ABSENT"
          fi

          set -e

      - name: Verificación independiente de ausencia — nunca se declara éxito sin re-comprobar
        shell: bash
        env:
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
        run: |
          set +e
          gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          ADMIN_STILL_EXISTS=$?
          gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          DSN_SECRET_STILL_EXISTS=$?
          gcloud run jobs describe "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" >/dev/null 2>&1
          JOB_STILL_EXISTS=$?
          set -e
          {
            echo "### T-F1.2 Point 8C — cleanup-after-stage1-failure — operation ${{ needs.derive-operation-names.outputs.operation_id }}"
            echo ""
            if [ "$ADMIN_STILL_EXISTS" -ne 0 ] && [ "$DSN_SECRET_STILL_EXISTS" -ne 0 ] && [ "$JOB_STILL_EXISTS" -ne 0 ]; then
              echo "STAGE1_CLEANUP_RESULT = CLEAN (los tres recursos confirmados ausentes: admin, DSN secret, Cloud Run Job)"
            else
              echo "STAGE1_CLEANUP_RESULT = HOLD_STILL_PRESENT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ADMIN_STILL_EXISTS" -eq 0 ] || [ "$DSN_SECRET_STILL_EXISTS" -eq 0 ] || [ "$JOB_STILL_EXISTS" -eq 0 ]; then
            echo "::error::HOLD_STAGE1_CLEANUP_INCOMPLETE — el cleanup automático tras la falla de Stage 1 no logró dejar los tres recursos ausentes. Dispatch mode=cleanup_only con este operation_id."
            exit 1
          fi

  # ===========================================================================
  # Job 9 — STAGE 2 (apply): reverifica el contexto exacto de la operación
  # antes de aplicar CUALQUIER mutación. Cualquier discrepancia -> HOLD.
  # ===========================================================================
  verify-operation-context:
    name: Verify operation context matches stage 1 exactly
    needs: [guard, derive-operation-names]
    if: needs.guard.outputs.guard_pass == 'YES' && needs.guard.outputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      context_verified: ${{ steps.verify.outputs.context_verified }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Confirmar que el admin/secret DSN efímeros de esta operation_id existen exactamente como los dejó stage 1
        id: verify
        shell: bash
        env:
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::HOLD_OPERATION_CONTEXT_DRIFT — $1"; exit 1; }

          ADMIN_ROLES="$(gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --format='value(databaseRoles)' 2>/dev/null || true)"
          [ -n "$ADMIN_ROLES" ] || fail "El admin efímero '$EPHEMERAL_ADMIN' no existe o ya fue eliminado — apply no puede continuar."
          # PR #115 P1-5 remediation: databaseRoles EXACTO del admin efímero
          # (nunca substring/grep) — debe ser EXACTAMENTE [cloudsqlsuperuser],
          # el único set con el que `bootstrap-ephemeral-admin` lo crea. JSON
          # estructurado, nunca parseo de texto.
          command -v python3 >/dev/null 2>&1 || fail "PARSER_UNAVAILABLE — python3 requerido, FAIL_CLOSED."
          ADMIN_DESCRIBE_JSON="$(gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --format=json 2>/dev/null || true)"
          [ -n "$ADMIN_DESCRIBE_JSON" ] || fail "El admin efímero '$EPHEMERAL_ADMIN' no existe o ya fue eliminado — apply no puede continuar."
          ADMIN_ROLES_EXACT="$(echo "$ADMIN_DESCRIBE_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          roles = sorted(data.get('databaseRoles') or [])
          print('EXACT' if roles == ['cloudsqlsuperuser'] else 'DRIFT:' + ','.join(roles))
          ")"
          [ "$ADMIN_ROLES_EXACT" = "EXACT" ] || fail "HOLD_TARGET_DATABASE_ROLES_DRIFT — databaseRoles del admin efímero '$EPHEMERAL_ADMIN' no es EXACTAMENTE [cloudsqlsuperuser]: '$ADMIN_ROLES_EXACT'."

          # --- DSN SECRET (global, único secret de este diseño) — accesor único esperado: MIGRATION_EXECUTOR_SA
          # PR #115 P1-6 remediation: versión EXACTA esperada = 1 (cada
          # secret es recién creado por operación — nunca ':latest', nunca
          # 'al menos una versión ENABLED cualquiera'). Prueba: v1 existe y
          # está ENABLED, Y no existe ninguna otra versión ENABLED
          # (HOLD_OPERATION_SECRET_VERSION_DRIFT si alguna vez se agregó una
          # v2+ inesperada).
          DSN_VERSIONS_JSON="$(gcloud secrets versions list "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" --format=json 2>/dev/null || true)"
          [ -n "$DSN_VERSIONS_JSON" ] || fail "No se pudo listar versiones del DSN secret efímero '$EPHEMERAL_DSN_SECRET'."
          DSN_VERSION_CHECK="$(echo "$DSN_VERSIONS_JSON" | python3 -c "
          import json, sys
          versions = json.load(sys.stdin)
          enabled = sorted((v['name'].rsplit('/', 1)[1] for v in versions if v.get('state') == 'ENABLED'), key=int)
          if enabled == ['1']:
              print('EXACT')
          else:
              print('DRIFT:' + ','.join(enabled))
          ")"
          [ "$DSN_VERSION_CHECK" = "EXACT" ] || fail "HOLD_OPERATION_SECRET_VERSION_DRIFT — las versiones ENABLED del DSN secret efímero '$EPHEMERAL_DSN_SECRET' no son EXACTAMENTE ['1']: '$DSN_VERSION_CHECK'."

          DSN_ACCESSOR="$(gcloud secrets get-iam-policy "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" --format=json | python3 -c "
          import json, sys
          policy = json.load(sys.stdin)
          member = 'serviceAccount:${{ env.MIGRATION_EXECUTOR_SA }}'
          for b in policy.get('bindings', []):
              if b.get('role') == 'roles/secretmanager.secretAccessor':
                  members = b.get('members', [])
                  print('YES' if members == [member] else 'UNEXPECTED:' + ','.join(members))
                  break
          else:
              print('NO')
          ")"
          [ "$DSN_ACCESSOR" = "YES" ] || fail "El binding IAM del DSN secret efímero no es exactamente [MIGRATION_EXECUTOR_SA]: '$DSN_ACCESSOR'"

          # PR #115 P1-3 remediation — lease acotado, machine-enforced. El
          # createTime del secret DSN efímero (metadata YA existente de GCP,
          # sin infraestructura nueva) es el proxy fiable del momento en que
          # bootstrap_and_preflight corrió, ya que ese secret se crea
          # exactamente una vez por operación y nunca se recrea. Si pasaron
          # más de EPHEMERAL_ADMIN_MAX_LIFETIME_SECONDS desde entonces, apply
          # se rechaza — ese rechazo deja context_verified != 'YES', lo que
          # dispara cleanup automático (ver cleanup-after-apply, P1-4).
          DSN_SECRET_DESCRIBE_JSON="$(gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" --format=json 2>/dev/null || true)"
          [ -n "$DSN_SECRET_DESCRIBE_JSON" ] || fail "No se pudo describir el DSN secret efímero para calcular el lease."
          LEASE_CHECK="$(echo "$DSN_SECRET_DESCRIBE_JSON" | python3 -c "
          import json, sys, datetime
          data = json.load(sys.stdin)
          create_time_str = data.get('createTime')
          if not create_time_str:
              print('FAIL:NO_CREATE_TIME')
              raise SystemExit(0)
          create_time = datetime.datetime.fromisoformat(create_time_str.replace('Z', '+00:00'))
          now = datetime.datetime.now(datetime.timezone.utc)
          elapsed_seconds = int((now - create_time).total_seconds())
          max_lifetime = ${{ env.EPHEMERAL_ADMIN_MAX_LIFETIME_SECONDS }}
          if elapsed_seconds > max_lifetime:
              print(f'EXPIRED:{elapsed_seconds}')
          else:
              print(f'OK:{elapsed_seconds}')
          ")"
          case "$LEASE_CHECK" in
            OK:*) echo "OPERATION_LEASE_ELAPSED_SECONDS=${LEASE_CHECK#OK:}" ;;
            EXPIRED:*) fail "HOLD_OPERATION_LEASE_EXPIRED — han pasado ${LEASE_CHECK#EXPIRED:}s desde bootstrap (máximo permitido: ${{ env.EPHEMERAL_ADMIN_MAX_LIFETIME_SECONDS }}s). La ventana acotada de apply expiró para esta operación — dispatch cleanup_only con este operation_id, luego iniciar una operación nueva con bootstrap_and_preflight." ;;
            *) fail "No se pudo calcular el lease del DSN secret efímero (salida no reconocida: '$LEASE_CHECK')." ;;
          esac

          # PR #115 P1-5 remediation: databaseRoles EXACTO de korixa_app —
          # nunca substring/grep. Debe ser EXACTAMENTE [cloudsqlsuperuser],
          # el único estado real, documentado y conocido de Producción hoy
          # (la premisa completa de este esfuerzo de endurecimiento). Un rol
          # adicional o faltante nunca se asume seguro de remover en bloque
          # vía `assign-roles --revoke-existing-roles` más abajo.
          TARGET_DESCRIBE_JSON="$(gcloud sql users describe "${{ env.TARGET_ROLE }}" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --format=json)"
          TARGET_ROLES_EXACT="$(echo "$TARGET_DESCRIBE_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          roles = sorted(data.get('databaseRoles') or [])
          print('EXACT' if roles == ['cloudsqlsuperuser'] else 'DRIFT:' + ','.join(roles))
          ")"
          [ "$TARGET_ROLES_EXACT" = "EXACT" ] || fail "HOLD_TARGET_DATABASE_ROLES_DRIFT — databaseRoles de '${{ env.TARGET_ROLE }}' no es EXACTAMENTE [cloudsqlsuperuser]: '$TARGET_ROLES_EXACT'. No se reintenta sobre un estado no probado — nunca se asume seguro remover roles en bloque vía assign-roles --revoke-existing-roles sobre un set inesperado."

          echo "context_verified=YES" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 10 — apply real, usando la identidad efímera exacta.
  # ===========================================================================
  apply:
    name: Apply (stage 2 — ephemeral admin)
    needs: [guard, derive-operation-names, resolve-artifact, verify-prerequisites-instance, verify-operation-context]
    if: |
      !cancelled() &&
      needs.guard.outputs.mode == 'apply' &&
      needs.resolve-artifact.result == 'success' &&
      needs.verify-operation-context.outputs.context_verified == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      apply_result: ${{ steps.execute.outputs.apply_result }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Crear/actualizar y ejecutar el Job efímero de apply (solo node dist/ops/db-role-hardener.js)
        id: execute
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          gcloud run jobs deploy "$EPHEMERAL_JOB" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --region="${{ env.PRODUCTION_REGION }}" \
            --image="$IMMUTABLE_REF" \
            --command=node \
            --args=dist/ops/db-role-hardener.js \
            --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
            --network=korixa-production-vpc \
            --subnet=korixa-production-sa-east1 \
            --vpc-egress=private-ranges-only \
            --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
            --set-env-vars="HARDENER_MODE=apply,EXPECTED_ADMIN_DB_USER=${EPHEMERAL_ADMIN},EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA,HARDEN_CONFIRMATION=HARDEN_KORIXA_APP_PRODUCTION" \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet

          set +e
          gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait
          EXECUTE_EXIT=$?
          set -e
          [ "$EXECUTE_EXIT" -eq 0 ] || fail "Job de apply falló (exit=$EXECUTE_EXIT) — ver Cloud Logging para el JSON saneado del hardener."
          echo "apply_result=HARDENED" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 11 — remoción de cloudsqlsuperuser de korixa_app. SOLO vía Cloud SQL
  # Admin API (assign-roles --revoke-existing-roles) — NUNCA SQL REVOKE,
  # probado ineficaz contra este rol específico en la investigación de
  # cleanroom (TF12-POINT8C-CLOUDSQL-CREATEROLE-ESCALATION-CLEANROOM-PROOF).
  # ===========================================================================
  remove-target-cloudsqlsuperuser:
    name: Remove korixa_app cloudsqlsuperuser (Admin API only)
    needs: [guard, apply]
    if: needs.guard.outputs.mode == 'apply' && needs.apply.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      removal_result: ${{ steps.remove.outputs.removal_result }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: assign-roles --revoke-existing-roles sobre korixa_app, luego verificar en ambas capas
        id: remove
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          gcloud sql users assign-roles "${{ env.TARGET_ROLE }}" \
            --instance="${{ env.CLOUD_SQL_INSTANCE }}" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --type=BUILT_IN \
            --revoke-existing-roles \
            --quiet

          REMAINING_ROLES="$(gcloud sql users describe "${{ env.TARGET_ROLE }}" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --format='value(databaseRoles)')"
          [ -z "$REMAINING_ROLES" ] || fail "TARGET_CLOUDSQLSUPERUSER_REMOVAL_FAILED — databaseRoles todavía contiene: '$REMAINING_ROLES' (metadata Cloud SQL)."

          echo "removal_result=PASS" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 12 — verify real (DB-level, vía el propio hardener) — confirma tanto
  # el estado SQL como la ausencia de cloudsqlsuperuser leída directamente
  # del catálogo de Postgres, no solo de la metadata de Cloud SQL.
  # ===========================================================================
  verify:
    name: Verify (stage 2 — ephemeral admin, still alive)
    needs: [guard, derive-operation-names, resolve-artifact, verify-prerequisites-instance, remove-target-cloudsqlsuperuser]
    if: needs.guard.outputs.mode == 'apply' && needs.remove-target-cloudsqlsuperuser.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      verify_disposition_ok: ${{ steps.execute.outputs.verify_disposition_ok }}
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Ejecutar el Job efímero en modo verify y confirmar SQL_AND_CLOUDSQL_FULLY_HARDENED
        id: execute
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::HOLD_VERIFY_NOT_FULLY_HARDENED — $1"; exit 1; }

          gcloud run jobs deploy "$EPHEMERAL_JOB" \
            --project="${{ env.PRODUCTION_PROJECT }}" \
            --region="${{ env.PRODUCTION_REGION }}" \
            --image="$IMMUTABLE_REF" \
            --command=node \
            --args=dist/ops/db-role-hardener.js \
            --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
            --network=korixa-production-vpc \
            --subnet=korixa-production-sa-east1 \
            --vpc-egress=private-ranges-only \
            --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
            --set-env-vars="HARDENER_MODE=verify,EXPECTED_ADMIN_DB_USER=ignored-by-verify,EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet

          set +e
          gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait
          EXECUTE_EXIT=$?
          set -e
          # PR #115 P1-1 remediation: `db-role-hardener.js` en mode=verify
          # ahora tiene un gate ESTRICTO machine-enforced
          # (`assertVerifyFullyHardened`) — el proceso Node SIEMPRE sale con
          # exit != 0 salvo que el disposition sea EXACTAMENTE
          # SQL_AND_CLOUDSQL_FULLY_HARDENED. Este EXECUTE_EXIT ya no es solo
          # "el Job corrió sin excepciones" — es la prueba real y suficiente
          # de fully-hardened. Nunca se depende de inspección humana de
          # Cloud Logging para decidir OPERATION_OK.
          [ "$EXECUTE_EXIT" -eq 0 ] || fail "Job de verify falló o el disposition no es SQL_AND_CLOUDSQL_FULLY_HARDENED (exit=$EXECUTE_EXIT) — ver Cloud Logging para el JSON saneado (nunca DSN/password) con el disposition exacto."

          echo "verify_disposition_ok=YES" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 13 — CLEANUP, siempre intentado (Phase 11). PR #115 P1-4/P1-7
  # remediation: corre para CUALQUIER dispatch mode=apply con guard_pass=YES
  # — ya NO exige `verify-operation-context.outputs.context_verified ==
  # 'YES'` (esa condición ocultaba exactamente el caso que más necesita
  # cleanup automático: context/secret/admin-role/target-role drift, o
  # incluso una falla de resolución de artefacto ANTES del SQL apply — ver
  # P1-4). Tampoco depende de que resolve-artifact haya tenido éxito (P1-7)
  # — la eliminación del admin/secret/Job nunca debe bloquearse por una
  # falla de Artifact Registry; el revoke vía Cloud Run Job es best-effort
  # (falla con warning, nunca bloquea B-E) y eliminar el admin ya remueve su
  # membresía de todos modos.
  # ===========================================================================
  cleanup-after-apply:
    name: Cleanup (always attempted after apply)
    needs: [guard, derive-operation-names, resolve-artifact, verify-prerequisites-instance, verify-operation-context, apply, remove-target-cloudsqlsuperuser, verify]
    if: always() && needs.guard.outputs.guard_pass == 'YES' && needs.guard.outputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Estado A — revocar ADMIN OPTION temporal (mientras el admin efímero todavía existe) — Cloud Run Job efímero, VPC privada, db-hardener-bootstrap.js revoke-admin-option (sin ExecuteSql API)
        id: revoke-admin-option
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set +e
          gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          DSN_SECRET_EXISTS=$?
          if [ "$DSN_SECRET_EXISTS" -ne 0 ]; then
            echo "DSN secret efímero ya ausente — nada que revocar vía él."
            REVOKE_EXIT=0
          elif [ -z "$IMMUTABLE_REF" ]; then
            # PR #115 P1-7: resolve-artifact es best-effort para cleanup — si
            # no hay imagen resuelta (Artifact Registry caído/build falló),
            # el revoke se salta con una razón explícita; B-E nunca dependen
            # de esto.
            echo "IMMUTABLE_REF no disponible (falla de resolución de artefacto) — revoke salteado, cleanup continúa igual."
            REVOKE_EXIT=1
          else
            gcloud run jobs deploy "$EPHEMERAL_JOB" \
              --project="${{ env.PRODUCTION_PROJECT }}" \
              --region="${{ env.PRODUCTION_REGION }}" \
              --image="$IMMUTABLE_REF" \
              --command=node \
              --args=dist/ops/db-hardener-bootstrap.js \
              --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
              --network=korixa-production-vpc \
              --subnet=korixa-production-sa-east1 \
              --vpc-egress=private-ranges-only \
              --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
              --set-env-vars="BOOTSTRAP_MODE=revoke-admin-option,EPHEMERAL_ADMIN_USERNAME=${EPHEMERAL_ADMIN},EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
              --max-retries=0 \
              --task-timeout=300s \
              --quiet
            gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait
            REVOKE_EXIT=$?
          fi
          set -e
          if [ "$REVOKE_EXIT" -eq 0 ]; then
            echo "state=DONE" >> "$GITHUB_OUTPUT"
          else
            echo "state=FAILED" >> "$GITHUB_OUTPUT"
            echo "::warning::Cleanup A (revoke ADMIN OPTION) falló — se continúa igual con B-E, nunca se detiene el cleanup ante un solo fallo parcial."
          fi

      - name: Estado B — eliminar el usuario PostgreSQL efímero (idempotente — ausente ya es éxito)
        id: delete-admin
        shell: bash
        env:
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
        run: |
          set +e
          gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          EXISTS=$?
          if [ "$EXISTS" -ne 0 ]; then
            echo "Admin efímero ya ausente — cleanup idempotente, éxito."
            echo "state=DONE" >> "$GITHUB_OUTPUT"
          else
            gcloud sql users delete "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --quiet
            DELETE_EXIT=$?
            set -e
            if [ "$DELETE_EXIT" -eq 0 ]; then
              echo "state=DONE" >> "$GITHUB_OUTPUT"
            else
              echo "state=FAILED" >> "$GITHUB_OUTPUT"
              echo "::error::Cleanup B (delete ephemeral admin) falló — HOLD requerido, no se oculta detrás del resultado de apply."
            fi
          fi

      - name: Estado C/D — eliminar el DSN SECRET (global) efímero (elimina también su binding IAM implícitamente, ya que el recurso desaparece)
        id: delete-dsn-secret
        shell: bash
        env:
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set +e
          gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          EXISTS=$?
          if [ "$EXISTS" -ne 0 ]; then
            echo "DSN secret efímero ya ausente — cleanup idempotente, éxito."
            echo "state=DONE" >> "$GITHUB_OUTPUT"
          else
            gcloud secrets delete "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" --quiet
            DELETE_EXIT=$?
            set -e
            if [ "$DELETE_EXIT" -eq 0 ]; then
              echo "state=DONE" >> "$GITHUB_OUTPUT"
            else
              echo "state=FAILED" >> "$GITHUB_OUTPUT"
              echo "::error::Cleanup C/D (delete ephemeral DSN secret) falló — HOLD requerido."
            fi
          fi

      - name: "Estado E — eliminar el Cloud Run Job efímero (idempotente — ausente ya es éxito; Phase 7 remediación P1-B: recurso antes nunca rastreado/eliminado)"
        id: delete-job
        shell: bash
        env:
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
        run: |
          set +e
          gcloud run jobs describe "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" >/dev/null 2>&1
          EXISTS=$?
          if [ "$EXISTS" -ne 0 ]; then
            echo "Cloud Run Job efímero ya ausente — cleanup idempotente, éxito."
            echo "state=DONE" >> "$GITHUB_OUTPUT"
          else
            gcloud run jobs delete "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --quiet
            DELETE_EXIT=$?
            set -e
            if [ "$DELETE_EXIT" -eq 0 ]; then
              echo "state=DONE" >> "$GITHUB_OUTPUT"
            else
              echo "state=FAILED" >> "$GITHUB_OUTPUT"
              echo "::error::Cleanup E (delete ephemeral Cloud Run Job) falló — HOLD requerido."
            fi
          fi

      - name: Estado F — verificación independiente de ausencia (admin + secret DSN + Cloud Run Job)
        id: independent-verify
        shell: bash
        env:
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
        run: |
          set +e
          gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          ADMIN_STILL_EXISTS=$?
          gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          DSN_SECRET_STILL_EXISTS=$?
          gcloud run jobs describe "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" >/dev/null 2>&1
          JOB_STILL_EXISTS=$?
          set -e
          if [ "$ADMIN_STILL_EXISTS" -eq 0 ] || [ "$DSN_SECRET_STILL_EXISTS" -eq 0 ] || [ "$JOB_STILL_EXISTS" -eq 0 ]; then
            echo "independent_absence_verified=NO" >> "$GITHUB_OUTPUT"
          else
            echo "independent_absence_verified=YES" >> "$GITHUB_OUTPUT"
          fi

      - name: Clasificar resultado final — nunca esconder un cleanup incompleto detrás de "la operación falló"
        if: always()
        shell: bash
        env:
          APPLY_RESULT: ${{ needs.apply.result }}
          REMOVE_RESULT: ${{ needs.remove-target-cloudsqlsuperuser.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          ADMIN_OPTION_STATE: ${{ steps.revoke-admin-option.outputs.state }}
          DELETE_ADMIN_STATE: ${{ steps.delete-admin.outputs.state }}
          DELETE_DSN_SECRET_STATE: ${{ steps.delete-dsn-secret.outputs.state }}
          DELETE_JOB_STATE: ${{ steps.delete-job.outputs.state }}
          INDEPENDENT_VERIFIED: ${{ steps.independent-verify.outputs.independent_absence_verified }}
        run: |
          OPERATION_OK="NO"
          if [ "$APPLY_RESULT" = "success" ] && [ "$REMOVE_RESULT" = "success" ] && [ "$VERIFY_RESULT" = "success" ]; then
            OPERATION_OK="YES"
          fi

          CLEANUP_OK="NO"
          if [ "$ADMIN_OPTION_STATE" = "DONE" ] && [ "$DELETE_ADMIN_STATE" = "DONE" ] && [ "$DELETE_DSN_SECRET_STATE" = "DONE" ] && [ "$DELETE_JOB_STATE" = "DONE" ] && [ "$INDEPENDENT_VERIFIED" = "YES" ]; then
            CLEANUP_OK="YES"
          fi

          {
            echo "### T-F1.2 Point 8C — Ephemeral hardener admin — CLEANUP RESULT"
            echo "- OPERATION_OK = $OPERATION_OK"
            echo "- CLEANUP_OK = $CLEANUP_OK"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$OPERATION_OK" = "NO" ] && [ "$CLEANUP_OK" = "NO" ]; then
            echo "::error::HOLD_OPERATION_FAILED_AND_PRIVILEGED_CLEANUP_INCOMPLETE — máxima severidad operacional. Dispatch mode=cleanup_only con este operation_id INMEDIATAMENTE."
            exit 1
          fi
          if [ "$CLEANUP_OK" = "NO" ]; then
            echo "::error::HOLD_CLEANUP_INCOMPLETE — la operación SQL pudo haber tenido éxito, pero recursos privilegiados siguen activos. Dispatch mode=cleanup_only con este operation_id."
            exit 1
          fi
          if [ "$OPERATION_OK" = "NO" ]; then
            echo "::warning::La operación falló pero el cleanup se completó — ningún recurso privilegiado quedó huérfano."
          fi

  # ===========================================================================
  # Job 14 — CLEANUP_ONLY (Phase 12; terminología corregida en PR #115
  # final-integration remediation, Phase 6). Recuperación de incidentes.
  # Descubre y remueve solo los recursos de esta operation_id exacta,
  # idempotente. La propiedad de seguridad exigida NO es "no crea nada" —
  # puede desplegar/re-desplegar el Cloud Run Job efímero exacto de esta
  # operación (nunca uno nuevo o distinto) cuando es necesario para revocar
  # el ADMIN OPTION por el camino VPC privado antes de eliminar el admin. La
  # propiedad real, siempre verdadera: nunca puede crear ni elevar una
  # identidad PostgreSQL, un secret, un privilegio IAM, una membresía de rol/
  # target, ni un privilegio de aplicación.
  # ===========================================================================
  cleanup-only:
    name: Cleanup only (incident recovery — manual OR automatic post-apply-rejection)
    # PR #115 P1-7 remediation: ya NO exige `needs.resolve-artifact.result ==
    # 'success'` — la resolución de artefacto (build/reuse desde Artifact
    # Registry) es OPTIONAL/BEST_EFFORT para cleanup, nunca un prerrequisito
    # duro. Si Artifact Registry está caído o el build falla, la eliminación
    # de recursos privilegiados (admin/secret/Job) NUNCA debe bloquearse por
    # eso — solo el intento de revoke vía el Cloud Run Job (que sí necesita
    # una imagen) se degrada silenciosamente a "no se pudo intentar", y el
    # resto del cleanup continúa igual.
    #
    # PR #115 P1-4a remediation: además del dispatch manual mode=cleanup_only,
    # este job también corre AUTOMÁTICAMENTE cuando guard rechazó un dispatch
    # apply específicamente por drift de SHA (`sha_drift_detected == 'YES'`)
    # — esa es exactamente la clase de "operación existente, sintácticamente
    # válida, rechazada antes del SQL apply" que P1-4 exige limpiar sin
    # depender de una segunda acción manual del operador. En esa rama,
    # resolve-artifact/verify-prerequisites-instance típicamente estarán
    # SKIPPED (guard_pass fue NO) — sus outputs se leen como cadena vacía,
    # lo cual el paso de revoke ya maneja de forma benigna (P1-7: salta el
    # intento de revoke, continúa igual con la eliminación de admin/secret/
    # Job).
    needs: [guard, derive-operation-names, resolve-artifact, verify-prerequisites-instance]
    if: |
      always() &&
      needs.derive-operation-names.result == 'success' &&
      ((needs.guard.outputs.guard_pass == 'YES' && needs.guard.outputs.mode == 'cleanup_only') ||
       needs.guard.outputs.sha_drift_detected == 'YES')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Google Auth — WIF to Production deployer SA
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PRODUCTION_PROJECT }}
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-production-deployer
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Descubrir y remover, defensivamente, exactamente los recursos de esta operation_id (nunca crea nada salvo — si el admin todavía existe — el Cloud Run Job efímero, necesario para revocar por el camino VPC privado)
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
          SOURCE_SHA: ${{ needs.resolve-artifact.outputs.source_sha }}
          DB_HOST: ${{ needs.verify-prerequisites-instance.outputs.db_host }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
        run: |
          set +e

          # A — revocar ADMIN OPTION, solo si el admin y el secret DSN siguen
          # existiendo (si el admin ya no existe, la membresía ya no existe
          # con él — nada que hacer, no es un error). Vía el mismo Cloud Run
          # Job efímero, VPC privada, `db-hardener-bootstrap.js
          # revoke-admin-option` — nunca ExecuteSql API.
          gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          ADMIN_EXISTS_BEFORE=$?
          if [ "$ADMIN_EXISTS_BEFORE" -eq 0 ]; then
            gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
            DSN_SECRET_EXISTS_BEFORE=$?
            # PR #115 P1-7: resolve-artifact es best-effort para cleanup —
            # si no hay IMMUTABLE_REF (p. ej. Artifact Registry caído/build
            # falló), el revoke se salta con una razón explícita, en vez de
            # intentar un `gcloud run jobs deploy --image=""` que fallaría
            # igual pero de forma menos clara. B/C-D/E nunca dependen de esto.
            if [ "$DSN_SECRET_EXISTS_BEFORE" -eq 0 ] && [ -n "$IMMUTABLE_REF" ]; then
              gcloud run jobs deploy "$EPHEMERAL_JOB" \
                --project="${{ env.PRODUCTION_PROJECT }}" \
                --region="${{ env.PRODUCTION_REGION }}" \
                --image="$IMMUTABLE_REF" \
                --command=node \
                --args=dist/ops/db-hardener-bootstrap.js \
                --service-account="${{ env.MIGRATION_EXECUTOR_SA }}" \
                --network=korixa-production-vpc \
                --subnet=korixa-production-sa-east1 \
                --vpc-egress=private-ranges-only \
                --set-secrets="MIGRATION_DATABASE_URL=${EPHEMERAL_DSN_SECRET}:1" \
                --set-env-vars="BOOTSTRAP_MODE=revoke-admin-option,EPHEMERAL_ADMIN_USERNAME=${EPHEMERAL_ADMIN},EXPECTED_DATABASE=${{ env.TARGET_DATABASE }},EXPECTED_DB_HOST=$DB_HOST,EXPECTED_SOURCE_SHA=$SOURCE_SHA" \
                --max-retries=0 \
                --task-timeout=300s \
                --quiet >/dev/null 2>&1
              gcloud run jobs execute "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --wait >/dev/null 2>&1
              echo "CLEANUP_A_ATTEMPTED=YES"
            elif [ "$DSN_SECRET_EXISTS_BEFORE" -ne 0 ]; then
              echo "CLEANUP_A_SKIPPED=DSN_SECRET_ALREADY_ABSENT (nada que revocar vía él)"
            else
              echo "CLEANUP_A_SKIPPED=ARTIFACT_UNAVAILABLE (P1-7: no bloquea B/C-D/E)"
            fi
            # B — eliminar el admin.
            gcloud sql users delete "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" --quiet >/dev/null 2>&1
            echo "CLEANUP_B_ATTEMPTED=YES"
          else
            echo "CLEANUP_A_B_SKIPPED=ADMIN_ALREADY_ABSENT"
          fi

          # C/D — eliminar el DSN secret (global).
          gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          DSN_SECRET_EXISTS_BEFORE=$?
          if [ "$DSN_SECRET_EXISTS_BEFORE" -eq 0 ]; then
            gcloud secrets delete "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" --quiet >/dev/null 2>&1
            echo "CLEANUP_C_D_ATTEMPTED=YES"
          else
            echo "CLEANUP_C_D_SKIPPED=DSN_SECRET_ALREADY_ABSENT"
          fi

          # E — eliminar el Cloud Run Job efímero (Phase 7 remediación P1-B).
          gcloud run jobs describe "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" >/dev/null 2>&1
          JOB_EXISTS_BEFORE=$?
          if [ "$JOB_EXISTS_BEFORE" -eq 0 ]; then
            gcloud run jobs delete "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" --quiet >/dev/null 2>&1
            echo "CLEANUP_E_ATTEMPTED=YES"
          else
            echo "CLEANUP_E_SKIPPED=JOB_ALREADY_ABSENT"
          fi

          set -e

      - name: Verificación independiente de ausencia — nunca se declara éxito sin re-comprobar
        shell: bash
        env:
          EPHEMERAL_ADMIN: ${{ needs.derive-operation-names.outputs.ephemeral_admin_username }}
          EPHEMERAL_DSN_SECRET: ${{ needs.derive-operation-names.outputs.ephemeral_dsn_secret_name }}
          EPHEMERAL_JOB: ${{ needs.derive-operation-names.outputs.ephemeral_job_name }}
        run: |
          set +e
          gcloud sql users describe "$EPHEMERAL_ADMIN" --instance="${{ env.CLOUD_SQL_INSTANCE }}" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          ADMIN_STILL_EXISTS=$?
          gcloud secrets describe "$EPHEMERAL_DSN_SECRET" --project="${{ env.PRODUCTION_PROJECT }}" >/dev/null 2>&1
          DSN_SECRET_STILL_EXISTS=$?
          gcloud run jobs describe "$EPHEMERAL_JOB" --project="${{ env.PRODUCTION_PROJECT }}" --region="${{ env.PRODUCTION_REGION }}" >/dev/null 2>&1
          JOB_STILL_EXISTS=$?
          set -e
          {
            echo "### T-F1.2 Point 8C — cleanup_only — operation ${{ needs.derive-operation-names.outputs.operation_id }}"
            echo ""
            echo "- ORIGINAL_OPERATION_SHA = ${{ inputs.operation_source_sha != '' && inputs.operation_source_sha || 'NOT_PROVIDED_BY_OPERATOR' }} (audit-only, never enforced for cleanup_only — Phase 14: recovery may legitimately run newer trusted cleanup code)"
            echo "- CLEANUP_IMPLEMENTATION_SHA = ${{ github.sha }}"
            echo ""
            if [ "$ADMIN_STILL_EXISTS" -ne 0 ] && [ "$DSN_SECRET_STILL_EXISTS" -ne 0 ] && [ "$JOB_STILL_EXISTS" -ne 0 ]; then
              echo "CLEANUP_ONLY_RESULT = CLEAN (los tres recursos confirmados ausentes: admin, DSN secret, Cloud Run Job)"
            else
              echo "CLEANUP_ONLY_RESULT = HOLD_STILL_PRESENT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ADMIN_STILL_EXISTS" -eq 0 ] || [ "$DSN_SECRET_STILL_EXISTS" -eq 0 ] || [ "$JOB_STILL_EXISTS" -eq 0 ]; then
            echo "::error::HOLD_PRIVILEGED_CLEANUP_INCOMPLETE — CLEANUP_ONLY no logró dejar los tres recursos ausentes — reintentar o escalar."
            exit 1
          fi
