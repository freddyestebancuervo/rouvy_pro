name: Backend — Production identity smoke bootstrap

# T-F1.2 Block D2B1 — este archivo permanece con disparo manual
# (workflow_dispatch) y guard main-only sin OIDC. Después del guard, este
# workflow invoca al reusable _backend-build-publish-production.yml con
# la operation seleccionada explícitamente por quien dispara el run:
#
# identity-smoke (default): ÚNICAMENTE una prueba de autenticación (WIF →
# Artifact Publisher Service Account → access token de corta duración).
# No publica ningún artefacto, no construye ninguna imagen. Diseñada y
# congelada en T-F1.2 D1F0/D1F0-R1, versionada en D1F1, ejecutada
# funcionalmente en D1F2.
#
# build-publish: WIF → Artifact Publisher Service Account → docker build
# del backend → push al repositorio Production korixa-backend →
# resolución de digest inmutable. Diseñada y congelada en T-F1.2
# D2B0-R0, versionada en D2B1. Su primera ejecución real requiere una
# autorización separada e independiente (bloque D2B2 o equivalente).
#
# Ninguna de las dos operaciones toca Cloud Run/Cloud SQL/Secret Manager
# en ningún momento — esa capacidad permanece en production-deploy.yml /
# _backend-deploy-cloud-run-production.yml, deliberadamente inertes y no
# tocados por este archivo.
#
# SECURITY:
# id-token: write se concede EXCLUSIVAMENTE al job que invoca al
# reusable — el job guard permanece sin ningún permiso (permissions: {})
# y sin capacidad de solicitar un token OIDC. Cualquier valor de
# operation distinto de identity-smoke/build-publish falla fail-closed
# dentro del reusable, antes de cualquier job con id-token.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operación a ejecutar contra la identidad WIF de Production."
        required: true
        type: choice
        default: identity-smoke
        options:
          - identity-smoke
          - build-publish

permissions:
  contents: read

jobs:
  guard:
    name: Guard — main only (sin acceso cloud, sin OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Sin id-token, sin checkout, sin gcloud, sin docker — este job no
    # tiene capacidad de tocar ningún recurso fuera de este runner.
    permissions: {}
    steps:
      - name: Rechazar refs/eventos/operaciones inesperadas
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          echo "EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "REF=$GITHUB_REF"
          echo "REF_TYPE=$GITHUB_REF_TYPE"
          echo "OPERATION=$OPERATION"

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::Evento inesperado: $GITHUB_EVENT_NAME"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Solo se admite una branch; ref_type=$GITHUB_REF_TYPE"
            exit 1
          fi

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Bloqueado: solo refs/heads/main puede continuar. Ref recibida: $GITHUB_REF"
            exit 1
          fi

          if [ "$OPERATION" != "identity-smoke" ] && [ "$OPERATION" != "build-publish" ]; then
            echo "::error::operation no soportada: $OPERATION"
            exit 1
          fi

          echo "GUARD=PASS"

  identity-smoke:
    name: Artifact WIF auth-only smoke (via reusable)
    needs: guard
    permissions:
      contents: read
      id-token: write
    uses: freddyestebancuervo/rouvy_pro/.github/workflows/_backend-build-publish-production.yml@main
    with:
      source_sha: ${{ github.sha }}
      operation: ${{ inputs.operation }}
