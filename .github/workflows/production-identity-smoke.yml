name: Backend — Production identity smoke bootstrap

# T-F1.2 Block D1F1 (docs/audits/AUDITORIA_FINAL/BACKLOG_MAESTRO.md) — este
# archivo permanece con disparo manual (workflow_dispatch) y guard
# main-only sin OIDC. Después del guard, este workflow ahora invoca al
# reusable _backend-build-publish-production.yml con operation=identity-smoke,
# habilitando ÚNICAMENTE una prueba de autenticación (WIF → Artifact
# Publisher Service Account → access token de corta duración). No publica
# ningún artefacto, no construye ninguna imagen, no toca Cloud Run/Cloud
# SQL/Secret Manager en ningún momento.
#
# Esta activación fue diseñada y congelada en T-F1.2 D1F0/D1F0-R1
# (read-only preflight) y versionada en T-F1.2 D1F1. Este workflow NO ha
# sido ejecutado (workflow_dispatch) todavía — su primera ejecución real
# requiere una autorización separada e independiente (T-F1.2 D1F2).
#
# SECURITY:
# id-token: write se concede EXCLUSIVAMENTE al job identity-smoke que
# invoca al reusable — el job guard permanece sin ningún permiso
# (permissions: {}) y sin capacidad de solicitar un token OIDC.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    name: Guard — main only (sin acceso cloud, sin OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Sin id-token, sin checkout, sin gcloud, sin docker — este job no
    # tiene capacidad de tocar ningún recurso fuera de este runner.
    permissions: {}
    steps:
      - name: Rechazar refs distintas de main
        shell: bash
        run: |
          echo "EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "REF=$GITHUB_REF"
          echo "REF_TYPE=$GITHUB_REF_TYPE"

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::Evento inesperado: $GITHUB_EVENT_NAME"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Solo se admite una branch; ref_type=$GITHUB_REF_TYPE"
            exit 1
          fi

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Bloqueado: solo refs/heads/main puede continuar. Ref recibida: $GITHUB_REF"
            exit 1
          fi

          echo "GUARD=PASS"

  identity-smoke:
    name: Artifact WIF auth-only smoke (via reusable)
    needs: guard
    permissions:
      contents: read
      id-token: write
    uses: freddyestebancuervo/rouvy_pro/.github/workflows/_backend-build-publish-production.yml@main
    with:
      source_sha: ${{ github.sha }}
      operation: identity-smoke
