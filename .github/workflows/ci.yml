name: CI

# Se ejecuta automáticamente en cada push/PR — y también se puede disparar
# a mano desde la pestaña "Actions" de GitHub (botón "Run workflow"),
# accesible desde el navegador del celular sin necesidad de terminal.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

# Ninguno de los 4 jobs escribe al repositorio, publica paquetes, ni
# necesita id-token OIDC — solo leen el código para analizarlo/probarlo.
permissions:
  contents: read

jobs:
  # =========================================================================
  # Job 1 — Tests del cliente Flutter (análisis estático + tests unitarios)
  # =========================================================================
  flutter-checks:
    name: Flutter — analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Escaneo de secretos de alta confianza, fail-closed, ANTES de
      # instalar cualquier dependencia — si detecta un match, este mismo
      # required check (Flutter — analyze + test) falla. Solo patrones de
      # muy alta confianza; nunca genérico tipo password=/secret=/token=
      # para evitar falsos positivos contra configuración/datos ficticios
      # de test ya presentes en el repo (p. ej.
      # POSTGRES_PASSWORD=devpassword). Nunca imprime el valor
      # coincidente, solo el nombre del archivo.
      #
      # PEM/AWS/GitHub/Slack se bloquean en CUALQUIER archivo tracked,
      # sin excepción. Google API keys (AIza...) son, por diseño de
      # Firebase/Google, configuración de cliente pública (restringidas
      # por dominio/plataforma en la consola de Firebase, no secretas) —
      # se toleran EXCLUSIVAMENTE en estos 6 archivos de configuración de
      # cliente ya conocidos y auditados; una AIza... en cualquier otro
      # path sigue haciendo fallar el check igual que cualquier otro
      # patrón. La allowlist es de paths exactos, nunca wildcard.
      - name: Escaneo de secretos de alta confianza (fail-closed)
        shell: bash
        run: |
          set -euo pipefail

          ALWAYS_BLOCK_PATTERN='-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[0-9A-Za-z-]+'
          GOOGLE_API_KEY_PATTERN='AIza[0-9A-Za-z_-]{35}'

          ALWAYS_MATCH_FILE="$(mktemp)"
          GOOGLE_MATCH_FILE="$(mktemp)"
          trap 'rm -f "$ALWAYS_MATCH_FILE" "$GOOGLE_MATCH_FILE"' EXIT

          if git grep -I -l -E -e "$ALWAYS_BLOCK_PATTERN" -- . > "$ALWAYS_MATCH_FILE"; then
            echo "::error::Posible secreto de alta confianza detectado en archivos tracked (PEM/AWS/GitHub/Slack)."
            echo "Archivos afectados:"
            sed 's/^/ - /' "$ALWAYS_MATCH_FILE"
            exit 1
          fi

          if git grep -I -l -E -e "$GOOGLE_API_KEY_PATTERN" -- . > "$GOOGLE_MATCH_FILE"; then
            while IFS= read -r FILE; do
              case "$FILE" in
                android/app/google-services.json|\
                android/app/src/development/google-services.json|\
                ios/Runner/Firebase/Development/GoogleService-Info.plist|\
                ios/Runner/Firebase/Production/GoogleService-Info.plist|\
                lib/firebase_options.dart|\
                lib/firebase_options_development.dart)
                  ;;
                *)
                  echo "::error::Google API key detectada fuera de la allowlist exacta de configuración de cliente Firebase."
                  echo "Archivo inesperado: $FILE"
                  exit 1
                  ;;
              esac
            done < "$GOOGLE_MATCH_FILE"
          fi

          echo "SECRET_SCAN=PASS"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.32.0'
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código (equivalente a "flutter analyze")
        run: flutter analyze --fatal-infos

      - name: Correr todos los tests unitarios
        run: flutter test --coverage

      # El reporte de cobertura queda disponible como artefacto
      # descargable desde la propia página del run en GitHub — no hace
      # falta ninguna herramienta adicional para verlo.
      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: flutter-coverage
          path: coverage/lcov.info

  # =========================================================================
  # Job 2 — Tests de seguridad de Firestore (A3/A5, ROADMAP_M0_M1.md)
  # =========================================================================
  firestore-rules-tests:
    name: Firestore — reglas de seguridad (A3/A5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firebase/rules-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@14.27.0

      - name: Instalar dependencias del proyecto de tests
        run: npm install

      - name: Correr la suite de seguridad contra el emulador
        run: npm test

  # =========================================================================
  # Job 3 — Tests e2e del backend (C2, ROADMAP_M0_M1.md), con Postgres real
  # =========================================================================
  backend-tests:
    name: Backend — migración + e2e (C2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    # GitHub Actions puede levantar un contenedor de servicio junto al
    # job — esto es una instancia de Postgres REAL, no un mock, corriendo
    # en la propia infraestructura de GitHub durante el run. Es
    # exactamente el mismo Postgres que `VERIFICATION_GUIDE.md` pedía
    # levantar con Docker localmente, solo que acá lo levanta CI solo.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ridepro
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: ridepro_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ridepro:devpassword@localhost:5432/ridepro_dev
      NODE_ENV: test
      # T-F0.2 Puerta F: declarado explicitamente — REDIS_URL (abajo) sigue
      # presente, la suite Redis/multi-instancia sigue corriendo contra
      # Redis real en este job.
      BACKEND_ENVIRONMENT: development
      REDIS_URL: redis://localhost:6379/15
      # Par de claves efímero, exclusivo de este job — generado en el paso
      # de abajo, nunca committeado (ver backend/.gitignore: secrets/).
      # Mismos nombres/paths que backend/.env.example, para que
      # TokenService.onModuleInit() (que exige ambas variables o falla al
      # arrancar) no necesite ninguna rama especial para CI.
      JWT_PRIVATE_KEY_PATH: ./secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: ./secrets/jwt_public.pem
      # FirebaseAdminModule exige esta variable para arrancar (Bloque 4,
      # feat/d2-firebase-auth-bridge) — proyecto ficticio, no real: los
      # tests de este job mockean FirebaseTokenVerifierService, nunca
      # llaman a la API de Firebase de verdad, así que no hace falta un
      # proyecto ni credenciales reales, solo que la variable exista.
      FIREBASE_PROJECT_ID: ridepro-ci
      FIREBASE_CHECK_REVOKED: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Instalar dependencias (reproducible, engine-strict)
        env:
          NPM_CONFIG_ENGINE_STRICT: "true"
        run: npm ci

      - name: Verificar runtime Node 24 (assertion estructurada, no confiar solo en setup-node)
        run: |
          ACTUAL_NODE_VERSION="$(node --version)"
          echo "ACTUAL_NODE_VERSION=$ACTUAL_NODE_VERSION"
          if [[ "$ACTUAL_NODE_VERSION" != v24.* ]]; then
            echo "::error::Runtime Node no es major 24: $ACTUAL_NODE_VERSION"
            exit 1
          fi
          echo "NODE24_RUNTIME_ASSERTION=PASS"

      - name: Auditoría de seguridad runtime (npm audit --omit=dev, fail-closed en HIGH/CRITICAL)
        run: |
          set +e
          npm audit --omit=dev --json > audit_output.json
          set -e

          node -e "
            const fs = require('fs');
            let data;
            try {
              data = JSON.parse(fs.readFileSync('audit_output.json', 'utf8'));
            } catch (err) {
              console.error('::error::npm audit no devolvió JSON válido: ' + err.message);
              process.exit(1);
            }

            const vulns = data && data.metadata && data.metadata.vulnerabilities;
            if (!vulns || typeof vulns.high !== 'number' || typeof vulns.critical !== 'number') {
              console.error('::error::metadata.vulnerabilities ausente o con campos high/critical inválidos');
              process.exit(1);
            }

            console.log('RUNTIME_AUDIT_TOTAL=' + vulns.total);
            console.log('RUNTIME_AUDIT_LOW=' + vulns.low);
            console.log('RUNTIME_AUDIT_MODERATE=' + vulns.moderate);
            console.log('RUNTIME_AUDIT_HIGH=' + vulns.high);
            console.log('RUNTIME_AUDIT_CRITICAL=' + vulns.critical);

            if (vulns.critical > 0) {
              console.error('::error::RUNTIME_SECURITY_GATE=FAIL — ' + vulns.critical + ' vulnerabilidad(es) CRITICAL en dependencias de producción.');
              process.exit(1);
            }
            if (vulns.high > 0) {
              console.error('::error::RUNTIME_SECURITY_GATE=FAIL — ' + vulns.high + ' vulnerabilidad(es) HIGH en dependencias de producción.');
              process.exit(1);
            }

            console.log('RUNTIME_SECURITY_GATE=PASS');
          "
          rm -f audit_output.json

      # T-F1.4: lint y typecheck explícitos, no-mutantes, dentro del required
      # check del backend. Se usan los binarios instalados por `npm ci` desde
      # package-lock; --incremental false evita artefactos .tsbuildinfo.
      - name: Lint backend (read-only)
        run: ./node_modules/.bin/eslint "{src,test}/**/*.ts"

      - name: Typecheck backend (tsc --noEmit)
        run: ./node_modules/.bin/tsc --noEmit --incremental false

      - name: Generar par de claves JWT (efímero, solo para este job)
        run: |
          mkdir -p secrets
          openssl genrsa -out secrets/jwt_private.pem 2048
          openssl rsa -in secrets/jwt_private.pem -pubout -out secrets/jwt_public.pem

      # T-F1.2 (P2): backend/src/**/*.spec.ts no corría en ningún required
      # check — jest.config.js (rootDir=src, testRegex=.spec.ts$) es
      # exclusivamente unitario (pg/firebase-admin mockeados, sin acceso
      # real a red/DB/Redis/GCP), así que corre antes de tocar Postgres.
      - name: Correr los tests unitarios (backend/src/**/*.spec.ts)
        run: npm test -- --runInBand

      # Hallazgo de auditoría 2026-07-23: este paso solo aplicaba
      # 0001_init.sql con psql -f directo — desde que 0002-0004 existen
      # (Bloque C/D), tanto el arranque del servidor como los e2e de
      # equipment/workouts fallaban por tablas/constraints inexistentes.
      # `migrate:up` (node-pg-migrate) aplica TODAS las migraciones
      # pendientes en orden, es el método que los propios archivos de
      # migración documentan, y es idempotente (seguro reejecutar).
      - name: Aplicar todas las migraciones pendientes
        run: npm run migrate:up

      - name: Levantar el servidor y verificar /v1/health
        run: |
          npm run start:dev &
          npx wait-on http://localhost:3000/v1/health --timeout 30000
          curl -sf http://localhost:3000/v1/health | tee health_response.json
          kill %1

      - name: Correr los tests e2e
        run: npm run test:e2e

  # =========================================================================
  # Job 4 — Suite de seguridad del Night Agent (tools/night-agent/**)
  # =========================================================================
  night-agent-tests:
    name: Night Agent — security + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read — tools/night-agent/test/ci-evidence-authority.test.mjs's
    # real, no-override attestor tests make genuine read-only `gh api
    # repos/.../actions/runs` / `.../jobs` calls against THIS repository (see
    # that file's own header comment). GH_TOKEN is scoped to the single step
    # that actually runs the suite, never the whole job -- no other step here
    # needs GitHub API access.
    permissions:
      contents: read
      actions: read
    steps:
      # fetch-depth: 0 (full history) — tools/night-agent/test/evidence-policy.test.mjs
      # clones this checkout's own working tree to build real, identity-verified
      # fixtures (see that file's own header comment) and needs a genuine
      # historical commit from this project's actual history to exist as a real
      # Git object. The default shallow checkout (fetch-depth: 1) doesn't carry
      # it, which is exactly what made this job fail on its first automatic run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verificar runtime Node 24
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_NODE_VERSION="$(node --version)"
          echo "ACTUAL_NODE_VERSION=$ACTUAL_NODE_VERSION"

          if [[ "$ACTUAL_NODE_VERSION" != v24.* ]]; then
            echo "::error::Runtime Node no es major 24: $ACTUAL_NODE_VERSION"
            exit 1
          fi

          echo "NIGHT_AGENT_NODE24_RUNTIME_ASSERTION=PASS"

      - name: Correr suite Night Agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --test tools/night-agent/test/*.test.mjs
