name: Backend — publish Staging (SKELETON — mechanically inert, no real resources)

# TASK21-PHASE21B (T-F1.3, Fase 21B — preparación provider-neutral),
# actualizado por KORIXA-PR117-FINAL-D8-WORKFLOW-REMEDIATION-20260903. Este
# archivo es DELIBERADAMENTE un esqueleto sin capacidad de despliegue
# real — no existe ningún proyecto GCP/Firebase de staging (Fase 21A,
# `docs/audits/AUDITORIA_FINAL/23_MATRIZ_FORMAL_ENTORNOS.md`: "No
# iniciado" en las 16 dimensiones), ningún WIF provider, ninguna cuenta
# de servicio, ningún Cloud Run service, ninguna Cloud SQL/Postgres
# instance. La condición de la decisión D8 del propietario (Documento 15
# §D8) ya está SATISFECHA — la auditoría de reconciliación dedicada
# (`TASK21-D8-STAGING-RECONCILIATION-PREFLIGHT-20260903`) probó en vivo
# que las 10 puertas de Development están cumplidas; D8 ya NO bloquea
# Staging. Eso NO autoriza, por sí solo, crear ningún recurso real de
# Staging — la creación de esos recursos sigue exigiendo sus propios
# Human Gates explícitos y separados (Fases 21C/21D/21E de T-F1.3).
#
# Por eso este workflow:
#   - NO otorga el permiso OIDC de emisión de token — no hay ningún step
#     de autenticación WIF, así que ni siquiera podría emitir un token
#     OIDC útil.
#   - NO referencia ningún `environment:` de GitHub — ese Environment
#     `staging` no existe todavía y crearlo está fuera del alcance de
#     esta tarea.
#   - NO contiene ningún project ID, WIF provider, service account,
#     nombre de servicio Cloud Run, ni bucket/secret real — de Producción,
#     Development, o inventado — en ninguna parte de este archivo.
#   - Su único job (`guard`) SIEMPRE falla, explícita e
#     intencionalmente, con un mensaje que documenta exactamente qué
#     Human Gate falta. No hay ningún job de build/push/deploy — "no
#     deployment job yet" es el patrón elegido explícitamente (ver tarea
#     TASK21-PHASE21B-PROVIDER-NEUTRAL-STAGING-IMPLEMENTATION-20260903,
#     Goal 7: "Acceptable patterns include: no deployment job yet").
#   - `hardener-workflow-contract.spec.ts`-style: ver
#     `backend/src/ops/staging-workflow-contract.spec.ts` para la prueba
#     automatizada de que este archivo nunca adquiere un project
#     ID/WIF/SA real de Producción o Development por accidente.
#
# Disparo manual únicamente — igual que el resto de los workflows de
# despliegue de este repositorio. Ejecutarlo hoy no hace nada más que
# fallar con un mensaje explicativo; no toca ningún recurso cloud.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    name: Guard — staging deploy NO autorizado todavía (esqueleto inerte)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Bloquear siempre — ningún recurso real de Staging existe todavía (D8 ya satisfecha, no es el bloqueo)
        shell: bash
        run: |
          echo "::error::HOLD_STAGING_DEPLOY_NOT_AUTHORIZED — este workflow es un esqueleto provider-neutral (TASK21-PHASE21B). No existe ningún proyecto GCP/Firebase de staging, ningún WIF provider, ninguna cuenta de servicio, ningún Cloud Run service ni ninguna base de datos de staging (Documento 23, Matriz Formal de Entornos: 'No iniciado' en las 16 dimensiones). La decisión D8 del propietario (Documento 15) ya está SATISFECHA — reconciliada de forma independiente y en vivo (TASK21-D8-STAGING-RECONCILIATION-PREFLIGHT-20260903) — y ya NO es la razón de este bloqueo. Este dispatch nunca desplegará nada, sin importar qué inputs se le den, hasta que las Fases 21C/21D/21E de T-F1.3 provisionen los recursos reales de Staging bajo sus propios Human Gates explícitos y separados (creación del proyecto Firebase/GCP, decisión del proveedor de PostgreSQL, e infraestructura real)."
          exit 1
