name: (reusable) Backend — build & publish Production artifact

# T-F1.2 Block D2B1 — este reusable admite dos operaciones:
#
# operation=identity-smoke: prueba de autenticación WIF (checkout pinned
# → google-github-actions/auth pinned como ARTIFACT_PUBLISHER_SA → access
# token de 300s → verificación no sensible de outputs). Sin build, sin
# push. Versionada en T-F1.2 D1F1, ejecutada funcionalmente en D1F2.
#
# operation=build-publish: WIF como ARTIFACT_PUBLISHER_SA → docker build
# del backend → verificación de label OCI de revisión → precheck de
# colisión de immutable tag (fail-closed) → docker push al repositorio
# Production korixa-backend → resolución y validación de digest → emisión
# de referencia inmutable repository@sha256:<digest>. Nunca Cloud Run,
# nunca Cloud SQL, nunca Secret Manager, nunca tráfico (ver T-F1.2-B0.3,
# separación de capacidad por identidad).
#
# Cualquier otro valor de `operation` falla explícitamente (fail-closed)
# antes de llegar a cualquier job con id-token.
#
# SECURITY:
# id-token: write se concede ÚNICAMENTE a los jobs auth-smoke y
# build-publish, y solo después de que validate-contract confirme una
# operation soportada y la integridad de source_sha. En identity-smoke el
# access token generado nunca se imprime, nunca se persiste en un
# credentials file (create_credentials_file=false) y nunca se exporta
# como variable de entorno (export_environment_variables=false). En
# build-publish nunca se imprimen tokens, credenciales ni cabeceras de
# autorización — únicamente SHAs, referencias de imagen y digests.

on:
  workflow_call:
    inputs:
      source_sha:
        description: "SHA exacto ya validado por CI que este reusable construirá/publicará (o, para identity-smoke, el SHA del evento que disparó la prueba)."
        required: true
        type: string
      operation:
        description: "Operación solicitada: identity-smoke o build-publish."
        required: true
        type: string
    outputs:
      source_sha:
        description: "SOURCE_SHA publicado (solo operation=build-publish)."
        value: ${{ jobs.build-publish.outputs.source_sha }}
      image_tag_ref:
        description: "Referencia de imagen por tag determinístico (solo operation=build-publish)."
        value: ${{ jobs.build-publish.outputs.image_tag_ref }}
      artifact_digest:
        description: "Digest resuelto en Artifact Registry tras el push (solo operation=build-publish)."
        value: ${{ jobs.build-publish.outputs.artifact_digest }}
      immutable_ref:
        description: "Referencia inmutable repository@sha256:<digest> — única referencia válida para deploy (solo operation=build-publish)."
        value: ${{ jobs.build-publish.outputs.immutable_ref }}

permissions:
  contents: read

jobs:
  validate-contract:
    name: Validate contract (sin checkout, sin OIDC, sin cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Sin id-token, sin checkout — este job solo valida los inputs
    # recibidos antes de que exista cualquier capacidad OIDC.
    permissions: {}
    steps:
      - name: Validar operation y source_sha (sin efectos, sin cloud)
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$OPERATION" != "identity-smoke" ] && [ "$OPERATION" != "build-publish" ]; then
            echo "::error::operation no soportada: $OPERATION"
            exit 1
          fi
          echo "OPERATION_VALID=YES"

          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha con formato inválido"
            exit 1
          fi
          if ! [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::github.sha con formato inválido"
            exit 1
          fi
          echo "SOURCE_SHA_VALID=YES"

          if [ "$SOURCE_SHA" != "$EVENT_SHA" ]; then
            echo "::error::source_sha no coincide con github.sha"
            exit 1
          fi
          echo "SOURCE_SHA_MATCH_EVENT_SHA=YES"

  auth-smoke:
    name: Artifact WIF auth-only smoke
    needs: validate-contract
    if: inputs.operation == 'identity-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (requerido por google-github-actions/auth, sin persistir credenciales)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Google Auth — WIF → Artifact Publisher SA (access token de 300s)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ridepro-dbafe
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-artifact-publisher
          service_account: korixa-artifact-publisher@ridepro-dbafe.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify auth outputs (sin revelar el token)
        shell: bash
        env:
          AUTH_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          if [ "$AUTH_PROJECT_ID" != "ridepro-dbafe" ]; then
            echo "::error::project_id inesperado"
            exit 1
          fi
          echo "PROJECT_ID_MATCH=YES"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::access_token vacío"
            exit 1
          fi
          echo "ACCESS_TOKEN_PRESENT=YES"

          echo "WIF_AUTH_SMOKE=PASS"

          {
            echo "### Production Artifact WIF auth-only smoke"
            echo ""
            echo "- PROJECT_ID_MATCH: YES"
            echo "- ACCESS_TOKEN_PRESENT: YES"
            echo "- WIF_AUTH_SMOKE: PASS"
            echo ""
            echo "No image build, no push, no Cloud Run, no Cloud SQL, no Secret Manager, no migration occurred in this run."
          } >> "$GITHUB_STEP_SUMMARY"

  build-publish:
    name: Build & publish Production artifact
    needs: validate-contract
    if: inputs.operation == 'build-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout SOURCE_SHA (sin persistir credenciales)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verificar SHA fuente exacto antes de autenticar
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"

          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha no tiene formato de SHA-1 completo (40 hex): '$SOURCE_SHA'"
            exit 1
          fi

          if ! [[ "$CHECKED_OUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::El HEAD del checkout no tiene formato de SHA-1 completo (40 hex): '$CHECKED_OUT_SHA'"
            exit 1
          fi

          if [ "$CHECKED_OUT_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::El working tree del runner ($CHECKED_OUT_SHA) no coincide con SOURCE_SHA ($SOURCE_SHA)."
            exit 1
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Google Auth — WIF → Artifact Publisher SA
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ridepro-dbafe
          workload_identity_provider: projects/731660820861/locations/global/workloadIdentityPools/github-actions-pool/providers/github-artifact-publisher
          service_account: korixa-artifact-publisher@ridepro-dbafe.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Verificar projectId ANTES de cualquier acceso a Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_PROJECT="$(gcloud config get-value project)"
          if [ "$ACTUAL_PROJECT" != "ridepro-dbafe" ]; then
            echo "::error::PROJECT MISMATCH: esperado ridepro-dbafe, obtenido '$ACTUAL_PROJECT'"
            exit 1
          fi
          echo "PROJECT_ID_MATCH=YES"

      - name: Precheck de colisión de immutable tag (fail-closed, antes de build y de push)
        id: tag-precheck
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail

          IMAGE_PATH="southamerica-east1-docker.pkg.dev/ridepro-dbafe/korixa-backend/api"
          IMAGE_TAG_REF="${IMAGE_PATH}:${SOURCE_SHA}"

          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::IMMUTABLE_TAG_PRECHECK=PARSER_UNAVAILABLE — python3 no está disponible en el runner. FAIL_CLOSED."
            exit 1
          fi

          LIST_STDOUT="$(mktemp)"
          LIST_STDERR="$(mktemp)"

          cleanup() {
            rm -f "$LIST_STDOUT" "$LIST_STDERR"
          }
          trap cleanup EXIT

          set +e
          gcloud artifacts docker images list "$IMAGE_PATH" \
            --include-tags \
            --project=ridepro-dbafe \
            --format=json \
            >"$LIST_STDOUT" \
            2>"$LIST_STDERR"
          LIST_EXIT=$?
          set -e

          if [ "$LIST_EXIT" -ne 0 ]; then
            echo "::error::IMMUTABLE_TAG_PRECHECK=LOOKUP_ERROR — docker images list terminó con exit=$LIST_EXIT. FAIL_CLOSED."
            exit 1
          fi

          set +e
          MATCH_COUNT="$(
            python3 - "$SOURCE_SHA" "$LIST_STDOUT" <<'PY'
          import json
          import sys

          source_sha = sys.argv[1]
          json_path = sys.argv[2]

          try:
              with open(json_path, "r", encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, json.JSONDecodeError):
              sys.exit(20)

          if not isinstance(payload, list):
              sys.exit(21)

          match_count = 0

          for image in payload:
              if not isinstance(image, dict):
                  sys.exit(22)

              tags = image.get("tags", [])

              if tags is None:
                  tags = []

              if not isinstance(tags, list):
                  sys.exit(23)

              for tag in tags:
                  if not isinstance(tag, str):
                      sys.exit(24)

                  if tag == source_sha:
                      match_count += 1

          print(match_count)
          PY
          )"
          PARSE_EXIT=$?
          set -e

          if [ "$PARSE_EXIT" -ne 0 ]; then
            echo "::error::IMMUTABLE_TAG_PRECHECK=LOOKUP_ERROR — stdout no cumple el JSON estructurado esperado; parser_exit=$PARSE_EXIT. FAIL_CLOSED."
            exit 1
          fi

          if ! [[ "$MATCH_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::IMMUTABLE_TAG_PRECHECK=LOOKUP_ERROR — match_count inválido. FAIL_CLOSED."
            exit 1
          fi

          case "$MATCH_COUNT" in
            0)
              echo "IMMUTABLE_TAG_PRECHECK=TAG_NOT_FOUND"
              ;;
            1)
              echo "::error::IMMUTABLE_TAG_PRECHECK=TAG_ALREADY_EXISTS — el tag $SOURCE_SHA ya existe en korixa-backend. FAIL_CLOSED, sin reintento."
              exit 1
              ;;
            *)
              echo "::error::IMMUTABLE_TAG_PRECHECK=INVARIANT_VIOLATION — el tag exacto $SOURCE_SHA apareció $MATCH_COUNT veces. FAIL_CLOSED."
              exit 1
              ;;
          esac

          echo "image_tag_ref=$IMAGE_TAG_REF" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker exclusivamente para Artifact Registry southamerica-east1
        shell: bash
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Build, con label OCI de revisión
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          IMAGE_TAG_REF: ${{ steps.tag-precheck.outputs.image_tag_ref }}
        run: |
          docker build --no-cache \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            -t "${IMAGE_TAG_REF}" \
            ./backend

      - name: Verificar label OCI de revisión en la imagen local ANTES de publicar
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          IMAGE_TAG_REF: ${{ steps.tag-precheck.outputs.image_tag_ref }}
        run: |
          set -euo pipefail
          ACTUAL_LABEL="$(docker image inspect "$IMAGE_TAG_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$ACTUAL_LABEL" != "$SOURCE_SHA" ]; then
            echo "::error::org.opencontainers.image.revision de la imagen local ('$ACTUAL_LABEL') no coincide con SOURCE_SHA ('$SOURCE_SHA')."
            exit 1
          fi
          echo "IMAGE_REVISION_LABEL_VERIFIED=YES"

      - name: Push imagen etiquetada por commit SHA (referencia determinística, nunca latest)
        shell: bash
        env:
          IMAGE_TAG_REF: ${{ steps.tag-precheck.outputs.image_tag_ref }}
        run: docker push "${IMAGE_TAG_REF}"

      - name: Resolver y validar digest publicado
        id: digest
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          IMAGE_TAG_REF: ${{ steps.tag-precheck.outputs.image_tag_ref }}
        run: |
          set -euo pipefail

          ARTIFACT_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG_REF" --project=ridepro-dbafe --format='value(image_summary.digest)')"

          if ! [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ARTIFACT_DIGEST no tiene formato sha256 válido (esperado ^sha256:[0-9a-f]{64}$): '$ARTIFACT_DIGEST'"
            exit 1
          fi

          IMMUTABLE_REF="southamerica-east1-docker.pkg.dev/ridepro-dbafe/korixa-backend/api@${ARTIFACT_DIGEST}"

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag_ref=$IMAGE_TAG_REF" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=$IMMUTABLE_REF" >> "$GITHUB_OUTPUT"

      - name: Reporte de publicación (sin datos sensibles)
        shell: bash
        run: |
          {
            echo "### Production artifact build & publish"
            echo ""
            echo "- PROJECT_ID = ridepro-dbafe"
            echo "- SOURCE_SHA = ${{ steps.digest.outputs.source_sha }}"
            echo "- IMAGE_TAG_REF = ${{ steps.digest.outputs.image_tag_ref }}"
            echo "- ARTIFACT_DIGEST = ${{ steps.digest.outputs.artifact_digest }}"
            echo "- IMMUTABLE_REF = ${{ steps.digest.outputs.immutable_ref }}"
            echo "- WIF_AUTH = PASS"
            echo "- ARTIFACT_PUSH = PASS"
            echo ""
            echo "No Cloud Run, no Cloud SQL, no Secret Manager, no migration occurred in this run."
          } >> "$GITHUB_STEP_SUMMARY"
    outputs:
      source_sha: ${{ steps.digest.outputs.source_sha }}
      image_tag_ref: ${{ steps.digest.outputs.image_tag_ref }}
      artifact_digest: ${{ steps.digest.outputs.artifact_digest }}
      immutable_ref: ${{ steps.digest.outputs.immutable_ref }}
