name: T-F2.5 lockfile reconcile (temporary)

on:
  push:
    branches:
      - chore/tf25-remove-dead-dependencies-20260825
    paths:
      - .github/workflows/tf25-lockfile-reconcile-344.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/tf25-remove-dead-dependencies-20260825
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Restore canonical main lockfile then resolve only pubspec removals
        shell: bash
        run: |
          set -euo pipefail
          git checkout d6b7d65755bfc6c44d9403e417cad585e13fe4c7 -- pubspec.lock
          flutter --version
          flutter pub get

      - name: Assert task scope and self-remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- pubspec.yaml
          git rm .github/workflows/tf25-lockfile-reconcile-344.yml
          git add pubspec.lock
          CHANGED="$(git diff --cached --name-only)"
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Ev '^(pubspec\.lock|\.github/workflows/tf25-lockfile-reconcile-344\.yml)$' | grep -q .; then
            echo '::error::Unexpected file outside T-F2.5 lockfile reconciliation scope.'
            exit 1
          fi

      - name: Commit reconciled lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(tf2.5): preserve unrelated locked versions'
          git push origin HEAD:chore/tf25-remove-dead-dependencies-20260825
