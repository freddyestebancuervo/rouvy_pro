name: iOS — simulator smoke test

# Job EXPERIMENTAL y aislado — valida que RidePro compile, se instale y
# arranque en un simulador de iOS hospedado por GitHub, sin firma de
# código ni Apple ID. No ejecuta pruebas funcionales, UI automation,
# login, Firebase, HealthKit, Apple Sign-In ni permisos — solo confirma
# que el proceso de la app sigue vivo unos segundos después de lanzarla
# y que no se generó ningún reporte de crash. No se declara check
# obligatorio en esta primera versión.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-simulator-smoke.yml'

permissions:
  contents: read

jobs:
  ios-simulator-smoke:
    name: iOS — simulator smoke test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment diagnostics
        run: |
          echo "=== sw_vers ==="
          sw_vers
          echo "=== xcodebuild -version ==="
          xcodebuild -version
          echo "=== simuladores disponibles (runtimes) ==="
          xcrun simctl list runtimes
          echo ""
          echo "=== dispositivos iPhone disponibles ==="
          xcrun simctl list devices available | grep -E "^-- iOS|iPhone" || echo "Ningun simulador de iPhone disponible en este runner"

      - name: Set up Flutter 3.32.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable

      - name: Flutter doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      # Build específico para simulador — NO reutiliza el build de
      # dispositivo (`--no-codesign`) de otro workflow: el simulador usa
      # su propio slice de arquitectura y nunca requiere firma en
      # absoluto, con o sin --no-codesign.
      - name: Build iOS for Simulator
        run: flutter build ios --debug --simulator -v

      - name: Boot iOS Simulator
        id: boot_sim
        run: |
          SIM_LINE=$(xcrun simctl list devices available | grep -m1 -E "iPhone.*\([0-9A-Fa-f-]{36}\)")
          if [ -z "$SIM_LINE" ]; then
            echo "NO_SIMULATOR_AVAILABLE=true" >> "$GITHUB_OUTPUT"
            echo "No se encontró ningún simulador de iPhone disponible en este runner."
            exit 1
          fi
          SIM_UDID=$(echo "$SIM_LINE" | grep -oE '\([0-9A-Fa-f-]{36}\)' | tr -d '()')
          echo "Simulador elegido: $SIM_LINE"
          echo "sim_udid=$SIM_UDID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "Simulador arrancado correctamente: $SIM_UDID"

      - name: Install Runner.app on Simulator
        run: |
          SIM_UDID="${{ steps.boot_sim.outputs.sim_udid }}"
          APP_PATH=$(find build/ios/iphonesimulator -maxdepth 1 -iname "Runner.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app no encontrado en build/ios/iphonesimulator"
            exit 1
          fi
          echo "Instalando $APP_PATH en $SIM_UDID"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          echo "Instalación completada."

      - name: Launch app and monitor for immediate crash
        run: |
          SIM_UDID="${{ steps.boot_sim.outputs.sim_udid }}"
          BUNDLE_ID="com.ridepro.app"

          # Captura de logs del simulador en segundo plano durante toda
          # la ventana de observación.
          xcrun simctl spawn "$SIM_UDID" log stream --level debug --style compact > sim_console.log 2>&1 &
          LOG_PID=$!

          # Marca de tiempo justo antes de lanzar, para filtrar solo
          # reportes de crash generados DESPUÉS de este punto.
          touch /tmp/pre_launch_marker

          echo "Lanzando $BUNDLE_ID..."
          LAUNCH_OUTPUT=$(xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID")
          echo "$LAUNCH_OUTPUT"
          APP_PID=$(echo "$LAUNCH_OUTPUT" | grep -oE '[0-9]+$')

          if [ -z "$APP_PID" ]; then
            echo "CRASH_STATUS=launch_failed" >> crash_status.txt
            echo "No se pudo obtener un PID — el lanzamiento no devolvió el formato esperado."
          else
            echo "PID de la app: $APP_PID"
            echo "Esperando 15 segundos para observar un crash inmediato..."
            sleep 15

            if ps -p "$APP_PID" > /dev/null 2>&1; then
              echo "STILL_RUNNING=true"
              echo "CRASH_STATUS=no_crash_detected" >> crash_status.txt
            else
              echo "STILL_RUNNING=false"
              echo "CRASH_STATUS=process_exited" >> crash_status.txt
            fi
          fi

          kill "$LOG_PID" 2>/dev/null || true
          sleep 1

          echo ""
          echo "=== busqueda de reportes de crash generados durante esta ventana ==="
          CRASH_REPORTS=$(find "$HOME/Library/Logs/DiagnosticReports" -iname "*Runner*" -newer /tmp/pre_launch_marker 2>/dev/null || true)
          if [ -n "$CRASH_REPORTS" ]; then
            echo "$CRASH_REPORTS"
            echo "CRASH_STATUS=crash_report_found" >> crash_status.txt
            cp $CRASH_REPORTS . 2>/dev/null || true
          else
            echo "Ningun reporte de crash encontrado."
          fi

          echo "=== resumen final ==="
          cat crash_status.txt || echo "sin archivo de estado"

      - name: Upload simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke-logs
          path: |
            sim_console.log
            crash_status.txt
            *.ips
            *.crash
          if-no-files-found: ignore
